name: Risk route diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: risk-route-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
  NEXT_TELEMETRY_DISABLED: "1"
  SF_TEST_ROOT: /tmp/sahelflow-risk-diagnostic
  SF_DATA_DIR: /tmp/sahelflow-risk-diagnostic/data
  DATABASE_URL: file:/tmp/sahelflow-risk-diagnostic/data/shops/test.db
  AUTH_SECRET: dev-auth-secret-for-testing-only-not-production
  SF_PHASE5_OWNER_STORAGE_STATE: /tmp/sahelflow-risk-diagnostic/owner-storage-state.json

jobs:
  risk-route:
    name: Reproduce Risk runtime exception
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare diagnostic sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-risk-diagnostic

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Seed representative Algerian COD data
        run: bun run seed:rich

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run isolated Risk diagnostic
        run: bunx playwright test --retries=0 e2e/risk-route-diagnostics.spec.ts

      - name: Upload Risk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-route-diagnostic-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
