name: Runtime WebView native diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/runtime-webview-native-diagnostic.yml
      - .github/diagnostics/runtime-browser-diagnostic-route.ts
      - .github/diagnostics/runtime-webview-initialization.js
      - scripts/instrument-native-webview-diagnostics.ps1
      - scripts/diagnose-installed-webview.ps1
      - scripts/observe-installed-webview-cdp.mjs

permissions:
  contents: read

concurrency:
  group: runtime-webview-native-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Verify exact redirect repair in installed WebView
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 80f03768d5c45c9df24412ce750e766ad9dcb13f
      DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
      SF_LICENSE_SERVICE_URL: "https://license.invalid"
      SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'

    steps:
      - name: Fetch diagnostic tools without marketplace actions
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credential" fetch `
            --no-tags origin $env:DIAGNOSTIC_HEAD_SHA $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach --force $env:DIAGNOSTIC_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve diagnostic instrumentation outside exact checkout
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-native-webview-tools'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Copy-Item -LiteralPath 'scripts/instrument-native-webview-diagnostics.ps1' `
            -Destination $toolRoot -Force
          Copy-Item -LiteralPath 'scripts/diagnose-installed-webview.ps1' `
            -Destination $toolRoot -Force
          Copy-Item -LiteralPath 'scripts/observe-installed-webview-cdp.mjs' `
            -Destination $toolRoot -Force
          Copy-Item -LiteralPath '.github/diagnostics/runtime-browser-diagnostic-route.ts' `
            -Destination $toolRoot -Force
          Copy-Item -LiteralPath '.github/diagnostics/runtime-webview-initialization.js' `
            -Destination $toolRoot -Force

      - name: Checkout exact handoff source
        shell: pwsh
        run: |
          git checkout --detach --force $env:SOURCE_SHA
          $actual = git rev-parse HEAD
          if ($actual -cne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, found $actual"
          }

      - name: Apply observation-only native instrumentation
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-native-webview-tools'
          & (Join-Path $toolRoot 'instrument-native-webview-diagnostics.ps1') `
            -TemplateRoot $toolRoot `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ExpectedSource $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-native-webview-diagnostic'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          git diff --binary | Out-File `
            -FilePath (Join-Path $evidenceRoot 'observation-only.patch') `
            -Encoding utf8
          [pscustomobject]@{
            sourceSha = $env:SOURCE_SHA
            diagnosticHeadSha = $env:DIAGNOSTIC_HEAD_SHA
            productionBehaviorFixApplied = $false
          } | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $evidenceRoot 'provenance.json') -Encoding utf8

      - name: Install exact Bun without marketplace actions
        shell: pwsh
        run: |
          npm install --global bun@1.3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((bun --version).Trim() -cne '1.3.14') {
            throw "Exact Bun 1.3.14 was not installed."
          }

      - name: Install exact frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Verify preinstalled Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Build one exact observation-only MSI
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'src-tauri/target/release/bundle/msi' `
            -Recurse -Force -ErrorAction SilentlyContinue
          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -LiteralPath .sf-native-webview-diagnostic-tauri.json -Encoding utf8
          & bunx tauri build --bundles msi `
            --config .sf-native-webview-diagnostic-tauri.json 2>&1 |
            Tee-Object -FilePath .sf-native-webview-diagnostic-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure isolated WebView2 diagnostic profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'sahelflow-native-webview-profile'
          "WEBVIEW2_USER_DATA_FOLDER=$profile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MSI and prove native lifecycle
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem -File 'src-tauri/target/release/bundle/msi/*.msi')
          if ($msis.Count -ne 1) {
            throw "Expected exactly one observation-only MSI, found $($msis.Count)"
          }
          ./scripts/verify-installed-windows-msi.ps1 -MsiPath $msis[0].FullName

      - name: Restore observation tools after exact checkout
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-native-webview-tools'
          Copy-Item -LiteralPath (Join-Path $toolRoot 'diagnose-installed-webview.ps1') `
            -Destination 'scripts' -Force
          Copy-Item -LiteralPath (Join-Path $toolRoot 'observe-installed-webview-cdp.mjs') `
            -Destination 'scripts' -Force

      - name: Capture exact native browser transition
        shell: pwsh
        run: ./scripts/diagnose-installed-webview.ps1

      - name: Print redacted native browser evidence
        if: always()
        shell: pwsh
        run: |
          $webviewEvidence = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-transition-diagnostic'
          foreach ($name in @(
            'startup-trace.json',
            'runtime-browser-diagnostic.jsonl',
            'runtime-ui-ready.json',
            'runtime-ui-diagnostic.json',
            'webview-cdp-summary.json'
          )) {
            $path = Join-Path $webviewEvidence $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Write-Host "SF_NATIVE_EVIDENCE_BEGIN $name"
              Get-Content -LiteralPath $path -Raw | Write-Host
              Write-Host "SF_NATIVE_EVIDENCE_END $name"
            }
          }
