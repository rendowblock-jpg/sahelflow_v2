name: LAB Windows run 4 the two older tests that failed in run 3 on main (not for merge)

# Lab branch only (lab/s42-r50-win4). Never merged. Runs the two older tests that failed in run 3, on main (Internal.49), to show whether the failure is old.

on:
  push:
    branches:
      - lab/s42-r50-win4

permissions:
  contents: read

jobs:
  windows-new-tests:
    name: Two older tests on Windows, main (run 4)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot "sahelflow-lab-win-$env:GITHUB_RUN_ID"
          $output = @(& bun run scripts/prepare-test-sandbox.ts $sandboxRoot)
          if ($LASTEXITCODE -ne 0) {
            throw 'canonical test sandbox preparation failed'
          }
          foreach ($name in @('SF_TEST_ROOT', 'SF_DATA_DIR', 'DATABASE_URL')) {
            $line = $output | Where-Object { $_ -like "$name=*" } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw "canonical test sandbox did not return $name"
            }
            $line >> $env:GITHUB_ENV
          }

      - name: Run the two tests
        shell: pwsh
        run: |
          $files = @(
            'src/components/orders/__tests__/delivery-slip-whatsapp-contract.test.ts',
            'src/app/(dashboard)/orders/__tests__/active-orders.test.ts'
          )
          Write-Host "files: $($files.Count)"
          & bunx vitest run @files
          if ($LASTEXITCODE -ne 0) { throw "vitest exit $LASTEXITCODE" }
