name: LAB Windows run of the Internal.50 new tests (not for merge)

# Lab branch only (lab/s42-r50-win). Never merged. Runs the 33 test files that the eight Internal.50
# lanes added or changed, on a real windows-latest runner, because the Founder asked for "a Windows run
# of the new tests" and the normal CI runs only one vitest file on Windows.

on:
  push:
    branches:
      - lab/s42-r50-win

permissions:
  contents: read

jobs:
  windows-new-tests:
    name: Internal.50 new tests on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot "sahelflow-lab-win-$env:GITHUB_RUN_ID"
          $output = @(& bun run scripts/prepare-test-sandbox.ts $sandboxRoot)
          if ($LASTEXITCODE -ne 0) {
            throw 'canonical test sandbox preparation failed'
          }
          foreach ($name in @('SF_TEST_ROOT', 'SF_DATA_DIR', 'DATABASE_URL')) {
            $line = $output | Where-Object { $_ -like "$name=*" } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw "canonical test sandbox did not return $name"
            }
            $line >> $env:GITHUB_ENV
          }

      - name: Run the 33 new and changed test files
        shell: pwsh
        run: |
          $files = @(
            'src/app/__tests__/hydration-marker-coverage-contract.test.ts',
            'src/components/automations/__tests__/automation-card-phone-target.test.ts',
            'src/components/automations/__tests__/phone-tap-targets.contract.test.ts',
            'src/components/data-table/__tests__/data-table-cards.render.test.tsx',
            'src/components/i18n/__tests__/arabic-letter-spacing-contract.test.ts',
            'src/components/i18n/__tests__/arabic-truncate-contract.test.ts',
            'src/components/i18n/__tests__/user-text.render.test.tsx',
            'src/components/inbox/__tests__/inbox-list-contract.test.ts',
            'src/components/inbox/__tests__/inbox-list-tools.render.test.tsx',
            'src/components/inbox/__tests__/inbox-queue-model.test.ts',
            'src/components/inbox/__tests__/inbox-queue-search-placeholder.test.ts',
            'src/components/inbox/__tests__/inbox-queue-states.render.test.tsx',
            'src/components/inbox/__tests__/inbox-row-tags.render.test.tsx',
            'src/components/inbox/__tests__/inbox-selected-row-cascade.contract.test.ts',
            'src/components/inbox/__tests__/inbox-thread-composer-contract.test.ts',
            'src/components/inbox/__tests__/inbox-thread-header.render.test.tsx',
            'src/components/inbox/__tests__/inbox-thread-phone-targets.contract.test.ts',
            'src/components/inbox/__tests__/inbox-thread-states.i18n.render.test.tsx',
            'src/components/inbox/__tests__/inbox-workspace-contract.test.ts',
            'src/components/inbox/__tests__/whatsapp-ingress-recovery-dock.blindspots.test.tsx',
            'src/components/layout/__tests__/topbar-phone.render.test.tsx',
            'src/components/onboarding/__tests__/onboarding-pin-notice.render.test.tsx',
            'src/components/runtime/__tests__/hydration-marker.render.test.tsx',
            'src/components/settings/__tests__/ai-key-panel-pin-crash-hunt.render.test.tsx',
            'src/components/settings/__tests__/settings-phone-close-overlap-contract.test.ts',
            'src/components/shared/__tests__/r50-phone-tap-targets-contract.test.ts',
            'src/components/storefront/__tests__/phone-tap-targets.contract.test.ts',
            'src/components/system/__tests__/phone-tap-targets-pages.contract.test.ts',
            'src/components/system/__tests__/phone-tap-targets-pages2.contract.test.ts',
            'src/components/ui/__tests__/select-disabled-readable.test.ts',
            'src/lib/connected-platform/remote-projection-worker.idle.test.ts',
            'src/lib/i18n/__tests__/new-texts-quality.test.ts',
            'src/lib/inbox/__tests__/ingress-details-text.test.ts'
          )
          Write-Host "files: $($files.Count)"
          & bunx vitest run @files
          if ($LASTEXITCODE -ne 0) { throw "vitest exit $LASTEXITCODE" }
