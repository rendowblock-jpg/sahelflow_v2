name: Phase 3 Level 2 evidence finalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase3-level2-evidence-finalization
  cancel-in-progress: true

jobs:
  finalize:
    name: Verify and publish Level 2 evidence frontier
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact Level 2 evidence reconciliation
        run: python .github/phase3-level2-evidence-finalize.py

      - name: Format authority files
        run: >-
          bunx prettier --write
          .github/phase-checkpoints/phase3-durable-effects.json
          AGENTS.md
          README.md
          CHANGELOG.md
          documentation/README.md
          documentation/system/CURRENT_STATE.md
          documentation/system/ROADMAP.md
          documentation/operations/WORKING_MEMORY.md
          scripts/sf-audit.ts

      - name: Verify version and semantic authority
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Verify cross-package evidence contract
        run: bunx vitest run src/lib/integrations/__tests__/phase3-source-closure.test.ts

      - name: Commit Level 2 evidence frontier
        run: |
          git config user.name "SahelFlow Phase 3 Evidence"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/phase-checkpoints/phase3-durable-effects.json \
            AGENTS.md \
            README.md \
            CHANGELOG.md \
            documentation/README.md \
            documentation/system/CURRENT_STATE.md \
            documentation/system/ROADMAP.md \
            documentation/operations/WORKING_MEMORY.md \
            scripts/sf-audit.ts
          git diff --cached --check
          git commit -m "docs(phase3): record passed Level 2 evidence frontier"
          git push origin HEAD:agent/phase3-durable-effects-audit
