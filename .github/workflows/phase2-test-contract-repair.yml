name: Phase 2 test contract repair

on:
  push:
    branches:
      - agent/native-multi-shop-authority
    paths:
      - scripts/apply-phase2-test-contract-repair.mjs

permissions:
  contents: write

concurrency:
  group: phase2-test-contract-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-multi-shop-authority
          fetch-depth: 0

      - name: Apply test contract repair
        run: node scripts/apply-phase2-test-contract-repair.mjs

      - name: Verify diff
        run: git diff --check

      - name: Commit repaired contract
        run: |
          if git diff --quiet; then
            echo "Test contract already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/windows-installed-runtime-contract.test.ts
          git commit -m "test(phase2): protect removal of browser process authority"
          git push origin HEAD:agent/native-multi-shop-authority
