name: Phase 2 MSRV lint repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/phase2-msrv-lint-repair.yml

permissions:
  contents: write

concurrency:
  group: phase2-msrv-lint-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-multi-shop-authority
          fetch-depth: 0

      - name: Apply exact MSRV-safe odd-length check
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/installation_root_key.rs")
          source = path.read_text(encoding="utf-8")
          before = "if value.len() % 2 != 0 {"
          after = "if value.len() & 1 != 0 {"
          if source.count(before) != 1:
              raise SystemExit("installation-root odd-length anchor changed")
          path.write_text(source.replace(before, after), encoding="utf-8")

      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and verify repair
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/installation_root_key.rs
          git commit -m "style(phase2): use MSRV-safe odd-length check"
          git push origin HEAD:agent/native-multi-shop-authority
