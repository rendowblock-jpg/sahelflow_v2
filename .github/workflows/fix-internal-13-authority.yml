name: Reconcile Internal.13 authority

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 174
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: codex/session2-internal-13

      - name: Reconcile active execution authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one authority block in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "documentation/operations/WORKING_MEMORY.md",
              """7. Begin the next complete observable Golden COD vertical only after the
   Internal.13 source and release result are recorded.
""",
              """7. Begin the next complete observable Golden COD vertical as soon as the
   Internal.13 source is frozen on protected `main`; continue it independently
   while signing, publication, Founder installation and T470 observation complete.
""",
          )

          replace_once(
              "documentation/system/CURRENT_STATE.md",
              """Selected exact-head source and installed lanes passed for those package heads,
with no open P0/P1 review finding. The startup change has not yet been timed on
the Founder T470, and the Arabic foundation is not evidence that every route is
already AAA; the generated inventory assigns the remaining failures across
Sessions 2–4.

The main product discontinuities remain:

- the Phase 1A trusted workspace/shop/incarnation foundation exists, but complete
  seller identity, membership, device and live-switch authority remains ahead;
- no final separate order, delivery, inventory, COD/financial and return/refund
  state machines;
- no append-only stock and money movement truth;
- no complete canonical transition/audit/outbox/idempotency service;
""",
              """Selected exact-head source and installed lanes passed for those package heads,
with no open P0/P1 review finding. The startup change has not yet been timed on
the Founder T470, and the Arabic foundation is not evidence that every route is
already AAA; the generated inventory assigns the remaining failures across
Sessions 2–4.

PR #170 merged the Session 2 business-truth source foundation at
`6cd1103b55c905d26492ecf5436e644d377ce557`. It adds independent lifecycle
contracts, canonical aggregate/command/event/outbox/reservation/movement and
compensation persistence, trusted encrypted idempotent command execution,
crash-recoverable multi-shop key rotation, migration-authoritative reset and
fail-closed legacy projections. Production order, delivery, refund, provider,
automation and UI routes remain on the legacy paths until complete observable
verticals adopt those contracts.

The main product discontinuities remain:

- the Phase 1A trusted workspace/shop/incarnation foundation exists, but complete
  seller identity, membership, device and live-switch authority remains ahead;
- independent order, delivery, inventory, COD/financial and return/refund
  contracts exist, but production routes do not yet adopt them end to end;
- append-only inventory and financial movement persistence exists at the
  canonical foundation layer, but complete production journeys do not yet write,
  reconcile and compensate through it;
- the atomic command/audit/event/outbox/idempotency foundation exists, but the
  production order, delivery, refund, provider and automation paths remain legacy;
""",
          )

          replace_once(
              "documentation/system/CURRENT_STATE.md",
              """| Arabic/RTL and chart foundation | PR #171 merge `a8770e1943e1fb2d33c6f0520c77d257d5c5bd15` | Shared bidi/layout/state/chart contracts and generated route inventory passed selected exact-head gates |
""",
              """| Arabic/RTL and chart foundation | PR #171 merge `a8770e1943e1fb2d33c6f0520c77d257d5c5bd15` | Shared bidi/layout/state/chart contracts and generated route inventory passed selected exact-head gates |
| Session 2 business-truth foundation | PR #170 merge `6cd1103b55c905d26492ecf5436e644d377ce557`; exact-head run `30344619022` | Independent lifecycle contracts, canonical persistence, encrypted trusted idempotent commands, movement/compensation facts, key rotation, reset and legacy-ambiguity proof integrated; production routes not switched |
""",
          )

          rows = {
              "| CAP-008 | Inventory | **Partial/unsafe** | Stock fields and order lifecycle effects | Reservation and append-only movement ledger, replay/concurrency and return disposition |": "| CAP-008 | Inventory | **Partial foundation** | Existing stock behavior plus canonical reservation and `InventoryMovement` persistence with encrypted reasons and same-key concurrency proof | Adopt reservation consumption/release and movement reconciliation across production confirmation, shipment, cancellation and return journeys |",
              "| CAP-010 | Orders/confirmation | **Partial** | Routes/UI/timeline, confirmation queue, status actions | Separate state machines, canonical service and Golden journey |": "| CAP-010 | Orders/confirmation | **Partial foundation** | Existing routes/UI plus independent order/confirmation contracts and the trusted atomic command kernel | Switch a complete production confirmation vertical and prove the Golden journey, conflicts, retries and compensation |",
              "| CAP-012 | Returns/refunds | **Partial/unsafe** | Models, routes and UI | Atomic append-only stock/money/status compensation |": "| CAP-012 | Returns/refunds | **Partial foundation** | Existing models/routes/UI plus compensation facts and canonical inventory/financial movement contracts | Adopt atomic production return/refund transitions and prove stock, money and status compensation end to end |",
              "| CAP-013 | COD/accounting | **Partial** | Expenses, COD fields, reconciliation UI/tests | Receivable/remittance/fee/discrepancy ledger and governed correction |": "| CAP-013 | COD/accounting | **Partial foundation** | Expenses, COD UI/tests and canonical DZD `FinancialMovement` persistence with encrypted free-form details | Adopt production receivable/remittance/fee/discrepancy posting, reconciliation and governed correction |",
              "| CAP-014 | Audit/history | **Partial/unsafe** | `AuditLog`, `OrderChange`, timelines | Trusted actor/device and atomic business audit/movements |": "| CAP-014 | Audit/history | **Partial foundation** | `AuditLog`, `OrderChange`, timelines plus trusted principals and atomic audit/event/outbox/movement persistence | Adopt the kernel across production routes, add durable effect workers and complete device/operator authority |",
          }
          state = Path("documentation/system/CURRENT_STATE.md")
          text = state.read_text(encoding="utf-8")
          for old, new in rows.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one capability row, found {text.count(old)}: {old}")
              text = text.replace(old, new, 1)
          state.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/fix-internal-13-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/operations/WORKING_MEMORY.md documentation/system/CURRENT_STATE.md .github/workflows/fix-internal-13-authority.yml
          git commit -m "docs(authority): reconcile Internal.13 foundation and lane independence"
          git push origin HEAD:codex/session2-internal-13
