          # Canonical catalog mutation keeps product and variant projections consistent.
          regex_once(
              "src/lib/ai/actions/executor.ts",
              r'''async function updateProductStock\(.*?\n\}\n\nasync function createProduct\(''',
              '''async function updateProductStock(
            tx: BusinessTransaction,
            shop: ShopContext,
            proposalId: string,
            args: Record<string, unknown>,
          ): Promise<MutationOutcome> {
            const productId = String(args.productId);
            await assertCatalogStockMutationAllowed(tx, productId);
            const before = await tx.product.findFirst({
              where: { id: productId, deletedAt: null },
              select: {
                id: true,
                name: true,
                sku: true,
                stock: true,
                productVariants: {
                  orderBy: [{ sortOrder: "asc" }, { id: "asc" }],
                  select: {
                    id: true,
                    name: true,
                    stock: true,
                    isActive: true,
                  },
                },
              },
            });
            if (!before) throw new NotFoundError("Product", productId);
            const activeVariants = before.productVariants.filter(
              (variant) => variant.isActive,
            );
            if (
              before.productVariants.length > 0 &&
              activeVariants.length !== 1
            ) {
              throw new SahelFlowError(
