                where: { id: variant.id },
                data: { stock: newStock },
              });
            }
            const product = await tx.product.update({
              where: { id: productId },
              data: { stock: newStock },
              select: {
                id: true,
                name: true,
                sku: true,
                stock: true,
                lowStockThreshold: true,
                updatedAt: true,
              },
            });
            const reason = typeof args.reason === "string" ? args.reason : null;
            const outbox =
              product.stock <= product.lowStockThreshold
                ? [lowStockIntent(shop, product)]
                : [];

            return {
              result: {
                id: product.id,
                name: product.name,
                sku: product.sku,
                stock: product.stock,
                variantId: variant?.id ?? null,
              },
              audit: {
                action: "ai.product.stock_adjusted.v1",
                entity: "product",
                entityId: product.id,
                before: {
                  stock: before.stock,
                  variantStock: variant?.stock ?? null,
                },
                after: {
                  stock: product.stock,
                  variantStock: variant ? newStock : null,
                },
                metadata: {
