                if (
                  product.productVariants.length > 0 &&
                  activeVariants.length !== 1
                ) {
                  throw new SahelFlowError(
                    "Product-level stock changes require zero variants or one exact active variant",
                    "AI_ACTION_VARIANT_MUTATION_AMBIGUOUS",
