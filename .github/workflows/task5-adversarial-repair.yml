                "draft",
                "pending",
                "confirmed",
                "shipped",
                "delivered",
                "cancelled",
                "returned",
              ]),''',
              '''    status: z.enum([
                "draft",
                "pending",
                "shipped",
                "delivered",
                "cancelled",
                "returned",
              ]),''',
