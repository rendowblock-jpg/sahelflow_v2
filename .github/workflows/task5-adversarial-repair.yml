name: Task 5 adversarial repair

on:
  push:
    branches:
      - agent/phase3-durable-effects-audit
    paths:
      - .github/task5-adversarial-trigger

permissions:
  contents: write

concurrency:
  group: task5-adversarial-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[task5-adversarial-trigger]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SF_TEST_ROOT: /tmp/sahelflow-task5-adversarial
      SF_DATA_DIR: /tmp/sahelflow-task5-adversarial/data
      DATABASE_URL: file:/tmp/sahelflow-task5-adversarial/data/shops/test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-durable-effects-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply reviewed Task 5 repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new, 1))

          def replace_n(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              file.write_text(text.replace(old, new))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              file.write_text(updated)

          def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

          # Preserve exact custom team permission allowlists during requester drift checks.
          replace_once(
              "src/lib/ai/actions/service.ts",
              '''  const requesterEffective = sortedPermissions(
            resolvePhase2Permissions(requester.role, null),
          );''',
              '''  const requesterEffective = sortedPermissions(
            requester.permissions ?? resolvePhase2Permissions(requester.role, null),
          );''',
          )

          # A succeeded execution is terminal even if a later recovery/read path fails.
          replace_once(
              "src/lib/ai/actions/service.ts",
              '''        WHERE "id" = ${executionId}
              `;''',
              '''        WHERE "id" = ${executionId}
                  AND "state" <> 'succeeded'
              `;''',
          )
          regex_once(
              "src/lib/ai/actions/service.ts",
              r'''    await markSucceeded\(input\.context, row, execution, command\);\n    const completedRow =.*?      replayed: command\.replayed,\n    \};\n''',
              '''    await markSucceeded(input.context, row, execution, command);
              const completedAt = new Date();
              const completed: DecryptedProposal = {
                ...proposal,
                row: {
                  ...proposal.row,
                  status: "succeeded",
                  lastErrorCode: null,
                  completedAt,
                  updatedAt: completedAt,
                },
              };
              const completedExecution: ExecutionRow = {
                ...execution,
                state: "succeeded",
                businessCommandId: command.commandId,
                errorCode: null,
                completedAt,
                updatedAt: completedAt,
              };
              return {
                proposal: await proposalProjection(
                  input.context,
                  completed,
                  completedExecution,
                ),
                result: command.result,
                businessCommandId: command.commandId,
                replayed: command.replayed,
              };
''',
          )

          # Central schemas reject unexecutable status changes and normalize exact Algerian phones.
          replace_once(
