      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- "$SF_TEST_ROOT"

      - name: Authority and complete source gate
        shell: bash
        run: |
          bun run sf-version
          bun run sf-audit
          bun run sf-verify

      - name: Commit and push verified repair
        shell: bash
        run: |
          rm -f .github/task5-adversarial-trigger
          git config user.name "SahelFlow Task 5 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): close adversarial proposal boundaries"
          git push origin HEAD:agent/phase3-durable-effects-audit
