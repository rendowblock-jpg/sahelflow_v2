name: Task 5 adversarial repair payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PY'
          from pathlib import Path

          def lines(value):
              return [line.strip() for line in value]

          def replace_lines(path, old, new):
              file = Path(path)
              text = file.read_text()
              source = text.splitlines()
              old_norm = lines(old)
              new_norm = lines(new)
              if any(
                  lines(source[index:index + len(new_norm)]) == new_norm
                  for index in range(len(source) - len(new_norm) + 1)
              ):
                  return
              matches = [
                  index
                  for index in range(len(source) - len(old_norm) + 1)
                  if lines(source[index:index + len(old_norm)]) == old_norm
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected one normalized block, found {len(matches)}"
                  )
              index = matches[0]
              updated = source[:index] + new + source[index + len(old_norm):]
              file.write_text(chr(10).join(updated) + chr(10))

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one exact match, found {text.count(old)}"
                  )
              file.write_text(text.replace(old, new, 1))

          def replace_all_exact(path, old, new, expected):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} exact matches, found {text.count(old)}"
                  )
              file.write_text(text.replace(old, new))

          def replace_region(path, start_marker, end_marker, replacement):
              file = Path(path)
              text = file.read_text()
              if replacement in text:
                  return
              if text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f"{path}: completion region markers are not unique")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              file.write_text(text[:start] + replacement + text[end:])

          def insert_before(path, marker, content):
              file = Path(path)
              text = file.read_text()
              if content in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: insertion marker is not unique")
              file.write_text(text.replace(marker, content + marker, 1))

          def insert_after(path, marker, content):
              file = Path(path)
              text = file.read_text()
              if content in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: insertion marker is not unique")
              file.write_text(text.replace(marker, marker + content, 1))

          def write_new(path, content):
              file = Path(path)
              if file.exists():
                  if file.read_text() == content:
                      return
                  raise SystemExit(f"{path}: existing file differs from reviewed content")
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

          service = "src/lib/ai/actions/service.ts"
          replace_lines(
              service,
              [
                  "  const requesterEffective = sortedPermissions(",
                  "    resolvePhase2Permissions(requester.role, null),",
                  "  );",
              ],
              ["  const requesterEffective = effectivePermissions(requester);"],
          )

          completion_start = (
              "  const completedRow = await readProposalById(input.context.prisma, row.id);"
          )
          completion_end = "\n}\n\nexport async function listAiActionProposals"
          completion = "\n".join([
              "  const completedAt = new Date();",
              "  const completed: DecryptedProposal = {",
              "    ...proposal,",
              "    row: {",
              "      ...proposal.row,",
              '      status: "succeeded",',
              "      lastErrorCode: null,",
              "      completedAt,",
              "      updatedAt: completedAt,",
              "    },",
              "  };",
              "  const completedExecution: ExecutionRow = {",
              "    ...execution,",
              '    state: "succeeded",',
              "    businessCommandId: command.commandId,",
              "    errorCode: null,",
              "    completedAt,",
              "    updatedAt: completedAt,",
              "  };",
              "  return {",
              "    proposal: await proposalProjection(",
              "      input.context,",
              "      completed,",
              "      completedExecution,",
              "    ),",
              "    result: command.result,",
              "    businessCommandId: command.commandId,",
              "    replayed: command.replayed,",
              "  };",
          ])
          replace_region(service, completion_start, completion_end, completion)

          contracts = "src/lib/ai/actions/contracts.ts"
          replace_exact(
              contracts,
              "    commune: z.string().trim().max(120),\n"
              "    address: z.string().trim().max(500),\n"
              "    phone: algerianPhoneSchema,",
              "    commune: z.string().trim().min(1).max(120),\n"
              "    address: z.string().trim().min(1).max(500),\n"
              "    phone: algerianPhoneSchema,",
          )
          replace_exact(
              contracts,
              "    wilaya: z.string().trim().max(120).optional(),\n"
              "    commune: z.string().trim().max(120).optional(),",
              "    wilaya: z.string().trim().min(1).max(120).optional(),\n"
              "    commune: z.string().trim().min(1).max(120).optional(),",
          )

          core = "src/lib/ai/chat/tools/core-tools.ts"
          replace_lines(
              core,
              [
                  "  status: z.enum([",
                  '    "draft",',
                  '    "pending",',
                  '    "confirmed",',
                  '    "shipped",',
                  '    "delivered",',
                  '    "cancelled",',
                  '    "returned",',
                  "  ]),",
              ],
              [
                  "  status: z.enum([",
                  '    "draft",',
                  '    "pending",',
                  '    "shipped",',
                  '    "delivered",',
                  '    "cancelled",',
                  '    "returned",',
                  "  ]),",
              ],
          )
          replace_exact(
              core,
              '      "Update the status of a legacy-compatible order. Canonical orders require their governed seller actions. Valid statuses: draft, pending, confirmed, shipped, delivered, cancelled, returned.",',
              '      "Update the status of a legacy-compatible order. Canonical confirmation remains a governed seller action. Valid statuses: draft, pending, shipped, delivered, cancelled, returned.",',
          )
          replace_exact(
              core,
              '            "draft|pending|confirmed|shipped|delivered|cancelled|returned",',
              '            "draft|pending|shipped|delivered|cancelled|returned",',
          )
          replace_lines(
              core,
              [
                  '      if (input.status === "confirmed") {',
                  "        return {",
                  "          success: false,",
                  "          error:",
                  '            "La confirmation exige la commande gouvernée; l’IA ne peut pas utiliser le chemin historique.",',
                  "        };",
                  "      }",
              ],
              [],
          )

          agent = "src/lib/ai/chat/agent.ts"
          interface_marker = "\nfunction proposalMessage("
          history_helper = "\n".join([
              "\nfunction historySafeToolResult(value: unknown): unknown {",
              "  if (",
              "    value &&",
              '    typeof value === "object" &&',
              "    (value as Record<string, unknown>).pending_action_proposal === true",
              "  ) {",
              "    const { proposalDigest: _proposalDigest, ...safe } =",
              "      value as Record<string, unknown>;",
              "    return redactToolResult(safe);",
              "  }",
              "  return redactToolResult(value);",
              "}",
              "",
          ])
          insert_before(agent, interface_marker, history_helper)
          replace_exact(
              agent,
              "            response: { result: call.result },",
              "            response: { result: historySafeToolResult(call.result) },",
          )
          replace_lines(
              agent,
              [
                  "  return {",
                  "    result,",
                  "    ...(isAiActionProposalToolResult(result)",
                  "      ? { actionProposal: result }",
                  "      : {}),",
                  "  };",
              ],
              [
                  "  if (isAiActionProposalToolResult(result)) {",
                  "    return {",
                  "      result: historySafeToolResult(result),",
                  "      actionProposal: result,",
                  "    };",
                  "  }",
                  "  return { result };",
              ],
          )
          replace_all_exact(
              agent,
              "      const redacted = redactToolResult(executed.result);",
              "      const redacted = historySafeToolResult(executed.result);",
              2,
          )

          migration = "prisma/migrations/20260803194500_phase3_ai_action_state_guards/migration.sql"
          write_new(
              migration,
              """-- Phase 3 Task 5 adversarial state guards.

CREATE TRIGGER "AiActionExecution_valid_state_insert"
BEFORE INSERT ON "AiActionExecution"
WHEN NEW."state" NOT IN ('claimed', 'running', 'succeeded', 'failed', 'conflict')
BEGIN
  SELECT RAISE(ABORT, 'invalid AiActionExecution state');
END;

CREATE TRIGGER "AiActionExecution_valid_state_update"
BEFORE UPDATE OF "state" ON "AiActionExecution"
WHEN NEW."state" NOT IN ('claimed', 'running', 'succeeded', 'failed', 'conflict')
BEGIN
  SELECT RAISE(ABORT, 'invalid AiActionExecution state');
END;

CREATE TRIGGER "AiActionExecution_succeeded_terminal"
BEFORE UPDATE OF "state" ON "AiActionExecution"
WHEN OLD."state" = 'succeeded' AND NEW."state" <> 'succeeded'
BEGIN
  SELECT RAISE(ABORT, 'succeeded AI execution is terminal');
END;

CREATE TRIGGER "AiActionProposal_valid_status_insert"
BEFORE INSERT ON "AiActionProposal"
WHEN NEW."status" NOT IN (
  'pending', 'approved', 'executing', 'succeeded',
  'failed', 'conflict', 'expired', 'rejected'
)
BEGIN
  SELECT RAISE(ABORT, 'invalid AiActionProposal status');
END;

CREATE TRIGGER "AiActionProposal_valid_status_update"
BEFORE UPDATE OF "status" ON "AiActionProposal"
WHEN NEW."status" NOT IN (
  'pending', 'approved', 'executing', 'succeeded',
  'failed', 'conflict', 'expired', 'rejected'
)
BEGIN
  SELECT RAISE(ABORT, 'invalid AiActionProposal status');
END;

CREATE TRIGGER "AiActionProposal_succeeded_terminal"
BEFORE UPDATE OF "status" ON "AiActionProposal"
WHEN OLD."status" = 'succeeded' AND NEW."status" <> 'succeeded'
BEGIN
  SELECT RAISE(ABORT, 'succeeded AI proposal is terminal');
END;
""",
          )

          boundary_test = "src/lib/ai/actions/__tests__/adversarial-boundaries.test.ts"
          write_new(
              boundary_test,
              """import { describe, expect, it } from "vitest";

import { parseSensitiveAiToolArgs } from "../contracts";

describe("Task 5 adversarial argument boundaries", () => {
  it("rejects governed confirmation before proposal creation", () => {
    expect(() =>
      parseSensitiveAiToolArgs("update_order_status", {
        orderId: "order-1",
        status: "confirmed",
      }),
    ).toThrow();
  });

  it("normalizes valid Algerian phones and rejects invalid customer phones", () => {
    expect(
      parseSensitiveAiToolArgs("create_customer", {
        name: "Amina",
        phone: "+213 555 12 34 56",
      }),
    ).toMatchObject({ phone: "0555123456" });
    expect(() =>
      parseSensitiveAiToolArgs("create_customer", {
        name: "Amina",
        phone: "123",
      }),
    ).toThrow();
  });

  it("rejects blank canonical order location fields", () => {
    expect(() =>
      parseSensitiveAiToolArgs("create_order", {
        customerId: "customer-1",
        items: [{ productId: "product-1", quantity: 1 }],
        wilaya: "Alger",
        commune: "",
        address: "",
        phone: "0555123456",
      }),
    ).toThrow();
  });
});
""",
          )

          drift_test = "src/lib/ai/actions/__tests__/service-drift-recovery.test.ts"
          custom_permission_test = """  it("preserves exact custom requester permission allowlists", async () => {
    const customActor = {
      ...harness.actor,
      permissions: [
        "ai.use",
        "approvals.request",
        "products.read",
        "products.manage",
        "products.cost.update",
      ] as const,
    };
    const { sessionId, messageId } = await requestMessage();
    harness.resolveDurableIdentityActor.mockResolvedValue(customActor);
    const created = await createAiActionProposal({
      context: { prisma: db as never, shop: TEST_SHOP_CONTEXT },
      requester: actorContext(customActor),
      sessionId,
      requestMessageId: messageId,
      toolName: "create_product",
      rawArgs: { name: "Custom", price: 1000, stock: 1 },
    });

    const approved = await approveAiActionProposal({
      context: { prisma: db as never, shop: TEST_SHOP_CONTEXT },
      approver: actorContext(),
      proposalId: created.proposal.id,
      proposalDigest: created.proposalDigest,
    });
    expect(approved.result).toEqual({ ok: true, mutationId: "mut-1" });
  });

"""
          insert_after(
              drift_test,
              'describe("proposal-bound AI drift and recovery", () => {\n',
              custom_permission_test,
          )

          service_test = "src/lib/ai/actions/__tests__/service.test.ts"
          terminal_assertion = """
    await expect(
      db.$executeRaw`
        UPDATE "AiActionExecution"
        SET "state" = 'failed'
        WHERE "proposalId" = ${created.proposal.id}
      `,
    ).rejects.toThrow(/terminal/i);
"""
          insert_after(
              service_test,
              "    expect(Number(counts[0]?.executions)).toBe(1);\n",
              terminal_assertion,
          )

          proposal_test = "src/lib/ai/chat/__tests__/agent-proposal.test.ts"
          insert_after(
              proposal_test,
              "    expect(result.toolCalls).toHaveLength(1);\n",
              '    expect(JSON.stringify(result.toolCalls)).not.toContain("1".repeat(64));\n',
          )
          insert_after(
              proposal_test,
              "    expect(proposal?.proposal).toEqual(proposalResult());\n",
              "    const toolResult = events.find((event) => event.type === \"tool_result\");\n"
              '    expect(JSON.stringify(toolResult)).not.toContain("1".repeat(64));\n',
          )

          source_test = "src/lib/ai/actions/__tests__/source-contract.test.ts"
          digest_contract = """  it("keeps approval digests out of persisted and Gemini tool history", () => {
    const agent = source("src/lib/ai/chat/agent.ts");
    expect(agent).toContain("historySafeToolResult");
    expect(agent).toContain("proposalDigest: _proposalDigest");
    expect(agent).toContain("historySafeToolResult(call.result)");
  });

"""
          insert_before(
              source_test,
              '  it("keeps provider assignment blocked and hidden from Gemini", () => {',
              digest_contract,
          )
          PY
