              '''import "server-only";

          import type { DbClient } from "@/lib/db";
          import {
            assertTrustedAction,
            trustedActionAllowed,
          } from "@/lib/identity/authorization";
          import {
            PHASE2_ACTIONS,
            type Phase2Action,
          } from "@/lib/identity/permissions";
          import type { TrustedActorContext } from "@/lib/identity/trusted-actor";
          import type { ShopContext } from "@/lib/shops/context";
          import { SahelFlowError } from "@/types/errors";
          import {
            getAiActionProposal,
            type AiActionProposalHandle,
          } from "./service";

          interface ProposalHistoryRow {
            id: string;
            requiredPermissionsJson: string;
            workspaceId: string;
            installationId: string;
            shopId: string;
            shopIncarnationId: string;
            registryRevision: number | bigint;
            databaseFileId: string;
            migrationSetSha256: string;
          }

          const ACTIONS = new Set<string>(PHASE2_ACTIONS);

          function exactShop(row: ProposalHistoryRow, shop: ShopContext): boolean {
            return (
              row.workspaceId === shop.workspaceId &&
              row.installationId === shop.installationId &&
              row.shopId === shop.shopId &&
              row.shopIncarnationId === shop.shopIncarnationId &&
              Number(row.registryRevision) === shop.registryRevision &&
              row.databaseFileId === shop.databaseFileId &&
              row.migrationSetSha256 === shop.migrationSetSha256
            );
          }

          function requiredPermissions(value: string): Phase2Action[] | null {
            try {
              const parsed = JSON.parse(value) as unknown;
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
                return null;
              }
              const required = (parsed as Record<string, unknown>).required;
              if (
                !Array.isArray(required) ||
                required.some(
                  (entry) => typeof entry !== "string" || !ACTIONS.has(entry),
                )
              ) {
                return null;
              }
              return [...new Set(required as Phase2Action[])].sort();
            } catch {
              return null;
            }
          }

          function canRead(
            actor: TrustedActorContext,
            shopId: string,
            required: readonly Phase2Action[],
          ): boolean {
            return required.every((action) =>
              trustedActionAllowed(actor, action, { shopId }),
            );
          }

          async function rowsForSession(
            db: DbClient,
            sessionId: string,
          ): Promise<ProposalHistoryRow[]> {
            return db.$queryRaw<ProposalHistoryRow[]>`
              SELECT
                "id", "requiredPermissionsJson", "workspaceId",
                "installationId", "shopId", "shopIncarnationId",
                "registryRevision", "databaseFileId", "migrationSetSha256"
              FROM "AiActionProposal"
              WHERE "sessionId" = ${sessionId}
              ORDER BY "createdAt" DESC
              LIMIT 100
            `;
          }

          export async function listAuthorizedAiActionProposals(
            context: { prisma: DbClient; shop: ShopContext },
            actor: TrustedActorContext,
            sessionId: string,
          ): Promise<AiActionProposalHandle[]> {
            assertTrustedAction(actor, "ai.use", { shopId: context.shop.shopId });
            const output: AiActionProposalHandle[] = [];
            for (const row of await rowsForSession(context.prisma, sessionId)) {
              const required = requiredPermissions(row.requiredPermissionsJson);
              if (
                !required ||
                !exactShop(row, context.shop) ||
                !canRead(actor, context.shop.shopId, required)
              ) {
                continue;
              }
              output.push(
                await getAiActionProposal(context, actor, row.id),
              );
            }
            return output;
          }

          export async function getAuthorizedAiActionProposal(
            context: { prisma: DbClient; shop: ShopContext },
            actor: TrustedActorContext,
            proposalId: string,
          ): Promise<AiActionProposalHandle> {
            assertTrustedAction(actor, "ai.use", { shopId: context.shop.shopId });
            const rows = await context.prisma.$queryRaw<ProposalHistoryRow[]>`
              SELECT
                "id", "requiredPermissionsJson", "workspaceId",
                "installationId", "shopId", "shopIncarnationId",
                "registryRevision", "databaseFileId", "migrationSetSha256"
              FROM "AiActionProposal"
              WHERE "id" = ${proposalId}
              LIMIT 1
            `;
            const row = rows[0];
            const required = row
              ? requiredPermissions(row.requiredPermissionsJson)
              : null;
            if (
              !row ||
              !required ||
              !exactShop(row, context.shop) ||
              !canRead(actor, context.shop.shopId, required)
            ) {
              throw new SahelFlowError(
                "AI action proposal was not found",
                "AI_ACTION_PROPOSAL_NOT_FOUND",
                404,
              );
            }
            return getAiActionProposal(context, actor, proposalId);
          }
          ''',
