              address: z.string().trim().max(500),
              phone: z.string().trim().min(1).max(40),''',
              '''    commune: z.string().trim().min(1).max(120),
              address: z.string().trim().min(1).max(500),
              phone: normalizedDzPhoneSchema,''',
          )
          replace_once(
              "src/lib/ai/actions/contracts.ts",
