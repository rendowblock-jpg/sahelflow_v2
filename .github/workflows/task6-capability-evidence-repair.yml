name: Task 6 capability evidence repair

on:
  push:
    branches: [agent/phase3-durable-effects-audit]
    paths:
      - .github/task6-capability-evidence-repair.py
      - .github/workflows/task6-capability-evidence-repair.yml

concurrency:
  group: task6-capability-evidence-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-task6-capability
      SF_DATA_DIR: /tmp/sahelflow-task6-capability/data
      DATABASE_URL: file:/tmp/sahelflow-task6-capability/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-durable-effects-audit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed repair
        run: python .github/task6-capability-evidence-repair.py

      - name: Format touched TypeScript
        run: >-
          bunx prettier --write
          src/lib/integrations/delivery/provider-capability.ts
          src/lib/integrations/delivery/__tests__/provider-capability.test.ts
          src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-task6-capability

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit verified source only
        run: |
          git config user.name "SahelFlow Task 6 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/integrations/delivery/provider-capability.ts \
            src/lib/integrations/delivery/__tests__/provider-capability.test.ts \
            src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts \
            prisma/migrations/20260804023000_provider_capability_evidence_levels/migration.sql
          git diff --cached --check
          git commit -m "fix(task6): separate connection verification from capability evidence"
          git push origin HEAD:agent/phase3-durable-effects-audit
