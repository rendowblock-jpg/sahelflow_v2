name: Repair internal.5 Windows acceptance harnesses

on:
  pull_request:
    paths:
      - .github/workflows/internal5-harness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair PowerShell interpolation and evidence filenames
        shell: python
        run: |
          from pathlib import Path

          ui = Path("scripts/verify-installed-windows-ui.ps1")
          text = ui.read_text(encoding="utf-8")
          before = text.count('"$Phase:')
          if before != 6:
              raise SystemExit(f"expected six invalid $Phase: interpolations, found {before}")
          text = text.replace('"$Phase:', '"${Phase}:')
          if '"$Phase:' in text:
              raise SystemExit("invalid $Phase: interpolation remains")
          ui.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/windows-installed-e2e.yml")
          yaml = workflow.read_text(encoding="utf-8")
          old_regex = "$safeName = $relative -replace '[\\/:*?\"<>|]', '_'"
          if old_regex not in yaml:
              # GitHub's fetched representation previously lost the backslash.
              old_regex = "$safeName = $relative -replace '[/:*?\"<>|]', '_'"
          new_regex = "$safeName = $relative -replace '[\\\\/:*?\"<>|]', '_'"
          if old_regex not in yaml:
              raise SystemExit("could not find evidence filename sanitization")
          yaml = yaml.replace(old_regex, new_regex, 1)

          anchor = """      - name: Cache Windows Rust dependencies
"""
          parse_step = """      - name: Parse installed UI harness under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\\WindowsPowerShell\\v1.0\\powershell.exe'
          $parserScript = Join-Path $env:RUNNER_TEMP 'parse-windows-powershell51.ps1'
          @'
          param([Parameter(Mandatory = $true)][string]$Path)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List * -Force
              exit 1
          }
          '@ | Set-Content -LiteralPath $parserScript -Encoding UTF8

          foreach ($relative in @(
              '.\\scripts\\install-founder-windows.ps1',
              '.\\scripts\\verify-installed-windows-ui.ps1'
          )) {
              $resolved = (Resolve-Path -LiteralPath $relative).Path
              & $windowsPowerShell `
                  -NoLogo `
                  -NoProfile `
                  -NonInteractive `
                  -ExecutionPolicy Bypass `
                  -File $parserScript `
                  -Path $resolved
              if ($LASTEXITCODE -ne 0) {
                  throw "$relative failed Windows PowerShell 5.1 parsing."
              }
          }

"""
          if anchor not in yaml:
              raise SystemExit("could not find Windows Rust cache step anchor")
          if "Parse installed UI harness under Windows PowerShell 5.1" not in yaml:
              yaml = yaml.replace(anchor, parse_step + anchor, 1)
          workflow.write_text(yaml, encoding="utf-8")

      - name: Validate both scripts with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $parserScript = Join-Path $env:RUNNER_TEMP 'parse-windows-powershell51.ps1'
          @'
          param([Parameter(Mandatory = $true)][string]$Path)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List * -Force
              exit 1
          }
          '@ | Set-Content -LiteralPath $parserScript -Encoding UTF8

          foreach ($relative in @(
              '.\scripts\install-founder-windows.ps1',
              '.\scripts\verify-installed-windows-ui.ps1'
          )) {
              $resolved = (Resolve-Path -LiteralPath $relative).Path
              & $windowsPowerShell `
                  -NoLogo `
                  -NoProfile `
                  -NonInteractive `
                  -ExecutionPolicy Bypass `
                  -File $parserScript `
                  -Path $resolved
              if ($LASTEXITCODE -ne 0) {
                  throw "$relative failed Windows PowerShell 5.1 parsing."
              }
          }

      - name: Commit repaired harnesses
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add scripts/verify-installed-windows-ui.ps1 .github/workflows/windows-installed-e2e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(windows): repair PowerShell 5.1 UI acceptance harness'
          git push origin "HEAD:${HEAD_BRANCH}"
