name: Diagnose signed internal.4 verification

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-internal4-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnose-signed-internal-4
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/bootstrap-internal4-signed-build'
    name: Split signed Windows verification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: fd8a5d92011b810dfa0f5f5cd47c1982a7b2986b
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: fd8a5d92011b810dfa0f5f5cd47c1982a7b2986b
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure disposable test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot 'sahelflow-test'
          $dataDir = Join-Path $sandboxRoot 'data'
          $database = Join-Path $dataDir 'shops\test.db'
          "SF_TEST_ROOT=$sandboxRoot" >> $env:GITHUB_ENV
          "SF_DATA_DIR=$dataDir" >> $env:GITHUB_ENV
          "DATABASE_URL=file:$database" >> $env:GITHUB_ENV

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare pinned Windows runtime
        run: bun run scripts/prepare-runtime.ts

      - name: Build bundled WhatsApp sidecar
        run: bun run build:sidecar

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: bun run test:sandbox -- "$env:SF_TEST_ROOT"

      - name: Prisma client generation
        shell: pwsh
        run: |
          & bun run db:generate 2>&1 | Tee-Object -FilePath diagnose-prisma-generate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Database migration deployment
        shell: pwsh
        run: |
          & bunx prisma migrate deploy 2>&1 | Tee-Object -FilePath diagnose-migrate-deploy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: TypeScript
        shell: pwsh
        run: |
          & bun run typecheck 2>&1 | Tee-Object -FilePath diagnose-typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ESLint
        shell: pwsh
        run: |
          & bun run lint 2>&1 | Tee-Object -FilePath diagnose-eslint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vitest
        shell: pwsh
        run: |
          & bunx vitest run --bail=1 2>&1 | Tee-Object -FilePath diagnose-vitest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture production audit without masking advisories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & bun audit --prod --json 2>&1 | Tee-Object -FilePath diagnose-production-audit.json
          $auditExit = $LASTEXITCODE
          "exitCode=$auditExit" | Set-Content -LiteralPath diagnose-production-audit-exit.txt -Encoding UTF8
          exit 0

      - name: Upload split verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-internal4-split-verification-${{ github.run_id }}
          path: |
            diagnose-*.log
            diagnose-production-audit.json
            diagnose-production-audit-exit.txt
          if-no-files-found: error
          retention-days: 7
