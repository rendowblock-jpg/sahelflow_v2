name: Diagnose Windows production audit

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-windows-bun-audit.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diag/windows-bun-audit-internal4'
    name: Exact-source Bun production audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@v4
        with:
          ref: fd8a5d92011b810dfa0f5f5cd47c1982a7b2986b
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Run production audit
        shell: pwsh
        run: |
          & bun audit --production 2>&1 | Tee-Object -FilePath bun-audit.log
          $auditExit = $LASTEXITCODE
          "exitCode=$auditExit" | Add-Content -LiteralPath bun-audit.log
          if ($auditExit -ne 0) { exit $auditExit }

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bun-audit-${{ github.run_id }}
          path: bun-audit.log
          if-no-files-found: error
          retention-days: 7
