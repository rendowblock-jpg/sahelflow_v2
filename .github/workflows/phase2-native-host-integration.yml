name: Phase 2 native host integration

on:
  push:
    branches:
      - agent/native-multi-shop-authority
    paths:
      - scripts/apply-native-lifecycle-host-integration.mjs

permissions:
  contents: write

concurrency:
  group: phase2-native-host-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-multi-shop-authority
          fetch-depth: 0

      - name: Apply deterministic host integration
        run: node scripts/apply-native-lifecycle-host-integration.mjs

      - name: Format integrated Rust source
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run Rust formatter
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify generated diff
        run: git diff --check

      - name: Commit integrated host
        run: |
          if git diff --quiet; then
            echo "Host integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/startup_recovery/shop_lifecycle_host.rs
          git commit -m "feat(phase2): integrate complete native lifecycle host"
          git push origin HEAD:agent/native-multi-shop-authority
