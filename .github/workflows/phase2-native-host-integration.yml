name: Phase 2 native host integration

on:
  push:
    branches:
      - agent/native-multi-shop-authority
    paths:
      - scripts/apply-native-lifecycle-host-integration.mjs
      - scripts/apply-native-lifecycle-compile-repair.mjs
      - scripts/apply-native-lifecycle-host-integration.trigger

permissions:
  contents: write

concurrency:
  group: phase2-native-host-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-multi-shop-authority
          fetch-depth: 0

      - name: Apply deterministic host integration
        run: |
          if grep -q 'mod shop_lifecycle_mutation;' src-tauri/src/startup_recovery/shop_lifecycle_host.rs; then
            echo "Host integration already applied"
          else
            node scripts/apply-native-lifecycle-host-integration.mjs
          fi

      - name: Apply consolidated compile repair
        run: node scripts/apply-native-lifecycle-compile-repair.mjs

      - name: Format complete Rust package
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run Rust formatter
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify generated diff
        run: git diff --check

      - name: Commit native integration batch
        run: |
          if git diff --quiet; then
            echo "Native integration and compile repair already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src src-tauri/tests
          git commit -m "fix(phase2): close native lifecycle compile boundary"
          git push origin HEAD:agent/native-multi-shop-authority
