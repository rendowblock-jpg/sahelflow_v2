name: Artifact hygiene

# Storage-quota incident (2026-09-24): ~7.5k accumulated artifacts (~900 GB scale)
# exhausted the Actions artifact budget, so every evidence upload in every gate
# failed ("Artifact storage quota has been hit. Usage is recalculated every 6-12
# hours."). Uploads already carry retention-days, but steady-state volume still
# outgrew the bucket between expiry sweeps. This workflow keeps the bucket near
# zero by deleting stale live artifacts daily.
#
# Protected: signed updater candidates (`*-windows-updater-*`) are never swept —
# they are the signed successor staging kept by release.yml.

on:
  schedule:
    # 04:00 UTC daily — after GitHub's 6-12h usage recalculation window.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete live artifacts older than this many days"
        default: "3"
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  actions: write

concurrency:
  group: artifact-hygiene
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sweep:
    name: Sweep stale artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sweep stale live artifacts
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          cutoff=$(( $(date -u +%s) - MAX_AGE_DAYS * 86400 ))
          deleted=0; kept_protected=0; freed=0; page=1
          while :; do
            resp="$(gh api "/repos/${repo}/actions/artifacts?per_page=100&page=${page}")"
            count="$(jq '.artifacts | length' <<<"$resp")"
            if [ "$count" -eq 0 ]; then break; fi
            while IFS=$'\t' read -r id name size created expired; do
              [ "$expired" = "true" ] && continue
              created_ts="$(date -u -d "$created" +%s)"
              if [ "$created_ts" -le "$cutoff" ]; then
                if [[ "$name" == *-windows-updater-* ]]; then
                  echo "KEEP (signed updater candidate): ${id} ${name}"
                  kept_protected=$((kept_protected + 1))
                  continue
                fi
                if [ "$DRY_RUN" = "true" ]; then
                  echo "WOULD DELETE: ${id} ${name} ($(( size / 1048576 )) MB, created ${created})"
                else
                  gh api -X DELETE "/repos/${repo}/actions/artifacts/${id}" >/dev/null
                  echo "DELETED: ${id} ${name} ($(( size / 1048576 )) MB)"
                fi
                freed=$((freed + size))
                deleted=$((deleted + 1))
              fi
            done < <(jq -r '.artifacts[] | [.id, .name, .size_in_bytes, .created_at, (.expired|tostring)] | @tsv' <<<"$resp")
            page=$((page + 1))
          done
          {
            echo "## Artifact hygiene sweep"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Deleted artifacts | ${deleted} |"
            echo "| Freed bytes | ${freed} ($(( freed / 1048576 )) MB) |"
            echo "| Protected signed candidates kept | ${kept_protected} |"
            echo "| Max age | ${MAX_AGE_DAYS} days |"
            echo "| Dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sweep summary: deleted=${deleted} kept_protected=${kept_protected} freed_bytes=${freed} max_age_days=${MAX_AGE_DAYS} dry_run=${DRY_RUN}"
