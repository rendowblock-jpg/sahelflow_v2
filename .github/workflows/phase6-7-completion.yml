name: Phase 6-7 Completion Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: internal-14-version-authority-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  internal14-version-authority:
    name: Apply exact Internal.14 version authority
    if: ${{ github.event.pull_request.head.ref == 'agent/internal-14-phase6-founder-checkpoint' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact milestone head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize Internal.14 authority and milestone truth
        shell: python
        run: |
          from pathlib import Path

          def transition(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  file.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(f'{label}: expected old once or new once in {path}; old={old_count}, new={new_count}')

          transition('sahelflow.version.json', '"version": "1.0.0-internal.13"', '"version": "1.0.0-internal.14"', 'version authority')
          transition('sahelflow.version.json', '"windowsMsiVersion": "1.0.0.13"', '"windowsMsiVersion": "1.0.0.14"', 'MSI authority')
          transition('package.json', '"version": "1.0.0-internal.13"', '"version": "1.0.0-internal.14"', 'package version')
          transition('src-tauri/Cargo.toml', 'version = "1.0.0-internal.13"', 'version = "1.0.0-internal.14"', 'Cargo manifest version')
          transition('src-tauri/Cargo.lock', 'name = "sahelflow"\nversion = "1.0.0-internal.13"', 'name = "sahelflow"\nversion = "1.0.0-internal.14"', 'Cargo lock root version')
          transition('src-tauri/tauri.conf.json', '"version": "1.0.0-internal.13"', '"version": "1.0.0-internal.14"', 'Tauri app version')
          transition('src-tauri/tauri.conf.json', '"version": "1.0.0.13"', '"version": "1.0.0.14"', 'WiX MSI version')
          transition('scripts/install-founder-windows.ps1', "[string]$ExpectedDisplayVersion = '1.0.0.13'", "[string]$ExpectedDisplayVersion = '1.0.0.14'", 'Founder MSI expectation')
          transition('scripts/install-founder-windows.ps1', "[string]$ExpectedAppVersion = '1.0.0-internal.13'", "[string]$ExpectedAppVersion = '1.0.0-internal.14'", 'Founder app expectation')

          transition(
              'README.md',
              '- Latest application-changing protected merge: **PR #220 — Phase 5 whole-product AAA experience convergence**.',
              '- Latest application-changing protected merge: **PR #223 — Phase 6/7 source-browser completion**, protected application SHA `23f1bc3912aecfd2a32c591a18fcca70bf454daa`.',
              'root README application baseline',
          )
          transition(
              'README.md',
              '- Retained installed/human evidence: issues **#201, #214 and #221**.',
              '- Retained installed/human evidence: issues **#201, #214, #221 and #226**.',
              'root README retained evidence',
          )
          transition(
              'README.md',
              '- Published release remains `1.0.0-internal.13` / MSI `1.0.0.13`.',
              '- Requested Founder checkpoint candidate is `1.0.0-internal.14` / MSI `1.0.0.14`; it is **not published** until the exact protected-main signed workflow succeeds.\n- Published release remains `1.0.0-internal.13` / MSI `1.0.0.13`.',
              'root README milestone request',
          )

          transition(
              'documentation/README.md',
              '> **Latest application-changing protected merge:** PR #220',
              '> **Latest application-changing protected merge:** PR #223 at `23f1bc3912aecfd2a32c591a18fcca70bf454daa`\n> **Validated Phase 6/7 source head:** `fa0ff6de649421c879f62364383a363b61c71bfc`',
              'documentation entry application baseline',
          )
          transition(
              'documentation/README.md',
              '> **Retained evidence:** issues #201, #214 and #221',
              '> **Retained evidence:** issues #201, #214, #221 and #226',
              'documentation entry retained evidence',
          )
          transition(
              'documentation/README.md',
              'The active implementation frontier is **Phase 6 — Arabic, RTL and accessibility\nparity**. Start from live protected `main`, reuse the Phase 5 evidence/workbench\ninfrastructure and repair only concrete Phase 6 defects rather than restarting\nwhole-product Phase 5 transformation.',
              'The active product frontier remains **Phase 6 — Arabic, RTL and accessibility\nparity**, but its protected source/browser package is complete through PR #223.\nThe next dependency is the installed/human Phase 5–6 accessibility checkpoint in\nissue #221; do not reopen a broad source audit. Phase 7 installed T470/floor and\neight-hour certification is retained in issue #226 and follows Phase 6 exit.',
              'documentation entry frontier',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '### Internal.14 Phase 5–6 installed checkpoint candidate request'
          if heading not in text:
              marker = '## [Unreleased]\n'
              if text.count(marker) != 1:
                  raise SystemExit('CHANGELOG: expected one Unreleased marker')
              entry = '''## [Unreleased]\n\n### Internal.14 Phase 5–6 installed checkpoint candidate request\n\n- Requests one unique `1.0.0-internal.14` / MSI `1.0.0.14` milestone from the protected Phase 6 source/browser baseline.\n- Includes Phase 5 whole-product experience closure through PR #220 and Phase 6 Arabic/RTL/accessibility plus controlled Phase 7 measurement infrastructure through PR #223.\n- Intended evidence: protected signed MSI, install/reopen and hydrated UI proof, followed by Founder-installed Phase 5–6 visual/accessibility observation and later Phase 7 hardware certification.\n- This source version is a release request only until the exact protected-main signed workflow passes and publishes it; it is not Beta, Stable or Founder acceptance.\n'''
              changelog.write_text(text.replace(marker, entry, 1), encoding='utf-8')

      - name: Commit synchronized Internal.14 milestone request
        shell: bash
        run: |
          set -euo pipefail
          git add \
            sahelflow.version.json \
            package.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/tauri.conf.json \
            scripts/install-founder-windows.ps1 \
            README.md \
            documentation/README.md \
            CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Internal.14 authority already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): request Internal.14 founder checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
