name: Phase 6-7 Completion Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: phase6-7-datatable-repair-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-datatable-reflow:
    name: Apply exact DataTable reflow containment repair
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'agent/phase6-7-completion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - id: patch
        name: Patch DataTable horizontal containment
        shell: python
        run: |
          from pathlib import Path
          import os

          path = Path("src/components/data-table/data-table.tsx")
          text = path.read_text(encoding="utf-8")
          old = '        <div className="overflow-x-auto">'
          new = '        <div className="relative overflow-x-auto">'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              changed = "true"
          elif old_count == 0 and new_count == 1:
              print("DataTable reflow containment repair is already applied.")
              changed = "false"
          else:
              raise SystemExit(
                  f"Expected exactly one pre- or post-repair DataTable scroller, found old={old_count}, new={new_count}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={changed}\n")

      - name: Commit DataTable reflow containment repair
        if: ${{ steps.patch.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add src/components/data-table/data-table.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix DataTable reflow containment"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
