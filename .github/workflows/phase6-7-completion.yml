name: Phase 6-7 Completion Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: phase6-7-repair-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-accessibility:
    name: Apply exact Phase 6 accessibility repair
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch unnamed controls
        shell: python
        run: |
          from pathlib import Path

          def replace_once(label: str, path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "AI mobile back",
              "src/components/ai/ai-chat.tsx",
              '                  onClick={() => setActiveSessionId(null)}',
              "\n".join([
                  '                  type="button"',
                  '                  onClick={() => setActiveSessionId(null)}',
                  '                  aria-label={t("common.backToConversations")}',
              ]),
          )
          replace_once(
              "AI recovery reason",
              "src/components/ai/ai-chat.tsx",
              '                              placeholder={copy.recoveryReason}',
              "\n".join([
                  '                              aria-label={copy.recoveryReason}',
                  '                              placeholder={copy.recoveryReason}',
              ]),
          )
          replace_once(
              "AI composer",
              "src/components/ai/ai-chat.tsx",
              '                  placeholder={t("ai.askPlaceholder")}',
              "\n".join([
                  '                  aria-label={t("ai.askPlaceholder")}',
                  '                  placeholder={t("ai.askPlaceholder")}',
              ]),
          )
          replace_once(
              "Inbox search",
              "src/components/inbox/inbox-live.tsx",
              '                placeholder={t("inbox.searchPlaceholder")}',
              "\n".join([
                  '                aria-label={t("inbox.searchPlaceholder")}',
                  '                placeholder={t("inbox.searchPlaceholder")}',
              ]),
          )
          replace_once(
              "Inbox mobile back",
              "src/components/inbox/inbox-live.tsx",
              '                      onClick={() => setActiveChatId(null)}',
              "\n".join([
                  '                      type="button"',
                  '                      onClick={() => setActiveChatId(null)}',
                  '                      aria-label={t("common.backToConversations")}',
              ]),
          )
          replace_once(
              "Inbox disabled reply",
              "src/components/inbox/inbox-live.tsx",
              '                      placeholder={',
              "\n".join([
                  '                      aria-label={',
                  '                        activeChat.channel === "seeded"',
                  '                          ? t("inbox.seededReplyPlaceholder")',
                  '                          : t("inbox.disconnectedReplyPlaceholder")',
                  '                      }',
                  '                      placeholder={',
              ]),
          )
          replace_once(
              "English back copy",
              "src/lib/i18n/runtime-translations.ts",
              '    "common.breadcrumb": "Breadcrumb",',
              "\n".join([
                  '    "common.breadcrumb": "Breadcrumb",',
                  '    "common.backToConversations": "Back to conversations",',
              ]),
          )
          replace_once(
              "French back copy",
              "src/lib/i18n/runtime-translations.ts",
              '    "common.breadcrumb": "Fil d’Ariane",',
              "\n".join([
                  '    "common.breadcrumb": "Fil d’Ariane",',
                  '    "common.backToConversations": "Retour aux conversations",',
              ]),
          )
          replace_once(
              "Arabic back copy",
              "src/lib/i18n/runtime-translations.ts",
              '    "common.breadcrumb": "مسار التنقل",',
              "\n".join([
                  '    "common.breadcrumb": "مسار التنقل",',
                  '    "common.backToConversations": "العودة إلى المحادثات",',
              ]),
          )

      - name: Commit source repair and restore completion gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0050f12fbf9d2b9cd2ad994dd7a5c3e97ce62d51 -- .github/workflows/phase6-7-completion.yml
          git add \
            .github/workflows/phase6-7-completion.yml \
            src/components/ai/ai-chat.tsx \
            src/components/inbox/inbox-live.tsx \
            src/lib/i18n/runtime-translations.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix phase 6 accessibility control names"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
