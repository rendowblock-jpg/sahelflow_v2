name: Integrate hermetic Windows libsodium build

on:
  push:
    branches:
      - agent/hermetic-libsodium-windows

permissions:
  contents: read

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/hermetic-libsodium-windows
          fetch-depth: 0

      - name: Apply reviewed workflow and contract changes
        run: python .github/patches/integrate-hermetic-libsodium.py

      - name: Verify generated changes
        run: |
          git diff --check
          grep -F '3e03a726fac4bc09cb61d8f29d658ef7a5eca0811de59082130414f7ca2e4279' scripts/prepare-libsodium-windows.ps1
          grep -F 'Prepare signed local libsodium distribution' .github/workflows/release.yml
          grep -F 'Prepare signed local libsodium distribution' .github/workflows/windows-rust-release-parity.yml
          grep -F 'Prepare signed local libsodium distribution' .github/workflows/ci.yml

      - name: Package exact generated files
        run: |
          tar -czf hermetic-libsodium-final-files.tar.gz \
            scripts/prepare-libsodium-windows.ps1 \
            .github/workflows/release.yml \
            .github/workflows/windows-rust-release-parity.yml \
            .github/workflows/ci.yml \
            .gitignore \
            src/lib/__tests__/windows-release-build-contract.test.ts

      - name: Upload generated integration
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-libsodium-final-${{ github.run_id }}
          path: hermetic-libsodium-final-files.tar.gz
          if-no-files-found: error
          retention-days: 2
