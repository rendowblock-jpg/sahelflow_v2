name: Integration source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-checkpoint:
    name: Draft integration source checkpoint
    if: >-
      ${{ github.event.pull_request.draft == true &&
          contains(
            fromJSON('["agent/phases1-4-completion-program","agent/phase3-durable-effects-audit"]'),
            github.event.pull_request.head.ref
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-integration-source
      SF_DATA_DIR: /tmp/sahelflow-integration-source/data
      DATABASE_URL: file:/tmp/sahelflow-integration-source/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-integration-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-bun-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-integration-source

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Type, lint, unit, integration and Prisma checks
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-integration-source.log

      - name: Migration status
        run: bunx prisma migrate status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-diagnostics
          path: |
            .sf-integration-source.log
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2

  task6-capability-artifact:
    name: Build verified Task 6 capability artifact
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' &&
          hashFiles('.github/task6-capability-evidence-repair.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-task6-capability-artifact
      SF_DATA_DIR: /tmp/sahelflow-task6-capability-artifact/data
      DATABASE_URL: file:/tmp/sahelflow-task6-capability-artifact/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed capability repair
        run: python .github/task6-capability-evidence-repair.py

      - name: Format touched TypeScript
        run: >-
          bunx prettier --write
          src/lib/integrations/delivery/provider-capability.ts
          src/lib/integrations/delivery/__tests__/provider-capability.test.ts
          src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-task6-capability-artifact

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Assemble verified source artifact
        run: |
          mkdir -p task6-verified-source/src/lib/integrations/delivery/__tests__
          mkdir -p task6-verified-source/src/lib/integrations/delivery
          mkdir -p task6-verified-source/prisma/migrations/20260804023000_provider_capability_evidence_levels
          cp src/lib/integrations/delivery/provider-capability.ts task6-verified-source/src/lib/integrations/delivery/
          cp src/lib/integrations/delivery/__tests__/provider-capability.test.ts task6-verified-source/src/lib/integrations/delivery/__tests__/
          cp src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts task6-verified-source/src/lib/integrations/delivery/__tests__/
          cp prisma/migrations/20260804023000_provider_capability_evidence_levels/migration.sql task6-verified-source/prisma/migrations/20260804023000_provider_capability_evidence_levels/
          git diff --binary -- \
            src/lib/integrations/delivery/provider-capability.ts \
            src/lib/integrations/delivery/__tests__/provider-capability.test.ts \
            src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts \
            prisma/migrations/20260804023000_provider_capability_evidence_levels/migration.sql \
            > task6-verified-source/task6-capability-evidence.patch
          printf '%s\n' "base=${{ github.event.pull_request.head.sha }}" > task6-verified-source/manifest.txt
          sha256sum \
            task6-verified-source/src/lib/integrations/delivery/provider-capability.ts \
            task6-verified-source/src/lib/integrations/delivery/__tests__/provider-capability.test.ts \
            task6-verified-source/src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts \
            task6-verified-source/prisma/migrations/20260804023000_provider_capability_evidence_levels/migration.sql \
            task6-verified-source/task6-capability-evidence.patch \
            >> task6-verified-source/manifest.txt

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: task6-capability-verified-source
          path: task6-verified-source
          if-no-files-found: error
          retention-days: 2

      - name: Upload repair diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-capability-repair-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
