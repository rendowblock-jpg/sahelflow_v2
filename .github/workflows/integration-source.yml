name: Integration source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-checkpoint:
    name: Draft integration source checkpoint
    if: >-
      ${{ github.event.pull_request.draft == true &&
          contains(
            fromJSON('["agent/phases1-4-completion-program","agent/phase3-durable-effects-audit"]'),
            github.event.pull_request.head.ref
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-integration-source
      SF_DATA_DIR: /tmp/sahelflow-integration-source/data
      DATABASE_URL: file:/tmp/sahelflow-integration-source/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-integration-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-bun-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-integration-source

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Type, lint, unit, integration and Prisma checks
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-integration-source.log

      - name: Migration status
        run: bunx prisma migrate status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-diagnostics
          path: |
            .sf-integration-source.log
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2

  task5-adversarial-repair:
    name: Apply reviewed Task 5 repair
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SF_TEST_ROOT: /tmp/sahelflow-task5-adversarial
      SF_DATA_DIR: /tmp/sahelflow-task5-adversarial/data
      DATABASE_URL: file:/tmp/sahelflow-task5-adversarial/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-durable-effects-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Detect one-time repair marker
        id: repair
        shell: bash
        run: |
          if [[ -f .github/task5-adversarial-trigger ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.repair.outputs.apply == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Extract and apply audited repair
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          raw = Path('.github/workflows/task5-adversarial-repair.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          script = dedent(raw[start:end])
          exec(compile(script, 'task5-adversarial-repair.py', 'exec'))
          PY

      - name: Install frozen dependencies
        if: steps.repair.outputs.apply == 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.repair.outputs.apply == 'true'
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        if: steps.repair.outputs.apply == 'true'
        run: bun run test:sandbox -- "$SF_TEST_ROOT"

      - name: Complete repair gate
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          bun run sf-version
          bun run sf-audit
          bun run sf-verify

      - name: Commit verified repair
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          rm -f .github/task5-adversarial-trigger
          git config user.name "SahelFlow Task 5 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): close adversarial proposal boundaries"
          git push origin HEAD:agent/phase3-durable-effects-audit
