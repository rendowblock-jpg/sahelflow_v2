name: Integration source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-checkpoint:
    name: Draft integration source checkpoint
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phases1-4-completion-program' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-integration-source
      SF_DATA_DIR: /tmp/sahelflow-integration-source/data
      DATABASE_URL: file:/tmp/sahelflow-integration-source/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      SF_TEST_FAIL_FAST: '1'
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply one-time canonical commerce regression repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/data/__tests__/order-create-paths.test.ts')
          text = path.read_text()
          marker = 'commerce sync creates its legacy order and timeline entry'
          if marker not in text:
              print('Canonical commerce regression is already current.')
              raise SystemExit(0)

          import_old = 'import { orderService } from "@/lib/data/order-service";\n'
          import_new = import_old + 'import { executeManualOrderDecision } from "@/lib/orders/manual-confirmation";\n'
          if import_old not in text:
              raise SystemExit('orderService import anchor not found')
          text = text.replace(import_old, import_new, 1)

          first_old = '''  it("commerce sync creates its legacy order and timeline entry", async () => {
    listOrdersMock.mockResolvedValue({
      orders: [normalizedOrder()],
      nextWatermark: "1002",
      hasMore: false,
    } satisfies SyncFetchResult);

    const result = await syncPlatform(
      { prisma: rawDb as never, shop: TEST_SHOP_CONTEXT },
      "shopify",
    );
    expect(result).toMatchObject({ created: 1, errors: [] });
    const order = await rawDb.order.findFirst();
    expect(order?.orderNumber).toMatch(/^SYNC-SHOPIFY-\\d{4}$/);
    expect(
      await rawDb.orderChange.count({
        where: { orderId: order?.id, actionType: "created" },
      }),
    ).toBe(1);
  });
'''
          first_new = '''  it("commerce sync creates one canonical server-priced order and timeline entry", async () => {
    const product = await seedProduct({
      name: "Widget A",
      price: 2750,
      stock: 10,
    });
    listOrdersMock.mockResolvedValue({
      orders: [normalizedOrder()],
      nextWatermark: "1002",
      hasMore: false,
    } satisfies SyncFetchResult);

    const result = await syncPlatform(
      { prisma: rawDb as never, shop: TEST_SHOP_CONTEXT },
      "shopify",
    );
    expect(result).toMatchObject({ created: 1, errors: [] });
    const order = await rawDb.order.findFirst({ include: { items: true } });
    expect(order).toMatchObject({ source: "shopify", status: "pending" });
    expect(order?.orderNumber).toMatch(/^ORD-\\d{4}$/);
    expect(
      isCanonicalOrderAuthority(order?.source, order?.sourceMetadata),
    ).toBe(true);
    expect(order?.items[0]).toMatchObject({
      productId: product.id,
      quantity: 2,
      unitPrice: 2750,
    });
    expect(
      await rawDb.orderChange.count({
        where: { orderId: order?.id, actionType: "created" },
      }),
    ).toBe(1);
  });
'''
          if first_old not in text:
              raise SystemExit('legacy commerce creation block not found')
          text = text.replace(first_old, first_new, 1)

          start = text.index('  it("commerce cancellation uses the status service and restores scalar stock", async () => {')
          end = text.index('  it("AI create_order writes an AI order and created timeline entry", async () => {', start)
          second_new = '''  it("commerce cancellation restores canonical reserved stock", async () => {
    const product = await seedProduct({
      name: "Widget A",
      price: 2000,
      stock: 5,
    });
    listOrdersMock.mockResolvedValueOnce({
      orders: [normalizedOrder({ sourceOrderId: "shop-cancel-001" })],
      nextWatermark: "1002",
      hasMore: false,
    } satisfies SyncFetchResult);
    const first = await syncPlatform(
      { prisma: rawDb as never, shop: TEST_SHOP_CONTEXT },
      "shopify",
    );
    expect(first).toMatchObject({ created: 1, errors: [] });

    const order = await rawDb.order.findFirst({
      where: { sourceOrderId: "shop-cancel-001" },
      include: { items: true },
    });
    expect(order).toMatchObject({ status: "pending", version: 1 });
    expect(order?.items[0]).toMatchObject({
      productId: product.id,
      quantity: 2,
      unitPrice: 2000,
    });
    if (!order) throw new Error("Canonical synced order was not created");

    const confirmation = await executeManualOrderDecision(
      { prisma: rawDb as never },
      {
        orderId: order.id,
        decision: "confirm",
        expectedVersion: order.version,
        idempotencyKey: "commerce-cancel-confirmation",
      },
    );
    expect(confirmation.result).toMatchObject({ status: "confirmed", version: 2 });
    expect(
      (await rawDb.product.findUnique({ where: { id: product.id } }))?.stock,
    ).toBe(3);

    listOrdersMock.mockResolvedValueOnce({
      orders: [
        normalizedOrder({
          sourceOrderId: "shop-cancel-001",
          sourceMetadata: {
            shopifyOrderId: 1001,
            sourceOrderId: "shop-cancel-001",
            rawUpdatedAt: "2026-01-03T10:00:00Z",
            cancelReason: "customer",
          },
        }),
      ],
      nextWatermark: "1003",
      hasMore: false,
    } satisfies SyncFetchResult);
    const result = await syncPlatform(
      { prisma: rawDb as never, shop: TEST_SHOP_CONTEXT },
      "shopify",
    );

    expect(result).toMatchObject({ updated: 1, errors: [] });
    expect((await rawDb.order.findUnique({ where: { id: order.id } }))?.status).toBe(
      "cancelled",
    );
    expect(
      (await rawDb.product.findUnique({ where: { id: product.id } }))?.stock,
    ).toBe(5);
    expect(
      await rawDb.orderChange.count({
        where: { orderId: order.id, actionType: "status_change" },
      }),
    ).toBeGreaterThan(0);
  });

'''
          text = text[:start] + second_new + text[end:]
          path.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/__tests__/order-create-paths.test.ts
          git commit -m "test: align commerce creation paths with canonical authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-integration-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-bun-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-integration-source

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Type, lint, unit, integration and Prisma checks
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-integration-source.log

      - name: Migration status
        run: bunx prisma migrate status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-diagnostics
          path: |
            .sf-integration-source.log
            .sf-vitest-first-failure.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2