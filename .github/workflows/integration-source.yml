name: Integration source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-checkpoint:
    name: Draft integration source checkpoint
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phases1-4-completion-program' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-integration-source
      SF_DATA_DIR: /tmp/sahelflow-integration-source/data
      DATABASE_URL: file:/tmp/sahelflow-integration-source/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      SF_TEST_FAIL_FAST: '1'
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply one-time courier strict-type repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/delivery/canonical-courier.ts')
          text = path.read_text()
          old = 'incomingRank >= DELIVERY_RANK.picked_up'
          new = 'incomingRank >= 1'
          if old not in text:
              print('Courier strict-type repair is already applied.')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/delivery/canonical-courier.ts
          git commit -m "fix: satisfy strict courier status ranking"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-integration-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-bun-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-integration-source

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Type, lint, unit, integration and Prisma checks
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-integration-source.log

      - name: Migration status
        run: bunx prisma migrate status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-diagnostics
          path: |
            .sf-integration-source.log
            .sf-vitest-first-failure.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
