name: Integration source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source-checkpoint:
    name: Draft integration source checkpoint
    if: >-
      ${{ github.event.pull_request.draft == true &&
          contains(
            fromJSON('["agent/phases1-4-completion-program","agent/phase3-durable-effects-audit"]'),
            github.event.pull_request.head.ref
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-integration-source
      SF_DATA_DIR: /tmp/sahelflow-integration-source/data
      DATABASE_URL: file:/tmp/sahelflow-integration-source/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-integration-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-bun-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-integration-source

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Type, lint, unit, integration and Prisma checks
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-integration-source.log

      - name: Migration status
        run: bunx prisma migrate status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-diagnostics
          path: |
            .sf-integration-source.log
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2

  task5-adversarial-repair:
    name: Apply reviewed Task 5 repair
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SF_TEST_ROOT: /tmp/sahelflow-task5-adversarial
      SF_DATA_DIR: /tmp/sahelflow-task5-adversarial/data
      DATABASE_URL: file:/tmp/sahelflow-task5-adversarial/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-durable-effects-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Detect one-time repair marker
        id: repair
        shell: bash
        run: |
          if [[ -f .github/task5-adversarial-trigger ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.repair.outputs.apply == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Extract and apply audited repair
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          raw = Path('.github/workflows/task5-adversarial-repair.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          lines = raw[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          )
          script = script.replace(
              "normalizedDzPhoneSchema",
              "algerianPhoneSchema",
          )

          replace_once = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              old_lines = [line.strip() for line in old.strip().splitlines()]
              new_lines = [line.strip() for line in new.strip().splitlines()]
              source_lines = text.splitlines()
              matches = []
              width = len(old_lines)
              for index in range(0, len(source_lines) - width + 1):
                  if [line.strip() for line in source_lines[index:index + width]] == old_lines:
                      matches.append(index)
              if any(
                  [line.strip() for line in source_lines[index:index + len(new_lines)]] == new_lines
                  for index in range(0, len(source_lines) - len(new_lines) + 1)
              ):
                  return
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected one normalized source match, found {len(matches)}"
                  )
              index = matches[0]
              updated = source_lines[:index] + new_lines + source_lines[index + width:]
              file.write_text(chr(10).join(updated) + (chr(10) if text.endswith(chr(10)) else ""))
          '''
          replace_n = '''def replace_n(path: str, old: str, new: str, expected: int) -> None:
              for _ in range(expected):
                  replace_once(path, old, new)
          '''
          regex_once = '''def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              pattern = pattern.strip()
              pattern = re.sub(r"(?m)^ +", r"[ \\t]*", pattern)
              pattern = re.sub(r"\\\\n +", r"\\\\n[ \\t]*", pattern)
              replacement = chr(10).join(
                  line.strip() for line in replacement.strip().splitlines()
              )
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.S | re.M,
              )
              if count != 1:
                  raise SystemExit(f"{path}: expected one flexible regex match, found {count}")
              file.write_text(updated)
          '''
          write = '''def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              content = chr(10).join(
                  line.strip() for line in content.strip().splitlines()
              )
              file.write_text(content + chr(10))
          '''

          transforms = [
              (
                  r"def replace_once\(.*?(?=\ndef replace_n\()",
                  replace_once,
                  "replace_once",
              ),
              (
                  r"def replace_n\(.*?(?=\ndef regex_once\()",
                  replace_n,
                  "replace_n",
              ),
              (
                  r"def regex_once\(.*?(?=\ndef write\()",
                  regex_once,
                  "regex_once",
              ),
              (
                  r"def write\(.*?(?=\n# Preserve exact custom team permission)",
                  write,
                  "write",
              ),
          ]
          for pattern, replacement, label in transforms:
              script, count = re.subn(
                  pattern,
                  replacement,
                  script,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"repair helper {label}: expected one match, found {count}")

          contracts = Path('src/lib/ai/actions/contracts.ts')
          contract_text = contracts.read_text()
          exact_contract_replacements = [
              (
                  '    commune: z.string().trim().max(120),\n'
                  '    address: z.string().trim().max(500),\n'
                  '    phone: algerianPhoneSchema,',
                  '    commune: z.string().trim().min(1).max(120),\n'
                  '    address: z.string().trim().min(1).max(500),\n'
                  '    phone: algerianPhoneSchema,',
              ),
              (
                  '    wilaya: z.string().trim().max(120).optional(),\n'
                  '    commune: z.string().trim().max(120).optional(),',
                  '    wilaya: z.string().trim().min(1).max(120).optional(),\n'
                  '    commune: z.string().trim().min(1).max(120).optional(),',
              ),
          ]
          for old, new in exact_contract_replacements:
              if new in contract_text:
                  continue
              if contract_text.count(old) != 1:
                  raise SystemExit('contracts: expected one exact remaining validation match')
              contract_text = contract_text.replace(old, new, 1)
          contracts.write_text(contract_text)

          exec(compile(script, 'task5-adversarial-repair.py', 'exec'))
          PY

      - name: Format repaired TypeScript
        if: steps.repair.outputs.apply == 'true'
        run: |
          bunx prettier@3.6.2 --write \
            src/lib/ai/actions/service.ts \
            src/lib/ai/actions/contracts.ts \
            src/lib/ai/actions/targets.ts \
            src/lib/ai/actions/executor.ts \
            src/lib/ai/actions/history.ts \
            src/lib/ai/chat/agent.ts \
            src/lib/ai/chat/tools/core-tools.ts \
            src/app/api/ai/sessions/[id]/actions/route.ts \
            src/app/api/ai/actions/[proposalId]/route.ts \
            src/lib/ai/actions/__tests__/adversarial-repair.test.ts \
            src/lib/ai/actions/__tests__/executor-catalog.test.ts \
            src/lib/ai/actions/__tests__/history-authorization.test.ts \
            src/lib/ai/actions/__tests__/service.test.ts \
            src/lib/ai/actions/__tests__/service-drift-recovery.test.ts \
            src/lib/ai/actions/__tests__/source-contract.test.ts \
            src/lib/ai/chat/__tests__/agent-proposal.test.ts

      - name: Install frozen dependencies
        if: steps.repair.outputs.apply == 'true'
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.repair.outputs.apply == 'true'
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        if: steps.repair.outputs.apply == 'true'
        run: bun run test:sandbox -- "$SF_TEST_ROOT"

      - name: Complete repair gate
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          bun run sf-version
          bun run sf-audit
          bun run sf-verify

      - name: Commit verified repair
        if: steps.repair.outputs.apply == 'true'
        shell: bash
        run: |
          rm -f .github/task5-adversarial-trigger
          git config user.name "SahelFlow Task 5 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): close adversarial proposal boundaries"
          git push origin HEAD:agent/phase3-durable-effects-audit
