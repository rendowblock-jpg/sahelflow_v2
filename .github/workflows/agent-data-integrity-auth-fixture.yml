name: One-shot data-integrity auth fixture

on:
  push:
    branches:
      - agent/phase2-session-freshness
    paths:
      - .github/workflows/agent-data-integrity-auth-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-session-freshness
          fetch-depth: 0

      - name: Replace legacy setup bypass with real session fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/data/__tests__/data-integrity.test.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  ''' *   - Mocks `next/headers` so API routes that call `requireAuth()` pass
           *     (clean DB = no AuthSecret row = setup mode = allowed). The locale
           *     cookie is mutable per-test (scenario #12 sets it to ar/fr/en).'''.replace('          ', ''),
                  ''' *   - Mocks `next/headers` with a real mutable seller-session cookie
           *     created through `setupAuth()` + `createSession()` per scenario. The
           *     locale cookie remains mutable for scenario #12 (ar/fr/en).'''.replace('          ', ''),
              ),
              (
                  '''// ── Mock next/headers ───────────────────────────────────────────────────────
          // requireAuth() reads cookies via next/headers. With a clean DB (no AuthSecret
          // row), isAuthenticated() returns true (setup mode). The locale cookie is
          // served per-test via a mutable holder (scenario #12 sets it to ar/fr/en).
          const localeHolder: { value: string | undefined } = { value: undefined };
          vi.mock("next/headers", () => ({
            cookies: vi.fn(async () => ({
              get: (name: string) => {
                if (name === "sahelflow-locale" && localeHolder.value) {
                  return { value: localeHolder.value };
                }
                return undefined;
              },
              set: () => undefined,
              delete: () => undefined,
            })),
          }));'''.replace('          ', ''),
                  '''// ── Mock next/headers ───────────────────────────────────────────────────────
          // Protected API routes resolve the real revocable session created in beforeEach.
          // Scenario #12 also mutates the locale cookie through the same isolated jar.
          const localeHolder: { value: string | undefined } = { value: undefined };
          const cookieJar = new Map<string, string>();
          vi.mock("next/headers", () => ({
            cookies: vi.fn(async () => ({
              get: (name: string) => {
                if (name === "sahelflow-locale" && localeHolder.value) {
                  return { value: localeHolder.value };
                }
                const value = cookieJar.get(name);
                return value === undefined ? undefined : { value };
              },
              set: (name: string, value: string) => {
                cookieJar.set(name, value);
              },
              delete: (name: string) => {
                cookieJar.delete(name);
              },
            })),
          }));'''.replace('          ', ''),
              ),
              (
                  '''import { GET as confirmationQueueGet } from "@/app/api/orders/confirmation-queue/route";
          
          // ── Test setup'''.replace('          ', ''),
                  '''import { GET as confirmationQueueGet } from "@/app/api/orders/confirmation-queue/route";
          import { createSession, setupAuth } from "@/lib/auth/server";
          
          const SAVED_AUTH_SECRET = process.env.AUTH_SECRET;
          
          // ── Test setup'''.replace('          ', ''),
              ),
              (
                  '''  // Reset locale cookie between tests
            localeHolder.value = undefined;
          }
          
          beforeEach(async () => {
            await cleanAll();
            mockDeliveryAdapter.createShipment.mockReset();'''.replace('          ', ''),
                  '''  // Reset request authority and locale between tests.
            cookieJar.clear();
            localeHolder.value = undefined;
            delete process.env.AUTH_SECRET;
          }
          
          beforeEach(async () => {
            await cleanAll();
            const { secret } = await setupAuth("12345678");
            process.env.AUTH_SECRET = secret;
            await createSession("127.0.0.1");
            mockDeliveryAdapter.createShipment.mockReset();'''.replace('          ', ''),
              ),
              (
                  '''  await cleanAll();
            await rawDb.$disconnect();
          });'''.replace('          ', ''),
                  '''  await cleanAll();
            if (SAVED_AUTH_SECRET === undefined) delete process.env.AUTH_SECRET;
            else process.env.AUTH_SECRET = SAVED_AUTH_SECRET;
            await rawDb.$disconnect();
          });'''.replace('          ', ''),
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/lib/data/__tests__/data-integrity.test.ts
          git rm .github/workflows/agent-data-integrity-auth-fixture.yml
          git config user.name "sahelflow-agent"
          git config user.email "agent@sahelflow.local"
          git add src/lib/data/__tests__/data-integrity.test.ts
          git commit -m "test(auth): authenticate data-integrity routes"
          git push origin HEAD:agent/phase2-session-freshness
