name: Dispatch signed Internal.13 after merge

on:
  push:
    branches:
      - main
    paths:
      - sahelflow.version.json

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-signed-internal-13
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact protected-main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify one-time Internal.13 authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("sahelflow.version.json", encoding="utf-8"))["version"])')"
          if [[ "${version}" != "1.0.0-internal.13" ]]; then
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping: protected main is ${version}, not the one-time Internal.13 candidate."
            exit 0
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid protected-main SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "dispatch=true" >> "${GITHUB_OUTPUT}"

      - name: Dispatch exact-source signed updater workflow
        if: steps.authority.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "source_ref": os.environ["SOURCE_SHA"],
                  "release_notes": "Internal.13 combines the merged Session 1 workspace, startup and Arabic/RTL foundations with the Session 2 business-truth contracts, encrypted atomic command authority, movement facts and recovery hardening."
              }
          }))
          PY
          )"
          status="$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --data "${payload}")"
          if [[ "${status}" != "204" ]]; then
            cat response.txt >&2
            echo "Signed workflow dispatch failed with HTTP ${status}." >&2
            exit 1
          fi
          echo "Dispatched release.yml for exact protected-main source ${SOURCE_SHA}."
