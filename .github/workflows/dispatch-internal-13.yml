name: Ensure and report signed Internal.13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-internal-13.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dispatch-signed-internal-13
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: fb32faedc5ecfc1718e395824f437b805cbb9ef2
      RELEASE_TAG: sahelflow-v1.0.0-internal.13-fb32faedc5ecfc1718e395824f437b805cbb9ef2
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify guarded Internal.13 authority
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("sahelflow.version.json", encoding="utf-8"))["version"])')"
          if [[ "${version}" != "1.0.0-internal.13" ]]; then
            echo "Protected main is ${version}; refusing the one-time Internal.13 dispatch." >&2
            exit 1
          fi
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main

      - name: Detect active or existing signed candidate
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_status="$(curl --silent --show-error --output runs.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=30")"
          if [[ "${runs_status}" != "200" ]]; then
            cat runs.json >&2
            echo "Failed to inspect signed workflow runs: HTTP ${runs_status}." >&2
            exit 1
          fi

          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          data = json.load(open('runs.json', encoding='utf-8'))
          runs = data.get('workflow_runs', [])
          active_states = {'queued', 'in_progress', 'waiting', 'pending', 'requested'}
          active = next((run for run in runs if run.get('status') in active_states), None)
          latest = runs[0] if runs else None
          print(f"previous_latest_id={latest.get('id') if latest else ''}")
          if active:
              print('dispatch=false')
              print('state=active')
              print(f"run_id={active.get('id', '')}")
              print(f"run_url={active.get('html_url', '')}")
              print(f"run_status={active.get('status', '')}")
          else:
              print('dispatch=undecided')
          PY

          if [[ "$(grep '^dispatch=' "${GITHUB_OUTPUT}" | tail -1 | cut -d= -f2)" == "false" ]]; then
            exit 0
          fi

          tag_status="$(curl --silent --show-error --output tag.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          if [[ "${tag_status}" == "200" ]]; then
            {
              echo 'dispatch=false'
              echo 'state=tag_exists'
              echo 'run_status=tag_exists'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${tag_status}" != "404" ]]; then
            cat tag.json >&2
            echo "Failed to inspect Internal.13 tag: HTTP ${tag_status}." >&2
            exit 1
          fi
          {
            echo 'dispatch=true'
            echo 'state=dispatch_required'
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch exact-source signed updater workflow
        if: steps.guard.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'source_ref': os.environ['SOURCE_SHA'],
                  'release_notes': 'Internal.13 combines the Session 1 workspace, startup and Arabic/RTL foundations with the Session 2 business-truth contracts, encrypted atomic command authority, movement facts and recovery hardening.'
              }
          }))
          PY
          )"
          status="$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --data "${payload}")"
          if [[ "${status}" != "204" ]]; then
            cat response.txt >&2
            echo "Signed workflow dispatch failed with HTTP ${status}." >&2
            exit 1
          fi

      - name: Resolve newly dispatched signed run
        id: resolved
        if: steps.guard.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_LATEST_ID: ${{ steps.guard.outputs.previous_latest_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output current-runs.json --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=10")"
            if [[ "${status}" != "200" ]]; then
              cat current-runs.json >&2
              echo "Failed to resolve dispatched run: HTTP ${status}." >&2
              exit 1
            fi
            found="$(python - <<'PY'
            import json, os
            data = json.load(open('current-runs.json', encoding='utf-8'))
            previous = os.environ.get('PREVIOUS_LATEST_ID', '')
            run = next((item for item in data.get('workflow_runs', []) if str(item.get('id', '')) != previous), None)
            if run:
                print(json.dumps({'id': run.get('id'), 'url': run.get('html_url'), 'status': run.get('status')}))
            PY
            )"
            if [[ -n "${found}" ]]; then
              python - <<'PY' >> "${GITHUB_OUTPUT}"
              import json, os
              run = json.loads(os.environ['FOUND'])
              print(f"run_id={run.get('id', '')}")
              print(f"run_url={run.get('url', '')}")
              print(f"run_status={run.get('status', '')}")
              PY
              exit 0
            fi
            sleep 2
          done
          echo 'Signed workflow dispatch was accepted, but its run ID was not visible within the bounded lookup window.' >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_LATEST_ID: ${{ steps.guard.outputs.previous_latest_id }}
          FOUND: ${{ env.FOUND }}

      - name: Report exact release state to issue 164
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_STATE: ${{ steps.guard.outputs.state }}
          GUARD_RUN_ID: ${{ steps.guard.outputs.run_id }}
          GUARD_RUN_URL: ${{ steps.guard.outputs.run_url }}
          GUARD_RUN_STATUS: ${{ steps.guard.outputs.run_status }}
          RESOLVED_RUN_ID: ${{ steps.resolved.outputs.run_id }}
          RESOLVED_RUN_URL: ${{ steps.resolved.outputs.run_url }}
          RESOLVED_RUN_STATUS: ${{ steps.resolved.outputs.run_status }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${RESOLVED_RUN_ID:-${GUARD_RUN_ID:-}}"
          run_url="${RESOLVED_RUN_URL:-${GUARD_RUN_URL:-}}"
          run_status="${RESOLVED_RUN_STATUS:-${GUARD_RUN_STATUS:-unknown}}"
          state="${GUARD_STATE:-unknown}"
          body="$(python - <<'PY'
          import json, os
          run_id = os.environ.get('RUN_ID', '')
          run_url = os.environ.get('RUN_URL', '')
          run_status = os.environ.get('RUN_STATUS', 'unknown')
          state = os.environ.get('STATE', 'unknown')
          lines = [
              '## Internal.13 signed release dispatch',
              '',
              f'- Source: `{os.environ["SOURCE_SHA"]}`',
              f'- Expected tag: `{os.environ["RELEASE_TAG"]}`',
              f'- Dispatcher state: `{state}`',
              f'- Signed run status: `{run_status}`',
          ]
          if run_id:
              lines.append(f'- Signed run ID: `{run_id}`')
          if run_url:
              lines.append(f'- Signed run: {run_url}')
          lines.append(f'- Observer run: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}')
          print(json.dumps({'body': '\n'.join(lines)}))
          PY
          )"
          status="$(curl --silent --show-error --output comment.json --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/164/comments" \
            --data "${body}")"
          if [[ "${status}" != "201" ]]; then
            cat comment.json >&2
            echo "Failed to report Internal.13 release state: HTTP ${status}." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_STATE: ${{ steps.guard.outputs.state }}
          GUARD_RUN_ID: ${{ steps.guard.outputs.run_id }}
          GUARD_RUN_URL: ${{ steps.guard.outputs.run_url }}
          GUARD_RUN_STATUS: ${{ steps.guard.outputs.run_status }}
          RESOLVED_RUN_ID: ${{ steps.resolved.outputs.run_id }}
          RESOLVED_RUN_URL: ${{ steps.resolved.outputs.run_url }}
          RESOLVED_RUN_STATUS: ${{ steps.resolved.outputs.run_status }}
          RUN_ID: ${{ steps.resolved.outputs.run_id || steps.guard.outputs.run_id }}
          RUN_URL: ${{ steps.resolved.outputs.run_url || steps.guard.outputs.run_url }}
          RUN_STATUS: ${{ steps.resolved.outputs.run_status || steps.guard.outputs.run_status }}
          STATE: ${{ steps.guard.outputs.state }}
