name: Build Internal Windows Candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SF_TEST_ROOT: ${{ runner.temp }}\sahelflow-test
      SF_DATA_DIR: ${{ runner.temp }}\sahelflow-test\data
      DATABASE_URL: file:${{ runner.temp }}\sahelflow-test\data\shops\test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: bun run test:sandbox -- "$env:SF_TEST_ROOT"

      - name: Verify product and protocol authority
        run: bun run sf-version

      - name: Verify documentation authority
        run: bun run sf-audit

      - name: Verify TypeScript, lint, tests, and migrations
        run: bun run sf-verify

      - name: Verify Rust runtime
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo check --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Build Windows MSI without publication
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build --bundles msi

      - name: Generate exact candidate evidence manifest
        run: bun run sf-evidence -- --require-clean

      - name: Upload internal candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: sahelflow-1.0-internal-windows-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            .sf-evidence/candidate-manifest.json
            src-tauri/resources/runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 30
