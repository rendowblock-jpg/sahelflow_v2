name: Runtime WebView artifact replay

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/runtime-webview-artifact-replay.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: runtime-webview-artifact-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay ${{ matrix.label }} exact MSI with CDP
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: handoff-b0fec61
            source: b0fec61d574f6ef8eb2a0231da54762bfd99b3c5
            artifact: runtime-webview-diagnostic-handoff-b0fec61-31112998028
    env:
      SOURCE_SHA: ${{ matrix.source }}
      SOURCE_ARTIFACT_RUN_ID: "31112998028"
      DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--remote-debugging-port=9222 --remote-allow-origins=*"

    steps:
      - name: Fetch replay tools without marketplace actions
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $credential = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credential" fetch `
            --no-tags origin $env:DIAGNOSTIC_HEAD_SHA $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach --force $env:DIAGNOSTIC_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve observer outside exact source checkout
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-tools'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Copy-Item -LiteralPath 'scripts/diagnose-installed-webview.ps1' -Destination $toolRoot -Force
          Copy-Item -LiteralPath 'scripts/observe-installed-webview-cdp.mjs' -Destination $toolRoot -Force

      - name: Checkout exact source for the installed harness
        shell: pwsh
        run: |
          git checkout --detach --force $env:SOURCE_SHA
          $actual = git rev-parse HEAD
          if ($actual -cne $env:SOURCE_SHA) {
            throw "Exact-source checkout mismatch: expected $env:SOURCE_SHA, found $actual"
          }

      - name: Install exact Bun without marketplace actions
        shell: pwsh
        run: |
          npm install --global bun@1.3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((bun --version).Trim() -cne '1.3.14') {
            throw "Exact Bun 1.3.14 was not installed."
          }

      - name: Configure isolated WebView2 diagnostic profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-cdp-profile'
          "WEBVIEW2_USER_DATA_FOLDER=$profile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exact frozen browser dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Download already-built exact MSI and evidence
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            gh run download $env:SOURCE_ARTIFACT_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name '${{ matrix.artifact }}' `
              --dir retained-artifact
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $attempts) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (5 * $attempt)
          }

      - name: Extract exact built resource identities for the install harness
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem -LiteralPath 'retained-artifact' -Recurse -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            throw "Expected exactly one retained diagnostic MSI, found $($msis.Count)"
          }

          $administrativeRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-msi-administrative-image'
          $administrativeLog = Join-Path $env:RUNNER_TEMP 'sahelflow-msi-administrative-image.log'
          New-Item -ItemType Directory -Path $administrativeRoot -Force | Out-Null
          $arguments = @(
            '/a',
            "`"$($msis[0].FullName)`"",
            "TARGETDIR=`"$administrativeRoot`"",
            '/qn',
            '/norestart',
            '/L*v',
            "`"$administrativeLog`""
          ) -join ' '
          $extractor = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $arguments -Wait -PassThru
          if ($extractor.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($extractor.ExitCode)."
          }

          $standaloneManifest = @(Get-ChildItem -LiteralPath $administrativeRoot -Recurse `
            -Filter 'sahelflow-standalone-manifest.json' -File)
          $runtimeManifest = @(Get-ChildItem -LiteralPath $administrativeRoot -Recurse `
            -Filter 'runtime-manifest.json' -File)
          if ($standaloneManifest.Count -ne 1 -or $runtimeManifest.Count -ne 1) {
            throw "Administrative image did not contain one exact standalone and runtime manifest."
          }

          New-Item -ItemType Directory -Path 'src-tauri/resources/standalone' -Force | Out-Null
          New-Item -ItemType Directory -Path 'src-tauri/resources/runtime' -Force | Out-Null
          Copy-Item -Path (Join-Path $standaloneManifest[0].DirectoryName '*') `
            -Destination 'src-tauri/resources/standalone' -Recurse -Force
          Copy-Item -Path (Join-Path $runtimeManifest[0].DirectoryName '*') `
            -Destination 'src-tauri/resources/runtime' -Recurse -Force

      - name: Install exact MSI and prove native runtime lifecycle
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-transition-diagnostic'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $msis = @(Get-ChildItem -LiteralPath 'retained-artifact' -Recurse -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            throw "Expected exactly one retained diagnostic MSI, found $($msis.Count)"
          }
          [pscustomobject]@{
            sourceSha = $env:SOURCE_SHA
            retainedArtifact = '${{ matrix.artifact }}'
            fileName = $msis[0].Name
            length = $msis[0].Length
            sha256 = (Get-FileHash -LiteralPath $msis[0].FullName -Algorithm SHA256).Hash
            rebuilt = $false
          } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $destination 'replayed-msi.json') -Encoding UTF8
          ./scripts/verify-installed-windows-msi.ps1 -MsiPath $msis[0].FullName

      - name: Install observation-only tools after exact install
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-tools'
          Copy-Item -LiteralPath (Join-Path $toolRoot 'diagnose-installed-webview.ps1') -Destination 'scripts' -Force
          Copy-Item -LiteralPath (Join-Path $toolRoot 'observe-installed-webview-cdp.mjs') -Destination 'scripts' -Force

      - name: Observe installed browser transitions
        shell: pwsh
        run: ./scripts/diagnose-installed-webview.ps1

      - name: Print replay evidence inventory
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-webview-transition-diagnostic'
          Get-ChildItem -LiteralPath $destination -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTimeUtc |
            ConvertTo-Json -Depth 4 |
            Write-Host
