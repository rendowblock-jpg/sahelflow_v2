name: Phase 3 Task 6 source export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    name: Export exact Phase 3 source
    if: >-
      ${{ github.event.pull_request.draft == true &&
          github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3-task6-source
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=target \
            --exclude=dist \
            --exclude=coverage \
            --exclude='*.db' \
            --exclude='*.db-*' \
            --exclude='.sf-*' \
            -czf /tmp/phase3-task6-source/repository.tar.gz .
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' \
            > /tmp/phase3-task6-source/source-head.txt
          sha256sum /tmp/phase3-task6-source/repository.tar.gz \
            > /tmp/phase3-task6-source/repository.sha256

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: phase3-task6-source
          path: /tmp/phase3-task6-source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
