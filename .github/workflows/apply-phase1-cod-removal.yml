name: Apply Phase 1 COD removal

on:
  push:
    branches:
      - agent/phases1-4-completion-program
    paths:
      - .github/workflows/apply-phase1-cod-removal.yml

permissions:
  contents: write

concurrency:
  group: phase1-cod-removal
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/phases1-4-completion-program
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified patch and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/phase1-remove-legacy-cod-controls.patch
          test "$(sha256sum "$patch" | awk '{print $1}')" = "8f3c59165d0928741650199207f3445923c349d97092c317b853b1af012e8ec6"
          git apply --check "$patch"
          git apply "$patch"
          rm "$patch" .github/workflows/apply-phase1-cod-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "remove legacy COD order controls"
          git push origin "HEAD:agent/phases1-4-completion-program"
