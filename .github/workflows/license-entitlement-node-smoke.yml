name: License Node and authority Windows smoke

on:
  pull_request:
    paths:
      - src/lib/license/entitlement.ts
      - src/lib/license/entitlement-canonical.ts
      - src/lib/license/license-authority.ts
      - src/lib/license/__tests__/entitlement-node-runtime.test.ts
      - src/lib/license/__tests__/license-authority.test.ts
      - .github/workflows/license-entitlement-node-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-entitlement-node-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-windows-smoke:
    name: Verify Node crypto and durable license authority on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot "sahelflow-license-node-smoke-$env:GITHUB_RUN_ID"
          $output = @(& bun run scripts/prepare-test-sandbox.ts $sandboxRoot)
          if ($LASTEXITCODE -ne 0) {
            throw 'canonical test sandbox preparation failed'
          }
          foreach ($name in @('SF_TEST_ROOT', 'SF_DATA_DIR', 'DATABASE_URL')) {
            $line = $output | Where-Object { $_ -like "$name=*" } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw "canonical test sandbox did not return $name"
            }
            $line >> $env:GITHUB_ENV
          }

      - name: Run packaged Node entitlement regression
        run: bunx vitest run src/lib/license/__tests__/entitlement-node-runtime.test.ts

      - name: Run license authority persistence regression
        run: bunx vitest run src/lib/license/__tests__/license-authority.test.ts
