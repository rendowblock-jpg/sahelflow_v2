name: Task 6 commerce runtime UI gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  ui:
    name: Verify and publish commerce runtime UI
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-commerce-ui
      SF_DATA_DIR: /tmp/sahelflow-commerce-ui/data
      DATABASE_URL: file:/tmp/sahelflow-commerce-ui/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed UI wiring
        run: python .github/task6-commerce-ui-wiring.py

      - name: Format runtime UI
        run: >-
          bunx prettier --write
          src/components/settings/integrations-panel.tsx
          src/components/settings/commerce-sync-recovery-panel.tsx
          src/components/settings/__tests__/commerce-sync-runtime-source.test.ts
          src/lib/i18n/commerce-runtime.ts
          src/hooks/use-i18n.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-commerce-ui

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit source-only UI wiring
        run: |
          git config user.name "SahelFlow Task 6 UI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/settings/integrations-panel.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Commerce runtime UI wiring already present"
          else
            git commit -m "feat(task6): surface durable commerce recovery"
            git push origin HEAD:agent/phase3-durable-effects-audit
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-commerce-ui-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
