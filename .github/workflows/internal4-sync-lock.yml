name: Sync internal.4 Cargo lock

on:
  pull_request:
    paths:
      - ".github/workflows/internal4-sync-lock.yml"
      - "package.json"
      - "sahelflow.version.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'release/internal-4-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact authority branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize root Cargo lock package
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "1.0.0-internal.4"
          msi_expected = "1.0.0.4"
          authority = json.loads(Path("sahelflow.version.json").read_text(encoding="utf-8"))
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          cargo_toml = Path("src-tauri/Cargo.toml").read_text(encoding="utf-8")
          lock_path = Path("src-tauri/Cargo.lock")
          lock = lock_path.read_text(encoding="utf-8")

          checks = {
              "authority.version": authority.get("version") == expected,
              "authority.windowsMsiVersion": authority.get("windowsMsiVersion") == msi_expected,
              "package.version": package.get("version") == expected,
              "tauri.version": tauri.get("version") == expected,
              "tauri.wix.version": tauri.get("bundle", {}).get("windows", {}).get("wix", {}).get("version") == msi_expected,
              "cargo.toml": f'version = "{expected}"' in cargo_toml,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("unsynchronized internal.4 authority: " + ", ".join(failed))

          old = 'name = "sahelflow"\nversion = "1.0.0-internal.3"\n'
          new = f'name = "sahelflow"\nversion = "{expected}"\n'
          count = lock.count(old)
          if count != 1:
              raise SystemExit(f"expected one root Cargo.lock package entry, found {count}")
          lock_path.write_text(lock.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git rm -- .github/workflows/internal4-sync-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/Cargo.lock
          git commit -m 'fix(release): synchronize internal.4 Cargo lock authority'
          git push origin HEAD:release/internal-4-authority
