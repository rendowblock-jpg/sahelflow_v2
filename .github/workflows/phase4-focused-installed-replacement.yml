name: Phase 4 focused installed replacement

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-focused-installed-replacement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-replacement:
    # During the narrow diagnostic loop, branch synchronizations intentionally
    # create only a skipped run so they cancel any stale expensive MSI build.
    # Re-enable the draft PR condition in the exact fix commit that is ready
    # for installed replacement evidence, or invoke this workflow manually.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows-installed-e2e.yml
