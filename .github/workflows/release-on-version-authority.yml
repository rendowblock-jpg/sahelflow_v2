name: Dispatch signed internal version

on:
  push:
    branches:
      - main
    paths:
      - sahelflow.version.json
      - .github/release-requests/*.json
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dispatch-signed-internal-version
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact protected-main candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate, dispatch, and record signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import json
          from pathlib import Path

          authority = json.loads(Path('sahelflow.version.json').read_text(encoding='utf-8'))
          version = authority.get('version')
          channel = authority.get('channel')
          updater = authority.get('updater') or {}
          if not isinstance(version, str) or not version.startswith('1.0.0-internal.'):
              raise SystemExit('version authority is not an internal candidate')
          if channel != 'internal':
              raise SystemExit(f'expected internal channel, found {channel!r}')
          if updater.get('enabled') is not True or updater.get('approvalScope') != 'internal-lab':
              raise SystemExit('internal updater authority is not approved')
          print(version)
          PY
          )"

          notes="SahelFlow ${version} immutable Windows candidate from protected main with reviewed-tree check attestation, installed launch, normal close, child teardown, reopen, and signed-artifact lifecycle verification."
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_ref="${SOURCE_SHA}" \
            -f release_notes="${notes}"

          signed_run=""
          for _ in $(seq 1 30); do
            signed_run="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow release.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,status,url,createdAt \
              --jq ".[] | select(.headSha == \"${SOURCE_SHA}\") | [.databaseId,.headSha,.status,.url,.createdAt] | @tsv" \
              | head -n 1)"
            [[ -n "${signed_run}" ]] && break
            sleep 2
          done
          if [[ -z "${signed_run}" ]]; then
            throw_message="signed workflow dispatch was accepted but no exact-source run appeared within 60 seconds"
            echo "${throw_message}" >&2
            exit 1
          fi

          IFS=$'\t' read -r signed_run_id signed_head_sha signed_status signed_url signed_created_at <<< "${signed_run}"
          if [[ "${signed_head_sha}" != "${SOURCE_SHA}" ]]; then
            echo "signed workflow head mismatch: ${signed_head_sha}" >&2
            exit 1
          fi

          release_pr="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main")] | sort_by(.merged_at // .updated_at) | last | .number // empty')"
          if [[ -n "${release_pr}" ]]; then
            body=$(cat <<EOF
          <!-- sahelflow-signed-release-dispatch:${signed_run_id} -->
          **Protected signed candidate dispatched**

          - Version: \`${version}\`
          - Source SHA: \`${SOURCE_SHA}\`
          - Dispatcher run: \`${GITHUB_RUN_ID}\`
          - Signed updater run: \`${signed_run_id}\`
          - Initial status: \`${signed_status}\`
          - Created: \`${signed_created_at}\`
          - Run: ${signed_url}
          EOF
            )
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/issues/${release_pr}/comments" \
              -f body="${body}"
          fi

          echo "Dispatched signed ${version} from ${SOURCE_SHA} as run ${signed_run_id}."
