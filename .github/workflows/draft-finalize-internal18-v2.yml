name: Draft finalize Internal.18 v2

on:
  push:
    branches: [agent/founder-visual-acceptance-repair]
    paths: [.github/workflows/draft-finalize-internal18-v2.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/founder-visual-acceptance-repair
          fetch-depth: 0
      - name: Finalize one draft source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          PARENT = "5234573030e8eb82c579e23c75c3c6c87175c6d4"
          release_files = [
            "package.json", "src-tauri/Cargo.toml", "src-tauri/Cargo.lock",
            "src-tauri/tauri.conf.json", "scripts/sf-version.ts", "src-tauri/build.rs",
            "scripts/install-founder-windows.ps1",
            "src/lib/license/__tests__/license-production-boundary.test.ts",
            ".github/workflows/release.yml",
          ]
          subprocess.run(["git", "checkout", PARENT, "--", *release_files], check=True)

          def read(p): return Path(p).read_text(encoding="utf-8")
          def write(p,s): Path(p).write_text(s, encoding="utf-8")
          def literal(p, old, new, expected=1):
            s=read(p); n=s.count(old)
            if n != expected: raise SystemExit(f"{p}: literal count {n}, expected {expected}: {old!r}")
            write(p, s.replace(old,new,expected))
          def regex(p, pattern, repl, flags=0):
            s=read(p); out,n=re.subn(pattern,repl,s,count=1,flags=flags)
            if n != 1: raise SystemExit(f"{p}: regex did not match: {pattern}")
            write(p,out)

          literal("package.json", '"version": "1.0.0-internal.17"', '"version": "1.0.0-internal.18"')
          literal("src-tauri/Cargo.toml", 'version = "1.0.0-internal.17"', 'version = "1.0.0-internal.18"')
          literal("src-tauri/Cargo.lock", '[[package]]\nname = "sahelflow"\nversion = "1.0.0-internal.17"', '[[package]]\nname = "sahelflow"\nversion = "1.0.0-internal.18"')
          literal("src-tauri/tauri.conf.json", '"version": "1.0.0-internal.17"', '"version": "1.0.0-internal.18"')
          literal("src-tauri/tauri.conf.json", '"version": "1.0.0.17"', '"version": "1.0.0.18"')
          literal("scripts/install-founder-windows.ps1", "[string]$ExpectedDisplayVersion = '1.0.0.17'", "[string]$ExpectedDisplayVersion = '1.0.0.18'")
          literal("scripts/install-founder-windows.ps1", "[string]$ExpectedAppVersion = '1.0.0-internal.17'", "[string]$ExpectedAppVersion = '1.0.0-internal.18'")

          regex("scripts/sf-version.ts", r'(\(authority\.version === "1\.0\.0-internal\.17"\s*&&\s*authority\.licensing\?\.authorityDecision === "FD-036"\))\);', r'\1 ||\n    (authority.version === "1.0.0-internal.18" &&\n      authority.licensing?.authorityDecision === "FD-037"));', re.S)
          literal("scripts/sf-version.ts", "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, or Internal.17/FD-036 on the internal channel with no owned host suffix", "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, Internal.17/FD-036, or Internal.18/FD-037 on the internal channel with no owned host suffix")

          regex("src-tauri/build.rs", r'(\| \(Some\("1\.0\.0-internal\.17"\), Some\("FD-036"\)\))\s*\);', r'\1\n                        | (Some("1.0.0-internal.18"), Some("FD-037"))\n                );', re.S)
          literal("src-tauri/build.rs", "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17 on the internal channel with no owned host suffix", "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, FD-036/Internal.17, or FD-037/Internal.18 on the internal channel with no owned host suffix")

          t="src/lib/license/__tests__/license-production-boundary.test.ts"
          literal(t, 'expect(versionAuthority).toContain(\'"version": "1.0.0-internal.17"\');', 'expect(versionAuthority).toContain(\'"version": "1.0.0-internal.18"\');')
          literal(t, 'expect(versionAuthority).toContain(\'"authorityDecision": "FD-036"\');', 'expect(versionAuthority).toContain(\'"authorityDecision": "FD-037"\');')
          literal(t, "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, or Internal.17/FD-036", "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, Internal.17/FD-036, or Internal.18/FD-037")
          literal(t, 'expect(build).toContain(\'Some("1.0.0-internal.17"), Some("FD-036")\');', 'expect(build).toContain(\'Some("1.0.0-internal.17"), Some("FD-036")\');\n    expect(build).toContain(\'Some("1.0.0-internal.18"), Some("FD-037")\');')
          literal(t, "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17", "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, FD-036/Internal.17, or FD-037/Internal.18")
          literal(t, 'expect(release).toContain("exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17");', 'expect(release).toContain("exact FD-032/Internal.15, FD-034/Internal.16, FD-036/Internal.17, or FD-037/Internal.18");')

          regex(".github/workflows/release.yml", r'(\(\$authority\.version -ceq \'1\.0\.0-internal\.17\' -and\s*\$authority\.licensing\.authorityDecision -ceq \'FD-036\'\))\s*\n\s*\)', r"\1 -or\n                ($authority.version -ceq '1.0.0-internal.18' -and\n                  $authority.licensing.authorityDecision -ceq 'FD-037')\n              )", re.S)
          literal(".github/workflows/release.yml", "founder-offline-only release authority is valid only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17", "founder-offline-only release authority is valid only for exact FD-032/Internal.15, FD-034/Internal.16, FD-036/Internal.17, or FD-037/Internal.18")

          studio="src/components/storefront/studio/storefront-studio.tsx"
          s=read(studio)
          anchor='  const publish = useCallback(async () => {\n    if (!version || dirty || saveState === "saving" || saveState === "conflict") {'
          repl='  const publish = useCallback(async () => {\n    if (draft.isActive && draft.theme.builder.shippingRules.length === 0) {\n      setPanel("checkout");\n      setMessage(t("storefront.studio.shippingEmpty"));\n      return;\n    }\n    if (!version || dirty || saveState === "saving" || saveState === "conflict") {'
          if s.count(anchor)!=1: raise SystemExit("Storefront publish anchor mismatch")
          s=s.replace(anchor,repl,1)
          old='}, [config.id, dirty, draft.isActive, locale, saveState, t, version]);'
          new='}, [config.id, dirty, draft.isActive, draft.theme.builder.shippingRules.length, locale, saveState, t, version]);'
          if s.count(old)!=1: raise SystemExit("Storefront publish deps anchor mismatch")
          write(studio,s.replace(old,new,1))

          contract="src/lib/storefront/storefront-founder-contract.test.ts"
          s=read(contract)
          anchor='  it("exposes active/pause intent in Studio and never reports a pause as published", () => {'
          block='  it("blocks active publish without a delivery rule and opens the actionable checkout panel", () => {\n    const studio = read("src/components/storefront/studio/storefront-studio.tsx");\n    expect(studio).toContain("draft.isActive && draft.theme.builder.shippingRules.length === 0");\n    expect(studio).toContain(\'setPanel("checkout")\');\n    expect(studio).toContain(\'setMessage(t("storefront.studio.shippingEmpty"))\');\n  });\n\n'
          if s.count(anchor)!=1: raise SystemExit("Storefront contract anchor mismatch")
          write(contract,s.replace(anchor,block+anchor,1))
          PY

          git diff --check
          git diff 5234573030e8eb82c579e23c75c3c6c87175c6d4 -- src-tauri/Cargo.lock | tee /tmp/cargo.diff
          grep -F '+version = "1.0.0-internal.18"' /tmp/cargo.diff >/dev/null
          if grep -E '^[-+](name|checksum|dependencies|source)[ =]' /tmp/cargo.diff >/dev/null; then
            echo 'Cargo.lock drift exceeds root version' >&2; exit 1
          fi
          grep -F 'draft.isActive && draft.theme.builder.shippingRules.length === 0' src/components/storefront/studio/storefront-studio.tsx >/dev/null
          git diff --stat

          git config user.name 'sahelflow-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json scripts/sf-version.ts src-tauri/build.rs scripts/install-founder-windows.ps1 src/lib/license/__tests__/license-production-boundary.test.ts .github/workflows/release.yml src/components/storefront/studio/storefront-studio.tsx src/lib/storefront/storefront-founder-contract.test.ts
          git commit -m 'chore(internal.18): finalize release source and storefront publish guard'
          git push origin HEAD:agent/founder-visual-acceptance-repair
