name: Observe and report signed Internal.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-internal-14.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: observe-signed-internal-14
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: sahelflow-v1.0.0-internal.14-${{ github.sha }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Internal.14 protected authority
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("sahelflow.version.json", encoding="utf-8"))["version"])')"
          msi="$(python -c 'import json; print(json.load(open("sahelflow.version.json", encoding="utf-8"))["windowsMsiVersion"])')"
          [[ "${version}" == "1.0.0-internal.14" ]] || { echo "Expected Internal.14, found ${version}" >&2; exit 1; }
          [[ "${msi}" == "1.0.0.14" ]] || { echo "Expected MSI 1.0.0.14, found ${msi}" >&2; exit 1; }
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]] || { echo 'checkout/source mismatch' >&2; exit 1; }
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main

      - name: Wait for exact signed Internal.14 publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            code="$(curl -sS -o exact-release.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
            if [[ "${code}" == '404' ]]; then
              sleep 15
              continue
            fi
            [[ "${code}" == '200' ]] || { cat exact-release.json >&2; exit 1; }
            python - <<'PY'
          import json, os, sys
          r=json.load(open('exact-release.json',encoding='utf-8'))
          if r.get('draft'): sys.exit('Internal.14 release is still draft')
          if r.get('tag_name') != os.environ['RELEASE_TAG']: sys.exit('release tag mismatch')
          names=[a.get('name','') for a in r.get('assets',[])]
          if len([n for n in names if n.endswith('.msi')]) != 1: sys.exit('expected exactly one MSI')
          if len([n for n in names if n.endswith('.msi.sig')]) != 1: sys.exit('expected exactly one MSI signature')
          if names.count('latest.json') != 1: sys.exit('expected exactly one latest.json')
          PY
            echo "release_url=$(python -c 'import json; print(json.load(open("exact-release.json",encoding="utf-8")).get("html_url",""))')" >> "${GITHUB_OUTPUT}"
            exit 0
          done
          echo 'Exact Internal.14 release was not published in the bounded window.' >&2
          exit 1

      - name: Report Internal.14 publication to execution epic
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.publication.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- sahelflow-internal-14-publication:${SOURCE_SHA} -->"
          body=$(cat <<EOF
          ${marker}
          Internal.14 signed updater publication passed for exact protected source \`${SOURCE_SHA}\`.

          - Tag: \`${RELEASE_TAG}\`
          - Release: ${RELEASE_URL}
          - Dispatch authority: protected \`release-on-version-authority.yml\`

          This is an Internal Founder checkpoint, not Beta/Stable or Founder acceptance.
          EOF
          )

          existing_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/164/comments?per_page=100" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
            | tail -n 1)"
          if [[ -n "${existing_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
              -f body="${body}" >/dev/null
          else
            gh issue comment 164 --repo "${GITHUB_REPOSITORY}" --body "${body}"
          fi
