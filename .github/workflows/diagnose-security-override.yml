name: Diagnose Security Override Compatibility

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore exact main dependency inputs
        shell: bash
        run: |
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git show origin/main:package.json > package.json
          git show origin/main:bun.lock > bun.lock

      - name: Add advisory-only semver-union overrides
        shell: bash
        run: |
          bun -e '
            const fs = require("node:fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.overrides = {
              ...(pkg.overrides || {}),
              "brace-expansion": ">=1.1.16 <2 || >=2.1.2 <3 || >=5.0.7 <6",
              "js-yaml": ">=3.15.0 <4 || >=4.3.0 <5 || >=5"
            };
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install exact override tree
        run: bun install --force --linker=hoisted

      - name: TypeScript compatibility
        run: bun run typecheck

      - name: Capture ESLint compatibility result
        id: eslint
        shell: bash
        run: |
          set +e
          bun run lint > "$RUNNER_TEMP/eslint.log" 2>&1
          code=$?
          set -e
          summary="$(tail -n 12 "$RUNNER_TEMP/eslint.log" | tr '\n' ' ' | tr -cs '[:alnum:] ._:/@()-' ' ' | cut -c1-700)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/eslint.log"

      - name: ESLint code=${{ steps.eslint.outputs.code }} error=${{ steps.eslint.outputs.summary }}
        shell: bash
        run: test "${{ steps.eslint.outputs.code }}" -eq 0
