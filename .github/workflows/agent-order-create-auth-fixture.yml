name: One-shot order-create auth fixture

on:
  push:
    branches:
      - agent/phase2-session-freshness
    paths:
      - .github/workflows/agent-order-create-auth-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-session-freshness
          fetch-depth: 0

      - name: Authenticate protected import route fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/data/__tests__/order-create-paths.test.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''// ── Mock next/headers cookies() — the import route calls requireAuth() which
//    reads the auth cookie. With a clean DB (no AuthSecret row),
//    isAuthenticated() returns true (setup mode), so an empty cookie jar
//    passes requireAuth.
vi.mock("next/headers", () => ({
  cookies: vi.fn(async () => ({
    get: () => undefined,
    set: () => undefined,
    delete: () => undefined,
  })),
}));''',
                  '''// The protected import-route scenario uses one real revocable session.
const authCookieStore = vi.hoisted(() => new Map<string, string>());
vi.mock("next/headers", () => ({
  cookies: vi.fn(async () => ({
    get: (name: string) => {
      const value = authCookieStore.get(name);
      return value === undefined ? undefined : { value };
    },
    set: (name: string, value: string) => {
      authCookieStore.set(name, value);
    },
    delete: (name: string) => {
      authCookieStore.delete(name);
    },
  })),
}));''',
              ),
              (
                  '''  seedStorefront,
  seedProduct,
} from "@/app/api/__tests__/helpers";''',
                  '''  seedStorefront,
  seedProduct,
  establishAuthenticatedTestSession,
} from "@/app/api/__tests__/helpers";''',
              ),
              (
                  '''afterAll(async () => {
  await rawDb.$disconnect();
});''',
                  '''afterAll(async () => {
  authCookieStore.clear();
  delete process.env.AUTH_SECRET;
  await rawDb.$disconnect();
});''',
              ),
              (
                  '''beforeEach(async () => {
  await cleanDb();
  listOrdersMock.mockReset();''',
                  '''beforeEach(async () => {
  await cleanDb();
  authCookieStore.clear();
  delete process.env.AUTH_SECRET;
  await establishAuthenticatedTestSession();
  listOrdersMock.mockReset();''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/agent-order-create-auth-fixture.yml
          git config user.name "sahelflow-agent"
          git config user.email "agent@sahelflow.local"
          git add src/lib/data/__tests__/order-create-paths.test.ts
          git commit -m "test(auth): authenticate order-create import fixture"
          git push origin HEAD:agent/phase2-session-freshness
