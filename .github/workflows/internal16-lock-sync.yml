name: Internal.16 exact Cargo lock sync

on:
  pull_request:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/internal16-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: internal16-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/internal-16-founder-offline-checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/internal-16-founder-offline-checkpoint
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Let Cargo synchronize only package metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

      - name: Require one-line lockfile version sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          path = 'src-tauri/Cargo.lock'
          numstat = subprocess.check_output(['git', 'diff', '--numstat', '--', path], text=True).strip()
          if numstat != f'1\t1\t{path}':
              raise SystemExit(f'Cargo lock sync changed more than one line: {numstat!r}')
          diff = subprocess.check_output(['git', 'diff', '--unified=0', '--', path], text=True)
          removed = '-version = "1.0.0-internal.15"'
          added = '+version = "1.0.0-internal.16"'
          if diff.count(removed) != 1 or diff.count(added) != 1:
              raise SystemExit('Cargo lock sync did not contain the exact Internal.15 -> Internal.16 root package change')
          unexpected = [line for line in diff.splitlines() if line.startswith(('+', '-')) and not line.startswith(('+++', '---')) and line not in {removed, added}]
          if unexpected:
              raise SystemExit(f'Unexpected Cargo.lock changes: {unexpected}')
          text = Path(path).read_text(encoding='utf-8')
          marker = 'name = "sahelflow"\nversion = "1.0.0-internal.16"'
          if text.count(marker) != 1:
              raise SystemExit('Cargo.lock does not contain exactly one Internal.16 SahelFlow root package block')
          print(diff)
          PY

      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock already synchronized.'
            exit 0
          fi
          git config user.name 'sahelflow-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'chore(release): synchronize Internal.16 Cargo lock metadata'
          git push origin HEAD:agent/internal-16-founder-offline-checkpoint
