name: Synchronize Internal.13 generated lock

on:
  push:
    branches:
      - codex/session2-internal-13
    paths:
      - .github/workflows/sync-internal-13-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: codex/session2-internal-13

      - name: Synchronize generated Cargo lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          old = 'name = "sahelflow"\nversion = "1.0.0-internal.12"'
          new = 'name = "sahelflow"\nversion = "1.0.0-internal.13"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one SahelFlow Internal.12 lock entry, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/sync-internal-13-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/sync-internal-13-lock.yml
          git commit -m "chore(release): synchronize Internal.13 Cargo lock"
          git push origin HEAD:codex/session2-internal-13
