name: Task 6 commerce page artifact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  artifact:
    name: Build and publish verified commerce page cursor source
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-commerce-page-artifact
      SF_DATA_DIR: /tmp/sahelflow-commerce-page-artifact/data
      DATABASE_URL: file:/tmp/sahelflow-commerce-page-artifact/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed page cursor contract
        run: python .github/task6-commerce-page-contract.py

      - name: Format touched TypeScript
        run: >-
          bunx prettier --write
          src/lib/integrations/ecommerce/types.ts
          src/lib/integrations/ecommerce/shopify.ts
          src/lib/integrations/ecommerce/woocommerce.ts
          src/lib/integrations/ecommerce/youcan.ts
          src/lib/integrations/ecommerce/__tests__/page-cursor-contract.test.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-commerce-page-artifact

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit source-only cursor contract
        run: |
          git config user.name "SahelFlow Task 6 Cursor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/integrations/ecommerce/types.ts \
            src/lib/integrations/ecommerce/shopify.ts \
            src/lib/integrations/ecommerce/woocommerce.ts \
            src/lib/integrations/ecommerce/youcan.ts \
            src/lib/integrations/ecommerce/__tests__/page-cursor-contract.test.ts
          git diff --cached --check
          git commit -m "feat(task6): preserve commerce page continuation"
          git push origin HEAD:agent/phase3-durable-effects-audit

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-commerce-page-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
