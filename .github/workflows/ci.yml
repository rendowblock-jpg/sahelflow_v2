name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same ref/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify PR risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.risk.outputs.docs_only }}
      run_quality: ${{ steps.risk.outputs.run_quality }}
      run_tauri: ${{ steps.risk.outputs.run_tauri }}
      run_windows_standalone: ${{ steps.risk.outputs.run_windows_standalone }}
      run_windows_rust: ${{ steps.risk.outputs.run_windows_rust }}
      run_installed_msi: ${{ steps.risk.outputs.run_installed_msi }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Classify changed paths
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/sahelflow-changed-paths"
          bun scripts/classify-pr-risk.ts < "${RUNNER_TEMP}/sahelflow-changed-paths" | tee -a "${GITHUB_OUTPUT}"

      - name: Record risk lanes
        env:
          DOCS_ONLY: ${{ steps.risk.outputs.docs_only }}
          RUN_QUALITY: ${{ steps.risk.outputs.run_quality }}
          RUN_TAURI: ${{ steps.risk.outputs.run_tauri }}
          RUN_WINDOWS_STANDALONE: ${{ steps.risk.outputs.run_windows_standalone }}
          RUN_WINDOWS_RUST: ${{ steps.risk.outputs.run_windows_rust }}
          RUN_INSTALLED_MSI: ${{ steps.risk.outputs.run_installed_msi }}
        shell: bash
        run: |
          {
            echo '## PR risk classification'
            echo
            echo "- Docs only: ${DOCS_ONLY}"
            echo "- Full source quality: ${RUN_QUALITY}"
            echo "- Tauri release smoke: ${RUN_TAURI}"
            echo "- Windows standalone runtime: ${RUN_WINDOWS_STANDALONE}"
            echo "- Windows Rust parity: ${RUN_WINDOWS_RUST}"
            echo "- Installed MSI lifecycle: ${RUN_INSTALLED_MSI}"
          } >> "${GITHUB_STEP_SUMMARY}"

  authority:
    name: Fast authority (version + documentation)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Product, app, and runtime protocol authority
        run: bun run sf-version

      - name: Documentation authority and relative-link audit
        run: bun run sf-audit

  ci:
    name: Quality Gate (authority + sf-verify + coverage + audit)
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SF_TEST_ROOT: "/tmp/sahelflow-ci-test"
      SF_DATA_DIR: "/tmp/sahelflow-ci-test/data"
      DATABASE_URL: "file:/tmp/sahelflow-ci-test/data/shops/test.db"
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-ci-test

      - name: Product, app, and runtime protocol authority
        run: bun run sf-version

      - name: Documentation authority and relative-link audit
        run: bun run sf-audit

      - name: Generate clean-checkout repository inventory
        run: bun run sf-inventory

      - name: Upload repository and experience inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-experience-inventory
          path: .sf-inventory
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # PROD-026: Run the project's shared quality gate. Tee preserves a complete
      # machine-readable log even when the Actions connector truncates job output.
      - name: Quality gate (tsc + eslint + vitest + prisma)
        run: |
          set -o pipefail
          bun run sf-verify 2>&1 | tee .sf-verify.log

      - name: Upload quality gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-diagnostics
          path: |
            .sf-verify.log
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      # TEST-001: Coverage remains visible as an informational trend signal.
      # Product correctness, security, dependency audit and migration checks stay blocking.
      - name: Coverage check (informational)
        continue-on-error: true
        run: bunx vitest run --coverage

      # PROD-021: Audit dependencies for known vulnerabilities
      - name: Blocking production dependency audit
        run: bun audit --production

      # PROD-001: Verify migrations are in sync with schema
      - name: Migration status
        run: bunx prisma migrate status
        # Migrations are now fully wired (phase4_drift_capture)

  # Release-path proof on the same Windows runner family used by the signed
  # updater workflow. This catches Windows SQLite timing, production resources,
  # the real suspended/Job-Object launcher, and authenticated readiness.
  windows-standalone-build:
    name: Windows database + standalone + contained launcher
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_windows_standalone == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      SF_TEST_FAIL_FAST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Windows Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-contained-bun-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-contained-bun-

      - name: Prepare unique disposable Windows test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot "sahelflow-ci-test-$env:GITHUB_RUN_ID"
          $output = @(& bun run scripts/prepare-test-sandbox.ts $sandboxRoot)
          if ($LASTEXITCODE -ne 0) {
            throw 'canonical test sandbox preparation failed'
          }
          $required = @('SF_TEST_ROOT', 'SF_DATA_DIR', 'DATABASE_URL')
          foreach ($name in $required) {
            $line = $output | Where-Object { $_ -like "$name=*" } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw "canonical test sandbox did not return $name"
            }
            $line >> $env:GITHUB_ENV
          }

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Deploy Windows test database migrations
        run: bunx prisma migrate deploy

      - name: Verify order service database suite on Windows
        shell: pwsh
        run: |
          & bunx vitest run src/lib/data/__tests__/order-service.test.ts 2>&1 |
            Tee-Object -FilePath .sf-windows-order-service.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows database smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-order-service-diagnostics-${{ github.run_id }}
          path: .sf-windows-order-service.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Build exact Windows standalone frontend resources
        run: bun run src-tauri/build-frontend.ts

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Verify bundled Node.js through actual contained launcher
        shell: pwsh
        env:
          SF_CONTAINED_NODE_PATH: ${{ github.workspace }}\src-tauri\resources\runtime\node.exe
        run: |
          & cargo test --manifest-path src-tauri/Cargo.toml contained_node_runs_with_explicit_stdio_handles --locked -- --nocapture 2>&1 |
            Tee-Object -FilePath .sf-contained-node.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload contained Node.js launcher diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contained-node-diagnostics-${{ github.run_id }}
          path: .sf-contained-node.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify staged packaged runtime reaches authenticated readiness
        run: bun run scripts/verify-windows-packaged-runtime.ts

      - name: Upload staged packaged runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-runtime-diagnostics-${{ github.run_id }}
          path: .sf-windows-runtime-smoke.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  # T-M9: Tauri release-path smoke — catches Rust compile errors + Cargo.toml
  # drift in the code that actually ships. The desktop startup supervisor is
  # guarded by cfg(not(debug_assertions)), so a debug cargo check is insufficient.
  tauri-build-smoke:
    name: Tauri Rust smoke (cargo check --release)
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_tauri == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify canonical Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Install Linux dependencies (Tauri native deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-check-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-check-

      - name: Create Linux sidecar stub for cargo check
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu

      - name: cargo check --release (src-tauri)
        working-directory: src-tauri
        env:
          SF_LICENSE_SERVICE_URL: "https://license.invalid"
          SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
        # NOTE: not using --locked here because branches that add/remove a
        # Rust dep would otherwise fail before the release-path compile check.
        run: |
          set -o pipefail
          cargo check --release 2>&1 | tee ../.sf-tauri-release-check.log

      - name: Upload release-path Rust diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-check-diagnostics-${{ github.run_id }}
          path: .sf-tauri-release-check.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  windows-rust-release-parity:
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_windows_rust == 'true' }}
    uses: ./.github/workflows/windows-rust-release-parity.yml

  installed-msi:
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_installed_msi == 'true' }}
    uses: ./.github/workflows/windows-installed-e2e.yml

  required-pr-gate:
    name: Required PR gate
    if: always()
    needs:
      - classify
      - authority
      - ci
      - windows-standalone-build
      - tauri-build-smoke
      - windows-rust-release-parity
      - installed-msi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected risk lane
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          RUN_QUALITY: ${{ needs.classify.outputs.run_quality }}
          QUALITY_RESULT: ${{ needs.ci.result }}
          RUN_WINDOWS_STANDALONE: ${{ needs.classify.outputs.run_windows_standalone }}
          WINDOWS_STANDALONE_RESULT: ${{ needs.windows-standalone-build.result }}
          RUN_TAURI: ${{ needs.classify.outputs.run_tauri }}
          TAURI_RESULT: ${{ needs.tauri-build-smoke.result }}
          RUN_WINDOWS_RUST: ${{ needs.classify.outputs.run_windows_rust }}
          WINDOWS_RUST_RESULT: ${{ needs.windows-rust-release-parity.result }}
          RUN_INSTALLED_MSI: ${{ needs.classify.outputs.run_installed_msi }}
          INSTALLED_MSI_RESULT: ${{ needs.installed-msi.result }}
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local label="$1"
            local result="$2"
            if [[ "${result}" != 'success' ]]; then
              echo "${label} did not succeed: ${result}" >&2
              exit 1
            fi
          }

          require_selected_lane() {
            local label="$1"
            local selected="$2"
            local result="$3"
            if [[ "${selected}" == 'true' ]]; then
              require_success "${label}" "${result}"
            elif [[ "${result}" != 'skipped' ]]; then
              echo "${label} was not selected but returned ${result}" >&2
              exit 1
            fi
          }

          require_success 'PR risk classification' "${CLASSIFY_RESULT}"
          require_success 'Fast authority' "${AUTHORITY_RESULT}"

          if [[ "${IS_DRAFT}" == 'true' ]]; then
            echo 'Draft PR: fast authority passed; heavy lanes remain intentionally deferred.'
            exit 0
          fi

          require_selected_lane 'Full source quality' "${RUN_QUALITY}" "${QUALITY_RESULT}"
          require_selected_lane 'Windows standalone runtime' "${RUN_WINDOWS_STANDALONE}" "${WINDOWS_STANDALONE_RESULT}"
          require_selected_lane 'Tauri release smoke' "${RUN_TAURI}" "${TAURI_RESULT}"
          require_selected_lane 'Windows Rust parity' "${RUN_WINDOWS_RUST}" "${WINDOWS_RUST_RESULT}"
          require_selected_lane 'Installed MSI lifecycle' "${RUN_INSTALLED_MSI}" "${INSTALLED_MSI_RESULT}"
          echo 'Every selected PR risk lane succeeded.'

  # Phase 5 rendered browser evidence is enforced separately by
  # .github/workflows/phase5-experience.yml. The broader full E2E suite remains
  # outside this per-push quality job because it is materially more expensive.
