name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Quality Gate (sf-verify + coverage + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "file:/tmp/ci-test.db"
      SF_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # PROD-026: Run the project's own quality gate (replaces separate lint + tsc + vitest steps)
      - name: Quality gate (tsc + eslint + vitest + prisma)
        run: bun run sf-verify

      # TEST-001: Enforce coverage threshold (60% floor configured in vitest.config.ts)
      # Runs separately so the coverage report is visible in CI output.
      - name: Coverage check
        run: bunx vitest run --coverage

      # PROD-021: Audit dependencies for known vulnerabilities
      - name: Security audit
        run: bun audit --production
        continue-on-error: true # dev-dep vulns are non-blocking; prod-dep vulns are blocking

      # PROD-001: Verify migrations are in sync with schema
      - name: Migration status
        run: bunx prisma migrate status
        continue-on-error: true # non-blocking until migrations are fully wired
