name: Phase 4 source export

on:
  push:
    branches:
      - agent/phase4-protected-data-authority

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-exact-sources
          include-hidden-files: true
          retention-days: 1
          path: |
            scripts/rotate-master-key.ts
            scripts/migrate-protected-data-v1.ts
            src/lib/crypto/protected-pii.ts
            src/lib/crypto/with-protected-pii.ts
            src/lib/crypto/protected-key-authority.ts
            src/lib/crypto/protected-record.ts
            src/lib/maintenance/protected-data-migration.ts
            src/lib/identity/control-authority.ts
            src/lib/db.ts
