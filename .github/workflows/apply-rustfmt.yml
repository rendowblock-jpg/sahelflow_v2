name: Apply Rustfmt Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/rustfmt-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v4
        with:
          ref: agent/rustfmt-release-gate
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatted Rust sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/child_containment.rs src-tauri/src/packaged_runtime.rs; then
            echo 'Rust sources are already formatted'
            exit 0
          fi
          git config user.name 'SahelFlow Rustfmt'
          git config user.email 'rustfmt@users.noreply.github.com'
          git add src-tauri/src/child_containment.rs src-tauri/src/packaged_runtime.rs
          git commit -m 'style(rust): apply canonical rustfmt'
          git push origin HEAD:agent/rustfmt-release-gate
