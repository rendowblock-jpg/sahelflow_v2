name: Refresh Sharp Lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/sharp-audit-unblock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: agent/sharp-audit-unblock
          fetch-depth: 1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Refresh frozen dependency authority
        run: bun install --ignore-scripts --linker=hoisted

      - name: Verify patched production graph
        run: |
          bun audit --production
          bun run build:sidecar
          bun -e "const root=require('./package.json'); const sidecar=require('./sidecars/whatsapp/package.json'); if(root.overrides?.sharp!=='0.35.3'||sidecar.dependencies?.sharp!=='0.35.3') process.exit(1)"
          grep -q '"sharp": "0.35.3"' bun.lock
          grep -q '"sharp": \["sharp@0.35.3"' bun.lock

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already matches the patched graph'
            exit 0
          fi
          git config user.name 'SahelFlow Dependency Lock'
          git config user.email 'dependency-lock@users.noreply.github.com'
          git add bun.lock
          git commit -m 'fix(deps): refresh patched sharp lock'
          git push origin HEAD:agent/sharp-audit-unblock
