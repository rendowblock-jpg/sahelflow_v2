name: Deploy sahelflow.com

# One-click deploy of the website (sahelflow-site) and the trial licensing
# service (sahelflow-licensing) to the SahelFlow Cloudflare account.
# Run it from Actions → "Deploy sahelflow.com" → Run workflow, on main only.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# template, scoped to the SahelFlow account and the sahelflow.com zone) and
# CLOUDFLARE_ACCOUNT_ID. The paid-licence (permanent) key is never involved:
# it stays offline with the Founder.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, site, licensing]
        default: both
      create_trial_key:
        description: "First setup only: create the trial signing key inside Cloudflare"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  TRIAL_KEY_ID: trial-2026-10

jobs:
  site:
    name: Website
    if: github.ref == 'refs/heads/main' && inputs.target != 'licensing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node marketing/build.mjs
      - name: Deploy
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Check
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://sahelflow.com/ar/ || true)
            [ "$code" = "200" ] && { echo "sahelflow.com/ar/ → 200" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 20
          done
          echo "sahelflow.com did not answer 200 yet (DNS may still be propagating; re-run later)." >> "$GITHUB_STEP_SUMMARY"

  licensing:
    name: Licensing service
    if: github.ref == 'refs/heads/main' && inputs.target != 'site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KNOWN_TRIAL_KEYS: ${{ vars.SF_LICENSE_TRIAL_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create trial signing key (private half goes only to Cloudflare)
        if: inputs.create_trial_key
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync, appendFileSync } from "node:fs";
          const id = process.env.TRIAL_KEY_ID;
          const known = process.env.KNOWN_TRIAL_KEYS ? JSON.parse(process.env.KNOWN_TRIAL_KEYS) : {};
          if (known[id]) {
            console.error(`${id} already exists in SF_LICENSE_TRIAL_PUBLIC_KEYS. Installed apps trust that key; creating a new one under the same id would break their trials.`);
            process.exit(1);
          }
          const pair = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
          const publicKey = Buffer.from(await crypto.subtle.exportKey("raw", pair.publicKey)).toString("base64");
          const pkcs8 = Buffer.from(await crypto.subtle.exportKey("pkcs8", pair.privateKey)).toString("base64");
          writeFileSync(`${process.env.RUNNER_TEMP}/trial.private`, pkcs8, { mode: 0o600 });
          const keyring = JSON.stringify({ ...known, [id]: publicKey });
          appendFileSync(process.env.GITHUB_ENV, `TRIAL_KEYRING=${keyring}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "### New trial key created",
            "Set the repository **variable** `SF_LICENSE_TRIAL_PUBLIC_KEYS` to exactly:",
            "```", keyring, "```",
            `(The new entry alone is \`"${id}":"${publicKey}"\` if you merge it by hand.)`,
            "This is the public half; it is safe to copy. The private half exists only inside Cloudflare.",
            "",
          ].join("\n"));
          EOF

      - name: Use the existing trial keyring
        if: ${{ !inputs.create_trial_key }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";
          const id = process.env.TRIAL_KEY_ID;
          const known = process.env.KNOWN_TRIAL_KEYS ? JSON.parse(process.env.KNOWN_TRIAL_KEYS) : {};
          if (!known[id]) {
            console.error(`SF_LICENSE_TRIAL_PUBLIC_KEYS has no ${id}. For the first deploy, run with "create trial key" ticked.`);
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_ENV, `TRIAL_KEYRING=${JSON.stringify(known)}\n`);
          EOF

      - name: Pin the public keyring into the deploy config
        working-directory: control-plane/licensing
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const toml = readFileSync("wrangler.toml", "utf8");
          const line = /^SF_LICENSE_TRIAL_PUBLIC_KEYS = .*$/m;
          if (!line.test(toml)) throw new Error("SF_LICENSE_TRIAL_PUBLIC_KEYS line not found");
          writeFileSync("wrangler.toml", toml.replace(line, `SF_LICENSE_TRIAL_PUBLIC_KEYS = '${process.env.TRIAL_KEYRING}'`));
          EOF

      - name: Deploy
        working-directory: control-plane/licensing
        run: npx --yes wrangler@4 deploy

      - name: Store the trial private key as a Worker secret
        if: inputs.create_trial_key
        working-directory: control-plane/licensing
        run: |
          npx --yes wrangler@4 secret put TRIAL_PRIVATE_KEY_PKCS8 < "$RUNNER_TEMP/trial.private"
          shred -u "$RUNNER_TEMP/trial.private"

      - name: Check both licensing origins
        run: |
          for origin in https://license.sahelflow.com https://activate.sahelflow.com; do
            ok=""
            for attempt in 1 2 3 4 5 6; do
              body=$(curl -s "$origin/healthz" || true)
              if echo "$body" | grep -q '"status":"ok"'; then ok=1; break; fi
              sleep 20
            done
            if [ -n "$ok" ]; then
              echo "$origin/healthz → ok" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$origin/healthz → not ready ($body)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          [ -z "$failed" ]
