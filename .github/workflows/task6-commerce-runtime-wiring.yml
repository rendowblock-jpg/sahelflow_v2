name: Task 6 commerce runtime wiring

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  wire:
    name: Verify and publish durable commerce runtime wiring
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-commerce-runtime
      SF_DATA_DIR: /tmp/sahelflow-commerce-runtime/data
      DATABASE_URL: file:/tmp/sahelflow-commerce-runtime/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed runtime wiring
        run: python .github/task6-commerce-runtime-wiring.py

      - name: Format runtime source
        run: >-
          bunx prettier --write
          src/lib/integrations/ecommerce/runtime-contracts.ts
          src/lib/integrations/ecommerce/commerce-payload.ts
          src/lib/integrations/ecommerce/queue.ts
          src/lib/integrations/ecommerce/processor.ts
          src/lib/integrations/ecommerce/worker.ts
          src/lib/integrations/ecommerce/sync-engine.ts
          src/lib/integrations/ecommerce/__tests__/durable-runtime.test.ts
          src/app/api/integrations/sync/route.ts
          src/instrumentation.ts
          src/app/api/__tests__/helpers.ts
          src/lib/data/__tests__/helpers.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-commerce-runtime

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit source-only runtime wiring
        run: |
          git config user.name "SahelFlow Task 6 Commerce"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/integrations/ecommerce/runtime-contracts.ts \
            src/lib/integrations/ecommerce/commerce-payload.ts \
            src/lib/integrations/ecommerce/queue.ts \
            src/lib/integrations/ecommerce/processor.ts \
            src/lib/integrations/ecommerce/worker.ts \
            src/lib/integrations/ecommerce/sync-engine.ts \
            src/lib/integrations/ecommerce/__tests__/durable-runtime.test.ts \
            src/app/api/integrations/sync/route.ts \
            src/instrumentation.ts \
            src/app/api/__tests__/helpers.ts \
            src/lib/data/__tests__/helpers.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Runtime wiring is already present"
          else
            git commit -m "feat(task6): execute commerce sync from durable workers"
            git push origin HEAD:agent/phase3-durable-effects-audit
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-commerce-runtime-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
