name: Apply Release Evidence Workflow Patch

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-release-evidence-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-release-workflow-patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/release-evidence-clean-tree'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-release-contract
      SF_DATA_DIR: /tmp/sahelflow-release-contract/data
      DATABASE_URL: file:/tmp/sahelflow-release-contract/data/shops/test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- "$SF_TEST_ROOT"

      - name: Apply exact release workflow patch
        run: bun run scripts/apply-release-evidence-workflow-patch.ts

      - name: Verify patch scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != ".github/workflows/release.yml" ]; then
            echo 'unexpected generated changes:'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Collect release contract diagnostics
        id: contract
        shell: bash
        run: |
          workflow='.github/workflows/release.yml'
          helper='scripts/generate-release-evidence-worktree.ts'
          count() { grep -F -c -- "$1" "$2" || true; }
          echo "attest=$(count 'Attest clean exact source checkout' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "tracked=$(count 'Verify build preserved tracked source' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "evidence=$(count 'Generate signed candidate evidence manifest from clean worktree' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "helper_call=$(count 'bun run scripts/generate-release-evidence-worktree.ts' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "worktree=$(count 'worktree", "add", "--detach' "$helper")" >> "$GITHUB_OUTPUT"
          echo "require_clean=$(count '"--require-clean"' "$helper")" >> "$GITHUB_OUTPUT"
          echo "signed=$(count '"--signed-updater"' "$helper")" >> "$GITHUB_OUTPUT"
          echo "tag=$(count '$tag = "sahelflow-v$($authority.version)-$env:SF_SOURCE_COMMIT"' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "tag_name=$(count 'tagName: sahelflow-v__VERSION__-${{ inputs.source_ref }}' "$workflow")" >> "$GITHUB_OUTPUT"
          destructive=$(( $(count 'git clean -fd' "$workflow") + $(count 'gh release delete' "$workflow") + $(count 'git clean -fd' "$helper") + $(count 'gh release delete' "$helper") ))
          echo "destructive=$destructive" >> "$GITHUB_OUTPUT"

      - name: Contract attest=${{ steps.contract.outputs.attest }} tracked=${{ steps.contract.outputs.tracked }} evidence=${{ steps.contract.outputs.evidence }} helper=${{ steps.contract.outputs.helper_call }} worktree=${{ steps.contract.outputs.worktree }} clean=${{ steps.contract.outputs.require_clean }} signed=${{ steps.contract.outputs.signed }} tag=${{ steps.contract.outputs.tag }} tagName=${{ steps.contract.outputs.tag_name }} destructive=${{ steps.contract.outputs.destructive }}
        run: true

      - name: Verify updater and release contract
        run: bun run sf-version

      - name: Verify Windows release contract tests
        run: bunx vitest run src/lib/__tests__/windows-release-build-contract.test.ts

      - name: Commit generated workflow repair
        id: push_repair
        continue-on-error: true
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'fix(release): hand off evidence through clean worktree' 2>&1 | tee .release-workflow-commit.log
          commit_status=${PIPESTATUS[0]}
          commit_sha=$(git rev-parse HEAD)
          push_status=99
          if [ "$commit_status" -eq 0 ]; then
            git push origin "HEAD:$HEAD_BRANCH" 2>&1 | tee .release-workflow-push.log
            push_status=${PIPESTATUS[0]}
          fi
          echo "commit_status=$commit_status" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "push_status=$push_status" >> "$GITHUB_OUTPUT"
          message=$(cat .release-workflow-commit.log .release-workflow-push.log 2>/dev/null | grep -E 'remote:|error:|fatal:|rejected|denied|refusing' | tail -n 2 | tr '\n' ' ' | tr -s ' ' | cut -c1-220)
          message=${message//'%'/'%25'}
          message=${message//$'\n'/'%0A'}
          message=${message//$'\r'/'%0D'}
          echo "message=$message" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generated=${{ steps.push_repair.outputs.commit_sha }} commit=${{ steps.push_repair.outputs.commit_status }} push=${{ steps.push_repair.outputs.push_status }} error=${{ steps.push_repair.outputs.message }}
        if: always()
        shell: bash
        run: test "${{ steps.push_repair.outputs.commit_status }}" = "0" -a "${{ steps.push_repair.outputs.push_status }}" = "0"
