name: Apply Release Evidence Workflow Patch

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-release-workflow-patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/release-evidence-clean-tree'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Apply exact release workflow patch
        run: bun run scripts/apply-release-evidence-workflow-patch.ts

      - name: Verify patch scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != ".github/workflows/release.yml" ]; then
            echo 'unexpected generated changes:'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Collect release contract diagnostics
        id: contract
        shell: bash
        run: |
          workflow='.github/workflows/release.yml'
          helper='scripts/generate-release-evidence-worktree.ts'
          count() { grep -F -c -- "$1" "$2" || true; }
          echo "attest=$(count 'Attest clean exact source checkout' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "tracked=$(count 'Verify build preserved tracked source' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "evidence=$(count 'Generate signed candidate evidence manifest from clean worktree' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "helper_call=$(count 'bun run scripts/generate-release-evidence-worktree.ts' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "worktree=$(count 'worktree", "add", "--detach' "$helper")" >> "$GITHUB_OUTPUT"
          echo "require_clean=$(count '"--require-clean"' "$helper")" >> "$GITHUB_OUTPUT"
          echo "signed=$(count '"--signed-updater"' "$helper")" >> "$GITHUB_OUTPUT"
          echo "tag=$(count '$tag = "sahelflow-v$($authority.version)-$env:SF_SOURCE_COMMIT"' "$workflow")" >> "$GITHUB_OUTPUT"
          echo "tag_name=$(count 'tagName: sahelflow-v__VERSION__-${{ inputs.source_ref }}' "$workflow")" >> "$GITHUB_OUTPUT"
          destructive=$(( $(count 'git clean -fd' "$workflow") + $(count 'gh release delete' "$workflow") + $(count 'git clean -fd' "$helper") + $(count 'gh release delete' "$helper") ))
          echo "destructive=$destructive" >> "$GITHUB_OUTPUT"

      - name: Contract attest=${{ steps.contract.outputs.attest }} tracked=${{ steps.contract.outputs.tracked }} evidence=${{ steps.contract.outputs.evidence }} helper=${{ steps.contract.outputs.helper_call }} worktree=${{ steps.contract.outputs.worktree }} clean=${{ steps.contract.outputs.require_clean }} signed=${{ steps.contract.outputs.signed }} tag=${{ steps.contract.outputs.tag }} tagName=${{ steps.contract.outputs.tag_name }} destructive=${{ steps.contract.outputs.destructive }}
        run: true

      - name: Verify updater and release contract
        run: bun run sf-version

      - name: Verify Windows release contract tests
        run: bunx vitest run scripts/__tests__/windows-release-build-contract.test.ts

      - name: Commit exact workflow repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'fix(release): hand off evidence through clean worktree'
          git push origin "HEAD:$HEAD_BRANCH"
