name: Native source contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src-tauri/**"
      - ".github/workflows/native-source.yml"

concurrency:
  group: native-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap-handoff-repair:
    name: Restore host-only runtime bootstrap handoff
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.ref == 'agent/native-multi-shop-authority' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head with write authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore host-only HTTP bootstrap handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/startup_recovery.rs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('use tauri::webview::{cookie::SameSite, Cookie, WebviewWindow};', 'use tauri::webview::WebviewWindow;'),
              (
                  '''struct PackagedHandoff {
    workspace_url: tauri::Url,
    host: String,
    token: String,
}''',
                  '''struct PackagedHandoff {
    bootstrap_url: tauri::Url,
}''',
              ),
              (
                  '''/// Development URLs are shown immediately. A packaged bootstrap URL is never
/// loaded into the WebView: the per-launch credential is extracted in Rust,
/// injected into the native cookie store, and removed from browser navigation.
/// The hidden window is shown only after a hydrated page reports an authenticated
/// UI acknowledgment matching the current runtime endpoint instance.''',
                  '''/// Development URLs are shown immediately. Packaged startup loads a hidden,
/// one-time loopback bootstrap document. That response sets the host-only HttpOnly
/// launch cookie, then uses `location.replace("/")` so the credential-bearing URL
/// is replaced before the workspace can become visible. The hidden window is shown
/// only after a hydrated page reports an authenticated UI acknowledgment matching
/// the current runtime endpoint instance.''',
              ),
              (
                  '''    window.hide()?;
    window.set_cookie(runtime_cookie(&handoff.host, &handoff.token)?)?;
    window.navigate(handoff.workspace_url)?;''',
                  '''    window.hide()?;
    window.navigate(handoff.bootstrap_url)?;''',
              ),
              (
                  '''    let mut workspace_url = url.clone();
    workspace_url.set_path("/");
    workspace_url.set_query(None);
    workspace_url.set_fragment(None);

    Ok(Some(PackagedHandoff {
        workspace_url,
        host: host.to_string(),
        token,
    }))''',
                  '''    Ok(Some(PackagedHandoff {
        bootstrap_url: url.clone(),
    }))''',
              ),
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'startup_recovery.rs: expected one anchor, found {count}: {before[:80]!r}')
              source = source.replace(before, after, 1)

          cookie_start = source.find('fn runtime_cookie(')
          monitor_start = source.find('fn monitor_packaged_ui(')
          if cookie_start < 0 or monitor_start < 0 or monitor_start <= cookie_start:
              raise SystemExit('startup_recovery.rs: runtime cookie helper boundaries not found')
          source = source[:cookie_start] + source[monitor_start:]

          test_start = source.find('    #[test]\n    fn packaged_handoff_removes_the_credential_from_browser_navigation()')
          next_test = source.find('    #[test]\n    fn ui_ready_must_match_the_current_runtime_instance()', test_start)
          if test_start < 0 or next_test < 0:
              raise SystemExit('startup_recovery.rs: packaged handoff test boundaries not found')
          replacement_test = '''    #[test]
    fn packaged_handoff_accepts_only_a_valid_loopback_bootstrap() {
        let token = "a".repeat(64);
        let url = tauri::Url::parse(&format!(
            "http://127.0.0.1:43123{RUNTIME_BOOTSTRAP_PATH}?token={token}"
        ))
        .unwrap();

        let handoff = packaged_handoff(&url).unwrap().unwrap();
        assert_eq!(handoff.bootstrap_url, url);
    }

'''
          source = source[:test_start] + replacement_test + source[next_test:]
          path.write_text(source, encoding='utf-8')

          contract = Path('src/lib/__tests__/windows-installed-runtime-contract.test.ts')
          test_source = contract.read_text(encoding='utf-8')
          route_anchor = '''    const uiRoute = read("src/app/api/internal/runtime-ui-ready/route.ts");
    const runtimeRoute = read("src/app/api/internal/runtime-ready/route.ts");'''
          route_replacement = '''    const uiRoute = read("src/app/api/internal/runtime-ui-ready/route.ts");
    const bootstrapRoute = read(
      "src/app/api/internal/runtime-bootstrap/route.ts",
    );
    const runtimeRoute = read("src/app/api/internal/runtime-ready/route.ts");'''
          if test_source.count(route_anchor) != 1:
              raise SystemExit('runtime contract: bootstrap route declaration anchor not found')
          test_source = test_source.replace(route_anchor, route_replacement, 1)

          assertion_anchor = '''    expect(recovery).toContain("window.show().and_then(|_| window.set_focus())");
    expect(recovery).toContain("SahelFlow - Startup blocked");'''
          assertion_replacement = '''    expect(recovery).toContain("window.show().and_then(|_| window.set_focus())");
    expect(recovery).toContain("window.navigate(handoff.bootstrap_url)?");
    expect(recovery).not.toContain("window.set_cookie(");
    expect(bootstrapRoute).toContain('window.location.replace("/")');
    expect(bootstrapRoute).toContain("bootstrapConsumed = true");
    expect(bootstrapRoute).toContain("httpOnly: true");
    expect(bootstrapRoute).toContain('"Cache-Control": "no-store"');
    expect(bootstrapRoute).toContain('"Referrer-Policy": "no-referrer"');
    expect(recovery).toContain("SahelFlow - Startup blocked");'''
          if test_source.count(assertion_anchor) != 1:
              raise SystemExit('runtime contract: bootstrap assertions anchor not found')
          test_source = test_source.replace(assertion_anchor, assertion_replacement, 1)
          contract.write_text(test_source, encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git show HEAD^:.github/workflows/native-source.yml > .github/workflows/native-source.yml
          rm -f .github/workflows/phase2-runtime-bootstrap-handoff-repair.yml
          git diff --check

      - name: Commit source repair and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SahelFlow Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/src/startup_recovery.rs \
                  src/lib/__tests__/windows-installed-runtime-contract.test.ts \
                  .github/workflows/native-source.yml \
                  .github/workflows/phase2-runtime-bootstrap-handoff-repair.yml
          git commit -m 'fix(desktop): restore host-only runtime bootstrap handoff'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  native-source:
    name: Native source contract (Rust 1.77 + stable Tauri)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup minimum supported Rust
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          components: clippy

      - name: Cache lifecycle MSRV crate
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/contracts/shop-lifecycle/target
          key: ${{ runner.os }}-cargo-shop-lifecycle-rust177-${{ hashFiles('src-tauri/contracts/shop-lifecycle/Cargo.toml', 'src-tauri/src/shop_lifecycle.rs', 'src-tauri/src/shop_lifecycle_command.rs', 'src-tauri/tests/shop_lifecycle_*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-shop-lifecycle-rust177-

      - name: Run lifecycle contracts on Rust 1.77
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/contracts/shop-lifecycle/Cargo.toml --all-targets -- --nocapture 2>&1 |
            tee .sf-native-msrv-test.log

      - name: Lint lifecycle contracts on Rust 1.77
        run: cargo clippy --manifest-path src-tauri/contracts/shop-lifecycle/Cargo.toml --all-targets -- -D warnings

      - name: Setup stable Rust for the real Tauri graph
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Tauri Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-native-source-stable-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-native-source-stable-

      - name: Create Linux sidecar stub
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu

      - name: Verify canonical Rust formatting
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 |
            tee .sf-native-fmt.log

      - name: Run native lifecycle contracts in the Tauri package
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --test shop_lifecycle_contract --locked -- --nocapture 2>&1 |
            tee .sf-native-source-test.log
          cargo test --manifest-path src-tauri/Cargo.toml --test shop_lifecycle_protocol_diagnostics --locked -- --nocapture 2>&1 |
            tee -a .sf-native-source-test.log
          cargo test --manifest-path src-tauri/Cargo.toml --test shop_lifecycle_switch --locked -- --nocapture 2>&1 |
            tee -a .sf-native-source-test.log
          cargo test --manifest-path src-tauri/Cargo.toml --test shop_lifecycle_mutation --locked -- --nocapture 2>&1 |
            tee -a .sf-native-source-test.log

      - name: Verify Tauri release compilation
        env:
          SF_LICENSE_SERVICE_URL: "https://license.invalid"
          SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
          SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
        run: cargo check --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Upload native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-source-diagnostics-${{ github.run_id }}
          path: |
            .sf-native-msrv-test.log
            .sf-native-fmt.log
            .sf-native-source-test.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2
