name: Phase 4 handoff truth

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase4-handoff-truth
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile and verify Phase 4 handoff
    if: ${{ github.event.pull_request.head.ref == 'agent/phase4-handoff-truth' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Reconcile wrapped audit summary patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/phase4-handoff-truth.py')
          content = path.read_text(encoding='utf-8')
          old = '''old_summary = "Documentation authority audit passed (18 Markdown files; 10 active documentation authorities; Tasks 3–6 source-closed; Phase 3 Level 2 passed; live/installed evidence open)."
          new_summary = "Documentation authority audit passed (18 Markdown files; 10 active documentation authorities; Phase 3 protected-source closed; Phase 4 audit active; provider/installed evidence retained for later gates)."
          replace_once(audit, old_summary, new_summary)
          '''
          new = '''replace_regex(
              audit,
              r"console\\.log\\(\\s*`Documentation authority audit passed \\(.*?live/installed evidence open\\)\\.`,\\s*\\);",
              """console.log(
            `Documentation authority audit passed (${markdownFiles.length} Markdown files; ${activeDocumentationFiles.length} active documentation authorities; Phase 3 protected-source closed; Phase 4 audit active; provider/installed evidence retained for later gates).`,
          );""",
          )
          '''
          if content.count(old) != 1:
              raise RuntimeError('audit summary patch anchor drifted')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply handoff reconciliation
        run: python .github/phase4-handoff-truth.py

      - name: Separate live main from historical Phase 3 base
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sf-audit.ts')
          content = path.read_text(encoding='utf-8')
          old = '''const expectedProtectedBase = "aa4ca0758fd696f4b02fc1975629ac698f9349c3";
          for (const relativePath of [
          '''
          new = '''const expectedCurrentMain = "aa4ca0758fd696f4b02fc1975629ac698f9349c3";
          const expectedProtectedBase = "e9c92f08f39e8d87ddfd72d2e698418ae81fc084";
          for (const relativePath of [
          '''
          if content.count(old) != 1:
              raise RuntimeError('current-main/checkpoint-base anchor drifted')
          content = content.replace(old, new, 1)
          old_lookup = 'if (content && !content.includes(expectedProtectedBase)) {'
          new_lookup = 'if (content && !content.includes(expectedCurrentMain)) {'
          if content.count(old_lookup) < 1:
              raise RuntimeError('current-main lookup anchor drifted')
          content = content.replace(old_lookup, new_lookup, 1)
          path.write_text(content, encoding='utf-8')
          PY

      - name: Format changed authority
        run: >-
          bunx prettier --write
          README.md
          AGENTS.md
          CHANGELOG.md
          documentation/README.md
          documentation/system/CURRENT_STATE.md
          documentation/system/ROADMAP.md
          documentation/operations/WORKING_MEMORY.md
          scripts/sf-audit.ts

      - name: Verify version and documentation authority
        run: |
          bun run sf-version
          bun run sf-audit
          bun run sf-inventory
          git diff --check

      - name: Publish verified handoff truth
        run: |
          rm .github/phase4-handoff-truth.py
          rm .github/workflows/phase4-handoff-truth.yml
          git config user.name "SahelFlow Phase 4 Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add README.md AGENTS.md CHANGELOG.md documentation scripts/sf-audit.ts .github/phase4-handoff-truth.py .github/workflows/phase4-handoff-truth.yml
          git diff --cached --check
          git commit -m "docs: establish Phase 4 execution frontier"
          git push origin HEAD:agent/phase4-handoff-truth
