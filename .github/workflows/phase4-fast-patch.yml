name: Phase 4 exact-head repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/phase4-protected-data-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Phase 4 loopback-session repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          harness_path = Path('scripts/verify-phase4-replacement-install.ps1')
          harness = harness_path.read_text(encoding='utf-8')

          needle = '        body = $decoded\n'
          if harness.count(needle) != 1:
              raise SystemExit('response-body anchor drifted')
          harness = harness.replace(
              needle,
              needle + '        setCookies = @($response.Headers["Set-Cookie"])\n',
              1,
          )

          marker = 'function Read-CdpMessage {'
          if harness.count(marker) != 1:
              raise SystemExit('CDP helper anchor drifted')
          helper = r'''function Import-SellerSessionCookieFromResponse {
              param(
                  [Parameter(Mandatory = $true)][string]$BaseUrl,
                  [Parameter(Mandatory = $true)][Microsoft.PowerShell.Commands.WebRequestSession]$Session,
                  [Parameter(Mandatory = $true)]$Response
              )
              # The installed app correctly marks the seller session Secure in
              # production. This evidence client speaks only to the app's HTTP
              # loopback listener, and System.Net therefore will not resend that
              # Secure cookie. Reuse the exact server-minted value only inside
              # this ephemeral runner by copying it into a host-only non-Secure
              # loopback cookie. Production cookie policy is never changed.
              $header = @($Response.setCookies) -join ","
              $match = [regex]::Match(
                  $header,
                  "(?:^|,\s*)sf_session=([^;,\s]+)"
              )
              if (-not $match.Success) {
                  throw "Seller session response did not contain the expected auth cookie."
              }
              $cookie = [System.Net.Cookie]::new(
                  "sf_session",
                  $match.Groups[1].Value,
                  "/"
              )
              $cookie.HttpOnly = $true
              $cookie.Secure = $false
              $Session.Cookies.Add([Uri]$BaseUrl, $cookie)
              $cookie = $null
              $match = $null
              $header = $null
          }

          '''
          harness = harness.replace(marker, helper + marker, 1)

          needle = '    if ($setup.status -eq 200) { return }'
          if harness.count(needle) != 1:
              raise SystemExit('setup success anchor drifted')
          harness = harness.replace(
              needle,
              '    if ($setup.status -eq 200) {\n        Import-SellerSessionCookieFromResponse -BaseUrl $BaseUrl -Session $Session -Response $setup\n        return\n    }',
              1,
          )

          needle = '        throw "Owner login failed with HTTP $($login.status)."\n    }\n'
          if harness.count(needle) != 1:
              raise SystemExit('login success anchor drifted')
          harness = harness.replace(
              needle,
              needle + '    Import-SellerSessionCookieFromResponse -BaseUrl $BaseUrl -Session $Session -Response $login\n',
              1,
          )

          needle = 'if ($search.status -ne 200) { throw "Source customer search failed." }'
          if harness.count(needle) != 1:
              raise SystemExit('source search anchor drifted')
          harness = harness.replace(
              needle,
              'if ($search.status -ne 200) {\n    $safeCode = if ($null -ne $search.body -and $null -ne $search.body.code) {\n        [string]$search.body.code\n    } else {\n        "none"\n    }\n    throw "Source customer search failed with HTTP $($search.status) and code $safeCode."\n}',
              1,
          )
          harness_path.write_text(harness, encoding='utf-8', newline='\n')

          test_path = Path('src/lib/__tests__/phase4-replacement-installed-contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          needle = '    expect(harness).toContain("Import-RuntimeCookieFromWebView");\n'
          if test.count(needle) != 1:
              raise SystemExit('installed contract anchor drifted')
          test = test.replace(
              needle,
              needle +
              '    expect(harness).toContain("Import-SellerSessionCookieFromResponse");\n' +
              "    expect(harness).toContain('\\\"sf_session\\\"');\n" +
              '    expect(harness).toContain("$cookie.Secure = $false");\n',
              1,
          )
          test_path.write_text(test, encoding='utf-8', newline='\n')

          Path('.github/workflows/phase4-fast-patch.yml').unlink()
          PY

          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sahelflow-phase4-closer'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/verify-phase4-replacement-install.ps1 \
                  src/lib/__tests__/phase4-replacement-installed-contract.test.ts \
                  .github/workflows/phase4-fast-patch.yml
          git commit -m 'fix(phase4): preserve seller session in installed loopback evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
