name: Sync internal.4 Next security lock

on:
  pull_request:
    paths:
      - .github/workflows/sync-internal4-next-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix-internal4-next-security'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Synchronize patched Next.js lockfile
        run: bun update next@16.2.11 eslint-config-next@16.2.10 --exact

      - name: Verify exact patched dependency authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.dependencies.next !== '16.2.11') throw new Error('Next.js is not pinned to 16.2.11');
          if (pkg.devDependencies['eslint-config-next'] !== '16.2.10') throw new Error('eslint-config-next is not pinned to 16.2.10');
          NODE
          bun audit --production

      - name: Persist synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sahelflow-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git commit -m 'fix(security): synchronize patched Next.js lockfile'
          git push origin HEAD:fix-internal4-next-security
