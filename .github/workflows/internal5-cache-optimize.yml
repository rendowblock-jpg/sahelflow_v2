name: Apply internal.5 runtime-cache optimization

on:
  pull_request:
    paths:
      - .github/workflows/internal5-cache-optimize.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri native test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sahelflow-whatsapp-x86_64-unknown-linux-gnu

      - name: Apply fail-closed cache optimization
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/packaged_runtime.rs")
          text = path.read_text(encoding="utf-8")

          old = '''    let (manifest, manifest_bytes) = load_manifest(source_root, expected_app_version)?;
              verify_tree(source_root, &manifest, &manifest_bytes, true)?;

              let cache_root = local_data_root.join("runtime-cache");'''
          new = '''    let (manifest, manifest_bytes) = load_manifest(source_root, expected_app_version)?;

              let cache_root = local_data_root.join("runtime-cache");'''
          if text.count(old) != 1:
              raise SystemExit("expected one packaged-source eager verification block")
          text = text.replace(old, new)

          marker = '''        return server_path(&final_root);
              }

              let nonce = SystemTime::now()'''
          replacement = '''        return server_path(&final_root);
              }

              // The packaged source is used only when a cache must be created.
              // Reused caches remain fully hashed on every launch, but the unused
              // Program Files copy is not redundantly hashed as well.
              verify_tree(source_root, &manifest, &manifest_bytes, true)?;

              let nonce = SystemTime::now()'''
          if text.count(marker) != 1:
              raise SystemExit("expected one cache-reuse boundary")
          text = text.replace(marker, replacement)

          old_copy = '''        } else if metadata.is_file() {
                      fs::copy(&source_path, &destination_path)?;
                      OpenOptions::new()
                          .write(true)
                          .open(&destination_path)?
                          .sync_all()?;
                  } else {'''
          new_copy = '''        } else if metadata.is_file() {
                      // A complete SHA-256 tree verification follows the copy before
                      // atomic promotion. Per-file FlushFileBuffers made low-end
                      // Windows first launch take minutes without adding integrity.
                      fs::copy(&source_path, &destination_path)?;
                  } else {'''
          if text.count(old_copy) != 1:
              raise SystemExit("expected one per-file sync block")
          text = text.replace(old_copy, new_copy)

          old_tail = '''    verify_tree(&final_root, &manifest, &manifest_bytes, false)?;
              server_path(&final_root)
          }'''
          new_tail = '''    // The verified staging directory was atomically renamed; no file
              // contents changed across that operation. Avoid a third full-tree hash.
              server_path(&final_root)
          }'''
          if text.count(old_tail) != 1:
              raise SystemExit("expected one redundant post-rename verification")
          text = text.replace(old_tail, new_tail)

          path.write_text(text, encoding="utf-8")

      - name: Format and test runtime cache authority
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml packaged_runtime::tests
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Commit optimized cache path
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add src-tauri/src/packaged_runtime.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(runtime): remove redundant cache flush and hash passes'
          git push origin "HEAD:${HEAD_BRANCH}"
