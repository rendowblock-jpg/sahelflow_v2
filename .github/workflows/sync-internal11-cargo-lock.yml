name: One-shot Internal.11 Cargo lock synchronization

on:
  push:
    branches:
      - agent/internal-11-founder-experience
    paths:
      - .github/workflows/sync-internal11-cargo-lock.yml

permissions:
  contents: write

concurrency:
  group: sync-internal11-cargo-lock
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'rendowblock-jpg/sahelflow_v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/internal-11-founder-experience
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize and verify generated root package version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/Cargo.lock')
          source = path.read_text(encoding='utf-8')
          old = 'name = "sahelflow"\nversion = "1.0.0-internal.10"'
          new = 'name = "sahelflow"\nversion = "1.0.0-internal.11"'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one Internal.10 SahelFlow root package block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          actual_blob="$(git hash-object src-tauri/Cargo.lock)"
          expected_blob='cf02f95a5a13ad8610b42f1f71a0438368d8eb26'
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "Cargo.lock blob mismatch: expected $expected_blob, found $actual_blob" >&2
            exit 1
          fi

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/sync-internal11-cargo-lock.yml
          git config user.name 'SahelFlow Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/Cargo.lock .github/workflows/sync-internal11-cargo-lock.yml
          git diff --cached --check
          git commit -m 'Synchronize Internal.11 Cargo lock'
          git push origin HEAD:agent/internal-11-founder-experience
