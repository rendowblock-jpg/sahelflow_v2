name: Integrate deterministic descendant helper

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/deterministic-rust-descendant-helper' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-rust-descendant-helper
          fetch-depth: 0

      - name: Setup Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply reviewed Rust repair
        run: python .github/patches/integrate_deterministic_descendant_helper.py

      - name: Canonical Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit integrated Rust repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/child_containment.rs
          git diff --cached --check
          git commit -m "test(runtime): make Windows descendant containment deterministic"
          git push origin HEAD:agent/deterministic-rust-descendant-helper
