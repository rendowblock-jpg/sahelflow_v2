name: Probe Windows libsodium preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/prepare-libsodium-windows.ps1
      - .github/workflows/_probe-libsodium-preparation.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Create Windows sidecar placeholder for Tauri compile probing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri/binaries -Force | Out-Null
          New-Item -ItemType File -Path src-tauri/binaries/sahelflow-whatsapp-x86_64-pc-windows-msvc.exe -Force | Out-Null

      - name: Prove libsodium crate builds without network fallback
        shell: pwsh
        run: |
          & cargo check --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 |
            Tee-Object -FilePath libsodium-build-probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload discovery provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsodium-preparation-${{ github.run_id }}
          path: |
            .sf-build/libsodium-dist/sahelflow-libsodium-build-manifest.json
            libsodium-build-probe.log
          if-no-files-found: error
          retention-days: 2
