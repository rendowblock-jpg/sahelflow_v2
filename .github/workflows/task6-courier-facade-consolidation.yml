name: Task 6 courier facade consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  consolidate:
    name: Verify and publish courier facade consolidation
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-courier-facade
      SF_DATA_DIR: /tmp/sahelflow-courier-facade/data
      DATABASE_URL: file:/tmp/sahelflow-courier-facade/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed courier consolidation
        run: python .github/task6-courier-facade-consolidation.py

      - name: Format touched source
        run: >-
          bunx prettier --write
          src/lib/delivery/canonical-courier.ts
          src/lib/delivery/canonical-courier-booking-authority.ts
          src/lib/delivery/canonical-courier-effect-runtime.ts
          src/lib/integrations/delivery/__tests__/provider-authority-source-contract.test.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-courier-facade

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit source-only courier consolidation
        run: |
          git config user.name "SahelFlow Task 6 Courier"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- src documentation .github/phase-checkpoints
          git diff --cached --check
          git commit -m "refactor(task6): expose one canonical courier facade"
          git push origin HEAD:agent/phase3-durable-effects-audit

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-courier-facade-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
