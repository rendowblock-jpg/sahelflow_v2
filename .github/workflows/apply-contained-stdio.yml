name: Apply Contained Child Stdio Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/contained-child-stdio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/contained-child-stdio
          fetch-depth: 1

      - name: Apply source repair
        run: python .github/contained-stdio/apply.py

      - name: Commit source repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/child_containment.rs; then
            echo 'contained child stdio repair already present'
            exit 0
          fi
          git diff --check
          grep -q 'contained_bun_runs_with_explicit_stdio_handles' src-tauri/src/child_containment.rs
          grep -q 'PROC_THREAD_ATTRIBUTE_HANDLE_LIST' src-tauri/src/child_containment.rs
          grep -q 'AssignProcessToJobObject' src-tauri/src/child_containment.rs
          git config user.name 'SahelFlow Runtime Integration'
          git config user.email 'runtime-integration@users.noreply.github.com'
          git add src-tauri/src/child_containment.rs
          git commit -m 'fix(runtime): provide contained Bun standard handles'
          git push origin HEAD:agent/contained-child-stdio
