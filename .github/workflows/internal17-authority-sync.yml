name: Internal.17 authority synchronization

on:
  push:
    branches:
      - agent/internal-17-founder-offline-checkpoint

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/internal-17-founder-offline-checkpoint
          fetch-depth: 0

      - name: Synchronize exact Internal.17 Founder authority
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(f"{path}: expected {count} exact occurrence(s), found {observed}: {old!r}")
              p.write_text(text.replace(old, new))

          def replace_text(text, old, new, label, count=1):
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(f"{label}: expected {count} exact occurrence(s), found {observed}: {old!r}")
              return text.replace(old, new)

          replace(
              "src-tauri/Cargo.lock",
              'name = "sahelflow"\nversion = "1.0.0-internal.16"\ndependencies = [',
              'name = "sahelflow"\nversion = "1.0.0-internal.17"\ndependencies = [',
          )

          replace(
              "scripts/sf-version.ts",
              '''    (authority.version === "1.0.0-internal.16" &&\n      authority.licensing?.authorityDecision === "FD-034"));''',
              '''    (authority.version === "1.0.0-internal.16" &&\n      authority.licensing?.authorityDecision === "FD-034") ||\n    (authority.version === "1.0.0-internal.17" &&\n      authority.licensing?.authorityDecision === "FD-036"));''',
          )
          replace(
              "scripts/sf-version.ts",
              "founder-offline-only licensing is authorized only for Internal.15/FD-032 or Internal.16/FD-034 on the internal channel with no owned host suffix",
              "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, or Internal.17/FD-036 on the internal channel with no owned host suffix",
          )

          replace(
              "src-tauri/build.rs",
              '''                    (Some("1.0.0-internal.15"), Some("FD-032"))\n                        | (Some("1.0.0-internal.16"), Some("FD-034"))''',
              '''                    (Some("1.0.0-internal.15"), Some("FD-032"))\n                        | (Some("1.0.0-internal.16"), Some("FD-034"))\n                        | (Some("1.0.0-internal.17"), Some("FD-036"))''',
          )
          replace(
              "src-tauri/build.rs",
              "founder-offline-only licensing is authorized only for exact FD-032/Internal.15 or FD-034/Internal.16 on the internal channel with no owned host suffix",
              "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17 on the internal channel with no owned host suffix",
          )

          release_path = Path(".github/workflows/release.yml")
          release = release_path.read_text()
          release = replace_text(
              release,
              '''                ($authority.version -ceq '1.0.0-internal.16' -and\n                  $authority.licensing.authorityDecision -ceq 'FD-034')''',
              '''                ($authority.version -ceq '1.0.0-internal.16' -and\n                  $authority.licensing.authorityDecision -ceq 'FD-034') -or\n                ($authority.version -ceq '1.0.0-internal.17' -and\n                  $authority.licensing.authorityDecision -ceq 'FD-036')''',
              "release workflow authority",
          )
          release = replace_text(
              release,
              "founder-offline-only release authority is valid only for exact FD-032/Internal.15 or FD-034/Internal.16",
              "founder-offline-only release authority is valid only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17",
              "release workflow error contract",
          )
          Path("internal17-release-workflow.generated.yml").write_text(release)

          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              '''expect(versionAuthority).toContain('"version": "1.0.0-internal.16"');''',
              '''expect(versionAuthority).toContain('"version": "1.0.0-internal.17"');''',
          )
          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              '''expect(versionAuthority).toContain('"authorityDecision": "FD-034"');''',
              '''expect(versionAuthority).toContain('"authorityDecision": "FD-036"');''',
          )
          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              "founder-offline-only licensing is authorized only for Internal.15/FD-032 or Internal.16/FD-034",
              "founder-offline-only licensing is authorized only for Internal.15/FD-032, Internal.16/FD-034, or Internal.17/FD-036",
          )
          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              '''    expect(build).toContain('Some("1.0.0-internal.16"), Some("FD-034")');''',
              '''    expect(build).toContain('Some("1.0.0-internal.16"), Some("FD-034")');\n    expect(build).toContain('Some("1.0.0-internal.17"), Some("FD-036")');''',
          )
          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              "founder-offline-only licensing is authorized only for exact FD-032/Internal.15 or FD-034/Internal.16",
              "founder-offline-only licensing is authorized only for exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17",
          )
          replace(
              "src/lib/license/__tests__/license-production-boundary.test.ts",
              "exact FD-032/Internal.15 or FD-034/Internal.16",
              "exact FD-032/Internal.15, FD-034/Internal.16, or FD-036/Internal.17",
          )

          replace("scripts/verify-current-frontier.ts", '"version": "1.0.0-internal.16"', '"version": "1.0.0-internal.17"')
          replace("scripts/verify-current-frontier.ts", '"windowsMsiVersion": "1.0.0.16"', '"windowsMsiVersion": "1.0.0.17"')
          replace("scripts/verify-current-frontier.ts", '"authorityDecision": "FD-034"', '"authorityDecision": "FD-036"')
          replace("scripts/verify-current-frontier.ts", 'authority.version === "1.0.0-internal.16"', 'authority.version === "1.0.0-internal.17"')
          replace("scripts/verify-current-frontier.ts", 'authority.licensing?.authorityDecision === "FD-034"', 'authority.licensing?.authorityDecision === "FD-036"')
          replace(
              "scripts/verify-current-frontier.ts",
              '"Internal.15/FD-032 or Internal.16/FD-034",',
              '"Internal.15/FD-032, Internal.16/FD-034, or Internal.17/FD-036",',
          )
          replace(
              "scripts/verify-current-frontier.ts",
              '''  "## FD-034 — Internal.16 Founder-only offline checkpoint",\n  "1.0.0-internal.16",\n  "1.0.0.16",''',
              '''  "## FD-034 — Internal.16 Founder-only offline checkpoint",\n  "## FD-036 — Internal.17 Founder-only offline correction checkpoint",\n  "1.0.0-internal.16",\n  "1.0.0.16",\n  "1.0.0-internal.17",\n  "1.0.0.17",\n  "c33f234ecf43842cfcc801592cc601d595ed05c5",''',
          )
          replace(
              "scripts/verify-current-frontier.ts",
              '''  "agent/internal-16-founder-offline-checkpoint",\n  "FD-034",\n  "1.0.0-internal.16",''',
              '''  "agent/internal-16-founder-offline-checkpoint",\n  "agent/internal-17-founder-offline-checkpoint",\n  "FD-034",\n  "FD-036",\n  "1.0.0-internal.16",\n  "1.0.0-internal.17",\n  "c33f234ecf43842cfcc801592cc601d595ed05c5",''',
          )
          replace(
              "scripts/verify-current-frontier.ts",
              '"Current execution frontier verified: PR #251 / Wave 4 is protected on main, the exact installed evidence matrix is green, Internal.16 is the FD-034 Founder-only checkpoint candidate, Internal.15 remains the published updater until signed promotion, and #221/#226/#230 remain distinct evidence obligations.",',
              '"Current execution frontier verified: the Internal.17 correction is protected on main at c33f234ecf43842cfcc801592cc601d595ed05c5, FD-036 synchronizes the exact Founder-only Internal.17 offline checkpoint, and signed promotion plus Founder visual acceptance remain pending.",',
          )

          replace(
              "documentation/README.md",
              '> **Status:** Active documentation entry point and temporary FD-034 / FD-035 addendum authority',
              '> **Status:** Active documentation entry point and temporary FD-034 / FD-035 / FD-036 addendum authority',
          )
          replace(
              "documentation/README.md",
              '> **Protected `main`:** `c8200fdd0fe212cc7493de434d19bd8e7395c4ea` — PR #252 / Internal.16 signed version authority',
              '> **Protected `main`:** `c33f234ecf43842cfcc801592cc601d595ed05c5` — PR #254 / exact green Internal.17 frontend-system correction',
          )
          replace(
              "documentation/README.md",
              '> **Latest application-changing protected merge:** PR #251 — Internal.16 Wave 4 Storefront Builder V2 + connected platform',
              '> **Latest application-changing protected merge:** PR #254 — Internal.17 frontend-system correction',
          )
          replace(
              "documentation/README.md",
              '> **Active correction frontier:** Internal.17 frontend-system correction before renewed installed acceptance',
              '> **Active release frontier:** `agent/internal-17-founder-offline-checkpoint` — exact Internal.17 / FD-036 Founder-offline promotion after green correction evidence',
          )
          replace(
              "documentation/README.md",
              'Live protected GitHub state is always authority. Internal.16 is a real signed Founder/internal-lab release, but its successful source/CI/release evidence does **not** mean the installed frontend achieved Founder acceptance or user-ready AAA quality.',
              'Live protected GitHub state is always authority. Internal.16 remains the latest published updater; the fully green Internal.17 correction tree is now protected on `main` and is being promoted under exact FD-036 Founder/internal-lab offline authority. Machine-installed evidence does **not** substitute for the Founder visual acceptance still required on the signed Internal.17 candidate.',
          )
          replace(
              "documentation/README.md",
              'Internal.16 Waves 1–4 are protected on `main`. PR #251 was squash-merged at `aa7dd2df53286a670fc55e319a281757cf3d28b2`; PR #252 then promoted exact protected source `c8200fdd0fe212cc7493de434d19bd8e7395c4ea` to signed Internal.16 under FD-034. Signed workflow `31770292329` completed successfully and published the exact Internal.16 updater.',
              'Internal.16 Waves 1–4 remain protected history. PR #251 was squash-merged at `aa7dd2df53286a670fc55e319a281757cf3d28b2`; PR #252 promoted `c8200fdd0fe212cc7493de434d19bd8e7395c4ea` to signed Internal.16 under FD-034. PR #254 then carried the complete Internal.17 frontend-system correction, passed its exact source/browser/native/Windows/MSI-installed `Required PR gate` on head `c965a062cf2719078601374bd0ace771ca011d53`, and was squash-merged to protected `main` at `c33f234ecf43842cfcc801592cc601d595ed05c5` with the identical reviewed tree.',
          )
          marker = '## Coherent signed-candidate rule\n'
          addition = '''## FD-036 — Internal.17 Founder-only offline correction checkpoint\n\n> **Status:** Founder-authorized release promotion in progress\n> **Approved:** 2026-08-14\n> **Exact scope:** `1.0.0-internal.17` / MSI `1.0.0.17` only\n> **Reviewed correction source:** `c33f234ecf43842cfcc801592cc601d595ed05c5` / PR #254\n> **Distribution:** Founder/internal-lab only\n\nFD-036 authorizes one exact signed Internal.17 Founder checkpoint after the fully green correction evidence. Its licensing mode remains `founder-offline-only`: the permanent Founder entitlement remains the authority, `ownedHostSuffix` remains null, the signed build must not package `SF_LICENSE_SERVICE_URL`, and online trial initialization remains disabled for this checkpoint.\n\nFD-036 does **not** authorize customer-online distribution, Beta, Stable, or any later version. Those paths continue to fail closed until their separate owned-host/network/release authorities exist. The six Founder-rejected visual/interaction classes still require explicit Founder accept/reject on the signed Internal.17 installation; automated WebView/MSI evidence is necessary but not a substitute for that visual acceptance.\n\n'''
          p = Path("documentation/README.md")
          text = p.read_text()
          if marker not in text or "## FD-036 — Internal.17 Founder-only offline correction checkpoint" in text:
              raise SystemExit("documentation/README.md: FD-036 insertion marker missing or duplicate")
          p.write_text(text.replace(marker, addition + marker, 1))

          replace(
              "documentation/operations/WORKING_MEMORY.md",
              '> **Protected `main`:** `c8200fdd0fe212cc7493de434d19bd8e7395c4ea` — PR #252 / signed Internal.16 authority',
              '> **Protected `main`:** `c33f234ecf43842cfcc801592cc601d595ed05c5` — PR #254 / exact green Internal.17 correction tree',
          )
          replace(
              "documentation/operations/WORKING_MEMORY.md",
              '> **Latest application-changing protected merge:** PR #251 — Internal.16 Wave 4 Storefront Builder V2 + connected platform',
              '> **Latest application-changing protected merge:** PR #254 — Internal.17 frontend-system correction',
          )
          replace(
              "documentation/operations/WORKING_MEMORY.md",
              '> **Active correction frontier:** Internal.17 source-level frontend-system correction under temporary FD-035',
              '> **Active release frontier:** `agent/internal-17-founder-offline-checkpoint` — FD-036 exact Founder-offline Internal.17 promotion',
          )
          replace(
              "documentation/operations/WORKING_MEMORY.md",
              'Live GitHub is authority. Internal.16 publication is complete. Do **not** restart release-authority work from PR #252 and do **not** treat green CI as Founder visual/UX acceptance.',
              'Live GitHub is authority. Internal.16 remains the latest published updater; the Internal.17 correction is protected and fully green through the exact MSI-installed `Required PR gate`. The current task is the bounded FD-036 release-authority promotion. Do **not** reopen the completed correction broadly, and do **not** treat automated installed evidence as Founder visual/UX acceptance.',
          )
          p = Path("documentation/operations/WORKING_MEMORY.md")
          text = p.read_text()
          start = text.index("## Exact next-session order\n")
          end = text.index("## Acceptance rules for the six reconfirmed blockers\n")
          replacement = '''## Exact next-session order\n\n1. **Keep protected correction truth frozen.** PR #254 exact head `c965a062cf2719078601374bd0ace771ca011d53` passed Phase 5, Phase 6–7, native/source quality, Windows runtime, exact MSI build, install/reopen, authenticated hydrated UI twice and replacement-install backup/restore/identity/rollback; its identical reviewed tree is protected on `main` at `c33f234ecf43842cfcc801592cc601d595ed05c5`.\n2. **Complete FD-036 release authority on one branch.** Synchronize `1.0.0-internal.17` / MSI `1.0.0.17` across version authority, package/Cargo/Tauri identities, exact Founder-offline guards, signed workflow contracts, tests and live docs. Preserve Internal.15/FD-032 and Internal.16/FD-034 as historical exact checkpoints; do not broaden the exception.\n3. **Open one release-authority PR only after the branch is internally coherent.** Run the normal risk-aware `Required PR gate` and every selected source/native/Windows/MSI-installed consequence on that exact head. No waiver or force merge.\n4. **Merge only an exact green reviewed head to protected `main`.** The version-authority push may then auto-dispatch the existing signed Internal updater workflow for that exact protected-main SHA.\n5. **Require the signed workflow to finish cleanly.** Verify exact PR-tree/main-tree identity, signed MSI/updater artifacts, install/runtime/authenticated UI evidence, hashes/manifest and release publication. No manually substituted artifact.\n6. **Founder installs the exact signed Internal.17 checkpoint.** Re-run explicit visual accept/reject for RTL, themes, motion, charts, Inbox and AI Agents. These six classes are not closed by browser automation or machine-installed harness evidence.\n7. **Keep customer/user-ready boundaries separate.** #226 and #230 remain their own representative performance/network obligations; FD-036 is Founder/internal-lab only and grants no Beta/Stable/customer-online authority.\n\n'''
          p.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Verify deterministic synchronization
        shell: bash
        run: |
          grep -F 'version = "1.0.0-internal.17"' src-tauri/Cargo.lock
          grep -F 'Internal.17/FD-036' scripts/sf-version.ts
          grep -F 'Some("1.0.0-internal.17"), Some("FD-036")' src-tauri/build.rs
          grep -F "FD-036/Internal.17" internal17-release-workflow.generated.yml
          grep -F 'FD-036' src/lib/license/__tests__/license-production-boundary.test.ts
          grep -F 'FD-036' documentation/README.md
          grep -F 'FD-036' documentation/operations/WORKING_MEMORY.md

      - name: Commit staged authority files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock scripts/sf-version.ts src-tauri/build.rs src/lib/license/__tests__/license-production-boundary.test.ts scripts/verify-current-frontier.ts documentation/README.md documentation/operations/WORKING_MEMORY.md internal17-release-workflow.generated.yml
          git diff --cached --check
          git commit -m 'release: synchronize Internal.17 Founder authority'
          git push origin HEAD:agent/internal-17-founder-offline-checkpoint
