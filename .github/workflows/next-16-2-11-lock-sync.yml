name: Synchronize patched Next.js lockfile

on:
  pull_request:
    paths:
      - .github/workflows/next-16-2-11-lock-sync.yml
      - package.json
      - bun.lock

permissions:
  contents: write

concurrency:
  group: next-16-2-11-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/next-16-2-11-security'
    name: Lock and audit Next.js 16.2.11 on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact security branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate deterministic lockfile
        shell: pwsh
        run: |
          bun install --lockfile-only
          if ($LASTEXITCODE -ne 0) { throw 'failed to regenerate bun.lock' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'generated lockfile has whitespace errors' }

      - name: Install exact locked dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile --linker=hoisted
          if ($LASTEXITCODE -ne 0) { throw 'frozen install failed after lockfile regeneration' }

      - name: Verify patched framework identities
        shell: pwsh
        run: |
          $nextVersion = (& bun -e "console.log(require('./node_modules/next/package.json').version)").Trim()
          $eslintNextVersion = (& bun -e "console.log(require('./node_modules/eslint-config-next/package.json').version)").Trim()
          if ($nextVersion -cne '16.2.11') {
            throw "expected next 16.2.11, found $nextVersion"
          }
          if ($eslintNextVersion -cne '16.2.11') {
            throw "expected eslint-config-next 16.2.11, found $eslintNextVersion"
          }

      - name: Block on production advisories
        shell: pwsh
        run: |
          & bun audit --production 2>&1 | Tee-Object -FilePath next-16-2-11-audit.log
          if ($LASTEXITCODE -ne 0) { throw 'production dependency audit still reports vulnerabilities' }

      - name: Persist audited lockfile
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bun.lock
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged bun.lock has whitespace errors' }
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -cne 'bun.lock') {
            throw "expected only bun.lock to be staged, found: $($staged -join ', ')"
          }
          git commit -m 'fix(security): lock Next.js 16.2.11'
          if ($LASTEXITCODE -ne 0) { throw 'failed to commit audited bun.lock' }
          git push origin "HEAD:$env:HEAD_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'failed to push audited bun.lock' }

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-16-2-11-windows-audit-${{ github.run_id }}
          path: next-16-2-11-audit.log
          if-no-files-found: warn
          retention-days: 7
