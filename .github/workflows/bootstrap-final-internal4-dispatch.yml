name: Bootstrap final internal.4 signed dispatch

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-final-internal4-dispatch.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: bootstrap-final-internal4-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/bootstrap-final-internal4-dispatch'
    name: Diagnose and dispatch canonical exact-source workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 98a9a8bab77ebdcab9ffc9854a5b63dfe62ceabf
    steps:
      - name: Show exact run inventory and dispatch result
        shell: bash
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          list_file="${RUNNER_TEMP}/runs.json"
          list_code="$(curl --silent --show-error --location \
            --output "${list_file}" --write-out '%{http_code}' \
            "${headers[@]}" \
            "${api}/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          echo "LIST_HTTP=${list_code}"
          jq -c --arg source "${SOURCE_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $source) | {id,status,conclusion,head_sha,html_url,created_at}]' \
            "${list_file}"

          existing_count="$(jq --arg source "${SOURCE_SHA}" '[.workflow_runs[] | select(.head_sha == $source)] | length' "${list_file}")"
          if [[ "${list_code}" == '200' && "${existing_count}" == '0' ]]; then
            notes='SahelFlow 1.0.0-internal.4 final protected-main candidate with signed artifact, latest.json, installed launch, normal close, teardown, reopen, cache reuse, and data-preservation verification.'
            payload="$(jq -n --arg source "${SOURCE_SHA}" --arg notes "${notes}" \
              '{ref:"main",inputs:{source_ref:$source,release_notes:$notes}}')"
            response="${RUNNER_TEMP}/dispatch.json"
            code="$(curl --silent --show-error --location \
              --output "${response}" --write-out '%{http_code}' \
              --request POST "${headers[@]}" \
              -H 'Content-Type: application/json' \
              --data "${payload}" \
              "${api}/actions/workflows/release.yml/dispatches")"
            echo "DISPATCH_HTTP=${code}"
            if [[ -s "${response}" ]]; then cat "${response}"; fi
            sleep 5
          else
            echo 'DISPATCH_SKIPPED=exact-source-run-already-exists-or-list-failed'
          fi

          verify_file="${RUNNER_TEMP}/runs-after.json"
          verify_code="$(curl --silent --show-error --location \
            --output "${verify_file}" --write-out '%{http_code}' \
            "${headers[@]}" \
            "${api}/actions/workflows/release.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          echo "VERIFY_HTTP=${verify_code}"
          jq -c --arg source "${SOURCE_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $source) | {id,status,conclusion,head_sha,html_url,created_at}]' \
            "${verify_file}"

          exit 0
