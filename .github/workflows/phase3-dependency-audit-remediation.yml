name: Phase 3 dependency audit remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase3-dependency-audit-remediation
  cancel-in-progress: true

jobs:
  remediate:
    name: Update audited dependency resolutions
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase3-dependency-audit
      SF_DATA_DIR: /tmp/sahelflow-phase3-dependency-audit/data
      DATABASE_URL: file:/tmp/sahelflow-phase3-dependency-audit/data/shops/test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply compatible security resolutions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("package.json")
          package = json.loads(root.read_text(encoding="utf-8"))
          package["overrides"]["postcss"] = "8.5.23"
          package["overrides"]["brace-expansion"] = "5.0.9"
          package["patchedDependencies"] = {
              "brace-expansion@5.0.9": "patches/brace-expansion@5.0.9.patch"
          }
          root.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          sidecar_path = Path("sidecars/whatsapp/package.json")
          sidecar = json.loads(sidecar_path.read_text(encoding="utf-8"))
          sidecar["dependencies"]["hono"] = "^4.12.34"
          sidecar_path.write_text(
              json.dumps(sidecar, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          mv patches/brace-expansion@5.0.8.patch patches/brace-expansion@5.0.9.patch

      - name: Refresh frozen lock resolution
        run: bun install

      - name: Verify production dependency audit
        run: bun audit --production

      - name: Verify sidecar build
        run: bun run build:sidecar

      - name: Prepare focused test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase3-dependency-audit

      - name: Verify focused source tests
        run: >-
          bunx vitest run
          src/lib/i18n/__tests__/runtime-translations.test.ts
          src/lib/automations/__tests__/conditions.test.ts
          src/lib/integrations/delivery/__tests__/provider-conformance.test.ts

      - name: Publish audited dependency resolution
        run: |
          rm .github/workflows/phase3-dependency-audit-remediation.yml
          git config user.name "SahelFlow Phase 3 Closure"
          git config user.email "actions@users.noreply.github.com"
          git add package.json sidecars/whatsapp/package.json bun.lock patches .github/workflows/phase3-dependency-audit-remediation.yml
          git diff --cached --check
          git commit -m "fix(deps): clear Phase 3 production audit"
          git push origin HEAD:agent/phase3-durable-effects-audit
