name: Dependency lock probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate canonical patched lockfile
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit generated lock and remove probe
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dependency-lock-probe.yml
          git add package.json bun.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Security: resolve deepmerge-ts production advisory' -m 'Pin the patched deepmerge-ts 8.0.0 through Bun overrides, commit the Bun 1.3.14 generated lockfile, and remove the temporary lock probe. No application, database, native, or release authority changes.'
          git push origin HEAD:${{ github.head_ref }}
