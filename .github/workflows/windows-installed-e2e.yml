name: Windows installed MSI end-to-end

on:
  pull_request:
    paths:
      - ".github/workflows/windows-installed-e2e.yml"
      - "scripts/verify-installed-windows-msi.ps1"
      - "scripts/prepare-runtime.ts"
      - "scripts/prepare-libsodium-windows.ps1"
      - "src-tauri/**"
      - "src/app/api/internal/runtime-ready/**"
      - "src/lib/db.ts"
      - "prisma/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installed-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-msi:
    name: Build, install, launch, close, and reopen MSI
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"

    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply exact debug-build lint fix under test
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          source = path.read_text(encoding="utf-8")
          old = '''        .run(|app_handle, event| {
              #[cfg(not(debug_assertions))]
              {
                  use tauri::Manager;
                  let main_window_close = matches!(
                      &event,
                      tauri::RunEvent::WindowEvent {
                          label,
                          event: tauri::WindowEvent::CloseRequested { .. },
                          ..
                      } if label == "main"
                  );
                  let shutdown = main_window_close
                      || matches!(
                          event,
                          tauri::RunEvent::ExitRequested { .. } | tauri::RunEvent::Exit
                      );
                  if shutdown {
                      if let Some(state) = app_handle.try_state::<std::sync::Mutex<SpawnedChildren>>()
                      {
                          if let Ok(mut children) = state.lock() {
                              children.kill_all();
                          }
                      }
                      if let Ok(app_data_dir) = app_handle.path().app_data_dir() {
                          runtime_protocol::remove_manifest(&app_data_dir);
                      }
                  }
                  if main_window_close {
                      // AppHandle::exit requests another event-loop transition. A
                      // native close request is already executing on that loop, so
                      // finish Tauri cleanup synchronously and exit immediately.
                      app_handle.cleanup_before_exit();
                      std::process::exit(0);
                  }
              }
          });'''
          new = old.replace("|app_handle, event|", "|_app_handle, _event|")
          new = new.replace("&event,", "&_event,")
          new = new.replace("\n                        event,\n", "\n                        _event,\n")
          new = new.replace("app_handle.try_state", "_app_handle.try_state")
          new = new.replace("app_handle.path()", "_app_handle.path()")
          new = new.replace("app_handle.cleanup_before_exit()", "_app_handle.cleanup_before_exit()")

          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one canonical event callback, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          '@ | python -

          if ($LASTEXITCODE -ne 0) { throw 'failed to apply exact debug-build lint fix' }

      - name: Verify canonical Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'lint-fixed Rust source has whitespace errors' }

      - name: Cache Windows Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-installed-e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-installed-e2e-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Build unsigned MSI for ephemeral installed test
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -LiteralPath .sf-installed-e2e-tauri.json -Encoding UTF8
          & bunx tauri build --bundles msi --config .sf-installed-e2e-tauri.json 2>&1 |
            Tee-Object -FilePath .sf-installed-e2e-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and prove launch/reopen
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          try {
            $msis = @(Get-ChildItem -File 'src-tauri/target/release/bundle/msi/*.msi')
            if ($msis.Count -ne 1) {
              throw "expected exactly one MSI, found $($msis.Count)"
            }
            ./scripts/verify-installed-windows-msi.ps1 -MsiPath $msis[0].FullName
          } catch {
            $_ | Format-List * -Force | Out-String |
              Set-Content -LiteralPath (Join-Path $destination 'lifecycle-error.txt') -Encoding UTF8
            throw
          }

      - name: Persist lifecycle-proven Clippy fix
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.head_ref == 'agent/windows-installed-runtime-e2e'
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/lib.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'lifecycle-proven Clippy fix has whitespace errors' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'installed lifecycle passed but produced no Clippy source fix' }
          git commit -m 'fix(rust): silence debug-only event parameter warnings'
          if ($LASTEXITCODE -ne 0) { throw 'failed to commit lifecycle-proven Clippy fix' }
          git push origin "HEAD:$env:HEAD_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'failed to push lifecycle-proven Clippy fix' }

      - name: Collect installed Windows evidence
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $roaming = Join-Path $env:APPDATA 'com.sahelflow.desktop'
          $evidenceFiles = @(
            'startup-diagnostic.json',
            'runtime-probe-diagnostic.json',
            'runtime-readiness-diagnostic.json',
            'runtime-endpoint.json',
            'shop-registry.json',
            'migration-journal\current.json',
            'migration-journal\compatibility.json'
          )
          foreach ($relative in $evidenceFiles) {
            $source = Join-Path $roaming $relative
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              $safeName = $relative -replace '[\\/:*?"<>|]', '_'
              Copy-Item -LiteralPath $source -Destination (Join-Path $destination $safeName) -Force
            }
          }

          $cacheRoot = Join-Path $env:LOCALAPPDATA 'com.sahelflow.desktop\runtime-cache'
          if (Test-Path -LiteralPath $cacheRoot -PathType Container) {
            $cacheInventory = @(
              Get-ChildItem -LiteralPath $cacheRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $manifestPath = Join-Path $_.FullName 'sahelflow-standalone-manifest.json'
                  [pscustomobject]@{
                    directory = $_.Name
                    createdAt = $_.CreationTimeUtc.ToString('o')
                    lastWriteAt = $_.LastWriteTimeUtc.ToString('o')
                    manifest = if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
                      Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
                    } else {
                      $null
                    }
                    manifestSha256 = if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
                      (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
                    } else {
                      $null
                    }
                  }
                }
            )
            $cacheInventory |
              ConvertTo-Json -Depth 10 |
              Set-Content -LiteralPath (Join-Path $destination 'runtime-cache-inventory.json') -Encoding UTF8
          }

          @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -ieq 'sahelflow.exe' -or
                $_.Name -ieq 'bun.exe' -or
                $_.Name -ieq 'sahelflow-whatsapp.exe' -or
                $_.Name -ieq 'msedgewebview2.exe'
              } |
              Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CommandLine, CreationDate
          ) |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $destination 'processes.json') -Encoding UTF8

          $installed = @(
            Get-ItemProperty -Path @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
            ) -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'SahelFlow' } |
              Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString
          )
          $installed |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $destination 'installed-product.json') -Encoding UTF8

      - name: Upload installed Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sahelflow-installed-e2e/**
            .sf-installed-e2e-build.log
          if-no-files-found: warn
          retention-days: 7
