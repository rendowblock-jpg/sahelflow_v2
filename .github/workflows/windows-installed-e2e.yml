name: Windows installed MSI end-to-end

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installed-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Build exact evidence MSI once
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
      SF_LICENSE_SERVICE_URL: "https://license.invalid"
      SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="}'
      SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'

    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Verify canonical Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust source is not canonically formatted' }

      - name: Verify Founder handoff script under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File '.\scripts\install-founder-windows.ps1' `
            -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Founder handoff script failed Windows PowerShell 5.1 self-test with exit code $LASTEXITCODE"
          }

      - name: Parse installed harnesses under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $parserScript = Join-Path $env:RUNNER_TEMP 'parse-windows-powershell51.ps1'
          @'
          param([Parameter(Mandatory = $true)][string]$Path)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $Path,
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | Format-List * -Force
              exit 1
          }
          '@ | Set-Content -LiteralPath $parserScript -Encoding UTF8

          foreach ($relative in @(
              '.\scripts\install-founder-windows.ps1',
              '.\scripts\verify-installed-windows-ui.ps1',
              '.\scripts\verify-phase4-replacement-install.ps1',
              '.\scripts\verify-phase4-replacement-install-ci.ps1'
          )) {
              $resolved = (Resolve-Path -LiteralPath $relative).Path
              & $windowsPowerShell `
                -NoLogo `
                -NoProfile `
                -NonInteractive `
                -ExecutionPolicy Bypass `
                -File $parserScript `
                -Path $resolved
              if ($LASTEXITCODE -ne 0) {
                throw "$relative failed Windows PowerShell 5.1 parsing."
              }
          }

      - name: Cache Windows Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-installed-e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-installed-e2e-

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare signed local libsodium distribution
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1

      - name: Prepare exact evidence build authority
        shell: pwsh
        run: |
          # This exact CI-only build enables deterministic restore interruption
          # receipts. Ordinary release builds do not define this compile-time
          # marker and cannot activate the evidence boundaries at runtime.
          $env:SF_PHASE4_RESTORE_EVIDENCE_BUILD = '1'

          # Packaged licensing configuration is intentionally compile-time
          # authority. Reserve one loopback issuer port before this evidence MSI
          # is compiled, publish that exact origin to later harness steps, and
          # compile the disposable MSI against it. Production/signed workflows
          # provide their own protected licensing configuration and never inherit
          # this CI-only loopback issuer.
          $trialListener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          $webViewListener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )
          try {
            $trialListener.Start()
            $webViewListener.Start()
            $trialServicePort = ([System.Net.IPEndPoint]$trialListener.LocalEndpoint).Port
            $webViewDebugPort = ([System.Net.IPEndPoint]$webViewListener.LocalEndpoint).Port
          } finally {
            $webViewListener.Stop()
            $trialListener.Stop()
          }
          $env:SF_LICENSE_SERVICE_URL = "http://127.0.0.1:$trialServicePort"
          "SF_LICENSE_SERVICE_URL=$env:SF_LICENSE_SERVICE_URL" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SF_PHASE4_WEBVIEW_DEBUG_PORT=$webViewDebugPort" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SF_PHASE4_RESTORE_EVIDENCE_BUILD=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # The replacement drill must call authenticated APIs through the same
          # per-launch HttpOnly authority as the installed WebView. Give only
          # this disposable evidence MSI a loopback CDP endpoint; release builds
          # continue to use the checked-in Tauri configuration unchanged.
          $evidenceConfig = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw |
            ConvertFrom-Json
          $browserArguments =
            "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection " +
            "--remote-debugging-port=$webViewDebugPort"
          $evidenceConfig.app.windows[0] |
            Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue $browserArguments
          $evidenceConfig.bundle.createUpdaterArtifacts = $false
          $evidenceConfig |
            ConvertTo-Json -Depth 100 |
            Set-Content -LiteralPath .sf-installed-e2e-tauri.json -Encoding UTF8
          [ordered]@{
            formatVersion = 1
            exactSource = '${{ github.event.pull_request.head.sha || github.sha }}'
            licenseServiceUrl = $env:SF_LICENSE_SERVICE_URL
            webViewDebugPort = $webViewDebugPort
          } |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath .sf-installed-e2e-build-authority.json -Encoding UTF8

      - name: Prove focused Windows backup durability and safe error contracts
        shell: pwsh
        run: |
          cargo test `
            --release `
            --manifest-path src-tauri/Cargo.toml `
            --lib `
            backup_recovery::tests::windows_snapshot_verification_and_commit_use_write_capable_handles `
            -- `
            --exact
          if ($LASTEXITCODE -ne 0) { throw 'Focused Windows backup durability contract failed' }
          cargo test `
            --release `
            --manifest-path src-tauri/Cargo.toml `
            --lib `
            survivability_bridge::tests::permission_errors_preserve_the_authorization_storage_boundary `
            -- `
            --exact
          if ($LASTEXITCODE -ne 0) { throw 'Safe survivability error contract failed' }

      - name: Build unsigned MSI for ephemeral installed test
        shell: pwsh
        run: |
          # The Rust cache contains target/ for compile speed, but may also retain
          # MSI bundles from an older candidate. Build evidence must contain only
          # the exact installer produced by this job.
          Remove-Item -LiteralPath 'src-tauri/target/release/bundle/msi' -Recurse -Force -ErrorAction SilentlyContinue
          & bunx tauri build --bundles msi --config .sf-installed-e2e-tauri.json 2>&1 |
            Tee-Object -FilePath .sf-installed-e2e-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish reusable exact evidence MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-e2e-msi-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            .sf-installed-e2e-build-authority.json
            .sf-installed-e2e-build.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  installed-msi:
    name: Install and collect every installed gate
    needs: build-msi
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
      SF_LICENSE_SERVICE_URL: "https://license.invalid"
      SF_LICENSE_TRIAL_PUBLIC_KEYS: '{"ci-trial-key-v1":"ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="}'
      SF_LICENSE_PERMANENT_PUBLIC_KEYS: '{"ci-permanent-key-v1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'

    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Download reusable exact evidence MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-installed-e2e-msi-${{ github.run_id }}
          path: .

      - name: Restore and verify compiled evidence authority
        shell: pwsh
        run: |
          $authority = Get-Content -LiteralPath '.sf-installed-e2e-build-authority.json' -Raw |
            ConvertFrom-Json
          if (
            [int]$authority.formatVersion -ne 1 -or
            [string]$authority.exactSource -cne '${{ github.event.pull_request.head.sha || github.sha }}' -or
            [string]$authority.licenseServiceUrl -cnotmatch '^http://127\.0\.0\.1:[0-9]{1,5}$' -or
            [int]$authority.webViewDebugPort -lt 1 -or
            [int]$authority.webViewDebugPort -gt 65535
          ) {
            throw 'Downloaded evidence MSI authority does not match the exact workflow source.'
          }
          "SF_LICENSE_SERVICE_URL=$($authority.licenseServiceUrl)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SF_PHASE4_WEBVIEW_DEBUG_PORT=$($authority.webViewDebugPort)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and prove runtime launch/reopen
        id: installed_lifecycle
        continue-on-error: true
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          try {
            $msis = @(Get-ChildItem -File 'src-tauri/target/release/bundle/msi/*.msi')
            if ($msis.Count -ne 1) {
              throw "expected exactly one MSI, found $($msis.Count)"
            }
            ./scripts/verify-installed-windows-msi.ps1 -MsiPath $msis[0].FullName
          } catch {
            $_ | Format-List * -Force | Out-String |
              Set-Content -LiteralPath (Join-Path $destination 'lifecycle-error.txt') -Encoding UTF8
            throw
          }

      - name: Prove authenticated hydrated WebView UI twice
        id: installed_ui
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          try {
            ./scripts/verify-installed-windows-ui.ps1
          } catch {
            $_ | Format-List * -Force | Out-String |
              Set-Content -LiteralPath (Join-Path $destination 'ui-lifecycle-error.txt') -Encoding UTF8
            throw
          }

      - name: Prove replacement-install backup, restore, identity, and rollback
        id: replacement_restore
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          try {
            $msis = @(Get-ChildItem -File 'src-tauri/target/release/bundle/msi/*.msi')
            if ($msis.Count -ne 1) {
              throw "expected exactly one MSI, found $($msis.Count)"
            }

            # The lifecycle gate deliberately mutates migration, rotation and
            # recovery authority. Replacement/restore must begin from its own
            # clean ephemeral profile so one acceptance gate cannot contaminate
            # another. This runner contains no Founder or canonical AppData.
            Get-Process -Name sahelflow -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                ($_.Name -ieq 'node.exe' -and [string]$_.ExecutablePath -like 'C:\Program Files\SahelFlow\*') -or
                ($_.Name -ieq 'msedgewebview2.exe' -and [string]$_.CommandLine -match 'com\.sahelflow\.desktop')
              } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 500

            $uninstall = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
              -ArgumentList "/x `"$($msis[0].FullName)`" /qn /norestart" `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -notin @(0, 1605)) {
              throw "independent replacement preflight uninstall failed with exit code $($uninstall.ExitCode)"
            }
            Remove-Item -LiteralPath `
              (Join-Path $env:APPDATA 'com.sahelflow.desktop'), `
              (Join-Path $env:LOCALAPPDATA 'com.sahelflow.desktop') `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
            $install = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
              -ArgumentList "/i `"$($msis[0].FullName)`" /qn /norestart" `
              -Wait `
              -PassThru
            if ($install.ExitCode -ne 0) {
              throw "independent replacement preflight install failed with exit code $($install.ExitCode)"
            }
            ./scripts/verify-phase4-replacement-install-ci.ps1 -MsiPath $msis[0].FullName
          } catch {
            $_ | Format-List * -Force | Out-String |
              Set-Content -LiteralPath (Join-Path $destination 'replacement-restore-error.txt') -Encoding UTF8
            throw
          }

      - name: Record installed gate outcome matrix
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          [ordered]@{
            formatVersion = 1
            exactSource = '${{ github.event.pull_request.head.sha || github.sha }}'
            lifecycle = '${{ steps.installed_lifecycle.outcome }}'
            authenticatedUi = '${{ steps.installed_ui.outcome }}'
            replacementRestore = '${{ steps.replacement_restore.outcome }}'
          } |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $destination 'installed-gate-outcomes.json') -Encoding UTF8

      - name: Collect installed Windows evidence
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'sahelflow-installed-e2e'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $roaming = Join-Path $env:APPDATA 'com.sahelflow.desktop'
          $evidenceFiles = @(
            'startup-diagnostic.json',
            'runtime-probe-diagnostic.json',
            'runtime-readiness-diagnostic.json',
            'runtime-endpoint.json',
            'runtime-ui-ready.json',
            'runtime-ui-diagnostic.json',
            'startup-trace.json',
            'shop-registry.json',
            'system\pending-restore.json',
            'system\last-restore.json',
            'migration-journal\current.json',
            'migration-journal\compatibility.json',
            'migration-journal\last-recovery.json'
          )
          foreach ($relative in $evidenceFiles) {
            $source = Join-Path $roaming $relative
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              $safeName = $relative -replace '[\\/:*?"<>|]', '_'
              Copy-Item -LiteralPath $source -Destination (Join-Path $destination $safeName) -Force
            }
          }

          $cacheRoot = Join-Path $env:LOCALAPPDATA 'com.sahelflow.desktop\runtime-cache'
          if (Test-Path -LiteralPath $cacheRoot -PathType Container) {
            $cacheInventory = @(
              Get-ChildItem -LiteralPath $cacheRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $manifestPath = Join-Path $_.FullName 'sahelflow-standalone-manifest.json'
                  [pscustomobject]@{
                    directory = $_.Name
                    createdAt = $_.CreationTimeUtc.ToString('o')
                    lastWriteAt = $_.LastWriteTimeUtc.ToString('o')
                    manifest = if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
                      Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
                    } else {
                      $null
                    }
                    manifestSha256 = if (Test-Path -LiteralPath $manifestPath -PathType Leaf) {
                      (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash
                    } else {
                      $null
                    }
                  }
                }
            )
            $cacheInventory |
              ConvertTo-Json -Depth 10 |
              Set-Content -LiteralPath (Join-Path $destination 'runtime-cache-inventory.json') -Encoding UTF8
          }

          $nodeCompileCacheRoot = Join-Path $env:LOCALAPPDATA 'com.sahelflow.desktop\node-compile-cache'
          if (Test-Path -LiteralPath $nodeCompileCacheRoot -PathType Container) {
            @(
              Get-ChildItem -LiteralPath $nodeCompileCacheRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $files = @(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -ErrorAction SilentlyContinue)
                  [pscustomobject]@{
                    version = $_.Name
                    fileCount = $files.Count
                    bytes = [int64](($files | Measure-Object -Property Length -Sum).Sum)
                  }
                }
            ) |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath (Join-Path $destination 'node-compile-cache-inventory.json') -Encoding UTF8
          }

          @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -ieq 'sahelflow.exe' -or
                $_.Name -ieq 'node.exe' -or
                $_.Name -ieq 'sahelflow-whatsapp.exe' -or
                $_.Name -ieq 'msedgewebview2.exe'
              } |
              Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CommandLine, CreationDate
          ) |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $destination 'processes.json') -Encoding UTF8

          $installed = @(
            Get-ItemProperty -Path @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
            ) -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'SahelFlow' } |
              Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString
          )
          $installed |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $destination 'installed-product.json') -Encoding UTF8

      - name: Upload installed Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sahelflow-installed-e2e/**
            .sf-installed-e2e-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Require every installed gate
        if: always()
        shell: pwsh
        run: |
          $outcomes = [ordered]@{
            lifecycle = '${{ steps.installed_lifecycle.outcome }}'
            authenticatedUi = '${{ steps.installed_ui.outcome }}'
            replacementRestore = '${{ steps.replacement_restore.outcome }}'
          }
          $failed = @(
            $outcomes.GetEnumerator() |
              Where-Object { $_.Value -cne 'success' } |
              ForEach-Object { "$($_.Key)=$($_.Value)" }
          )
          if ($failed.Count -ne 0) {
            throw "Installed gate failures: $($failed -join ', '). See the single outcome/evidence artifact."
          }
