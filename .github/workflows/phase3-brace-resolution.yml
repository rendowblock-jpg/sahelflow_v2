name: Phase 3 compatible brace resolution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase3-compatible-brace-resolution
  cancel-in-progress: true

jobs:
  verify-and-publish:
    name: Resolve secure compatible brace majors
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase3-brace-resolution
      SF_DATA_DIR: /tmp/sahelflow-phase3-brace-resolution/data
      DATABASE_URL: file:/tmp/sahelflow-phase3-brace-resolution/data/shops/test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove unsafe cross-major override
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("package.json")
          package = json.loads(path.read_text(encoding="utf-8"))
          package.get("overrides", {}).pop("brace-expansion", None)
          package.pop("patchedDependencies", None)
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          rm -f patches/brace-expansion@5.0.9.patch

      - name: Refresh compatible lock resolution
        run: bun install

      - name: Verify ESLint compatibility
        run: bun run lint

      - name: Verify production dependency audit
        run: bun audit --production

      - name: Verify sidecar build
        run: bun run build:sidecar

      - name: Prepare focused test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase3-brace-resolution

      - name: Verify focused closure tests
        run: >-
          bunx vitest run
          src/lib/i18n/__tests__/runtime-translations.test.ts
          src/lib/automations/__tests__/conditions.test.ts
          src/lib/integrations/delivery/__tests__/provider-conformance.test.ts

      - name: Publish compatible audited resolution
        run: |
          rm .github/workflows/phase3-brace-resolution.yml
          git config user.name "SahelFlow Phase 3 Closure"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock patches .github/workflows/phase3-brace-resolution.yml
          git diff --cached --check
          git commit -m "fix(deps): preserve compatible audited brace majors"
          git push origin HEAD:agent/phase3-durable-effects-audit
