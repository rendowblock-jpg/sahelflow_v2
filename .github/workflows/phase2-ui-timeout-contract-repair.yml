name: Phase 2 installed UI timeout contract repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase2-ui-timeout-contract-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'agent/native-multi-shop-authority' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head with write authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Align installed UI evidence timeout with product deadlines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/verify-installed-windows-ui.ps1'): (
                  '$maxAuthenticatedUiMilliseconds = 45000',
                  '$maxAuthenticatedUiMilliseconds = 100000',
              ),
              Path('src/lib/__tests__/windows-installed-runtime-contract.test.ts'): (
                  'expect(uiHarness).toContain("$maxAuthenticatedUiMilliseconds = 45000");',
                  'expect(uiHarness).toContain("$maxAuthenticatedUiMilliseconds = 100000");',
              ),
          }
          for path, (before, after) in replacements.items():
              source = path.read_text(encoding='utf-8')
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one timeout anchor, found {count}')
              path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY

          rm .github/workflows/phase2-ui-timeout-contract-repair.yml
          git diff --check

      - name: Commit exact repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SahelFlow Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/verify-installed-windows-ui.ps1 \
                  src/lib/__tests__/windows-installed-runtime-contract.test.ts \
                  .github/workflows/phase2-ui-timeout-contract-repair.yml
          git commit -m 'test(phase2): align installed UI readiness deadline'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
