name: Finalize Internal.13 active authority

on:
  push:
    branches:
      - codex/session2-internal-13
    paths:
      - .github/workflows/finalize-internal-13-authority.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/session2-internal-13
      - name: Reconcile active authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing authority text in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "documentation/README.md",
              "> **Protected-main Session 1 package checkpoint:** PR #171 at\n> `a8770e1943e1fb2d33c6f0520c77d257d5c5bd15`\n> **Milestone source request:** `1.0.0-internal.12` / MSI `1.0.0.12`; not signed\n> or published until the exact protected-main release workflow passes",
              "> **Protected-main combined source checkpoint:** PR #170 at\n> `6cd1103b55c905d26492ecf5436e644d377ce557`\n> **Milestone source request:** `1.0.0-internal.13` / MSI `1.0.0.13`; not signed\n> or published until the exact protected-main release workflow passes",
          )
          replace(
              "documentation/system/CURRENT_STATE.md",
              "> **Protected-main Session 1 package checkpoint:** PR #171 at\n> `a8770e1943e1fb2d33c6f0520c77d257d5c5bd15`\n> **Source version request:** `1.0.0-internal.12` / MSI `1.0.0.12`; not yet a\n> signed or installed result",
              "> **Protected-main combined source checkpoint:** PR #170 at\n> `6cd1103b55c905d26492ecf5436e644d377ce557`\n> **Source version request:** `1.0.0-internal.13` / MSI `1.0.0.13`; not yet a\n> signed or installed result",
          )
          replace(
              "documentation/system/CURRENT_STATE.md",
              "and four merged Session 1 source packages grouped into\nan Internal.12 milestone request.",
              "the merged Session 1 packages, and the merged Session 2 business-truth foundation grouped into\nan Internal.13 milestone request.",
          )
          replace(
              "documentation/system/CURRENT_STATE.md",
              "> Session 1 source packages merged and grouped into an unsigned Internal.12\n> request;",
              "> Session 1 and the Session 2 business-truth foundation merged and grouped\n> into an unsigned Internal.13 request;",
          )
          replace(
              "documentation/system/CURRENT_STATE.md",
              "first live run pending Internal.12",
              "first combined live run pending Internal.13",
          )

          wm = Path("documentation/operations/WORKING_MEMORY.md")
          text = wm.read_text(encoding="utf-8")
          replacements = {
              "> **Protected-main Session 1 package checkpoint:** PR #171 at\n> `a8770e1943e1fb2d33c6f0520c77d257d5c5bd15`\n> **Active milestone request:** `codex/session1-internal-12`,\n> `1.0.0-internal.12` / MSI `1.0.0.12`":
              "> **Protected-main combined source checkpoint:** PR #170 at\n> `6cd1103b55c905d26492ecf5436e644d377ce557`\n> **Active milestone request:** `codex/session2-internal-13`,\n> `1.0.0-internal.13` / MSI `1.0.0.13`",
              "> **Current stage:** Session 1 source packages merged; one milestone candidate\n> is in flight while the Web Agent owns Session 2 through draft PR #170":
              "> **Current stage:** Session 1 and the Session 2 business-truth foundation are\n> merged; the combined Internal.13 milestone candidate is in flight",
              "1. Pass exact-head authority and selected release-risk gates for the single\n   Internal.12 milestone request.\n2. Merge it through protected `main`, then dispatch the signed release workflow\n   once with that exact merge commit and Session 1 release notes.":
              "1. Pass exact-head authority and selected release-risk gates for the combined\n   Internal.13 milestone request.\n2. Merge it through protected `main`, then dispatch the signed release workflow\n   once with that exact merge commit and combined Session 1 + Session 2 notes.",
              "5. Install Internal.12 through the existing in-app updater without deleting or\n   replacing Founder AppData.":
              "5. Install Internal.13 through the existing in-app updater without deleting or\n   replacing Founder AppData.",
              "7. Let the Web Agent continue Session 2 on PR #170, adopting the merged Session 1\n   workspace and experience contracts without overlapping this release branch.":
              "7. Begin the next complete observable Golden COD vertical only after the\n   Internal.13 source and release result are recorded.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing Working Memory authority text: {old[:80]!r}")
              text = text.replace(old, new)
          wm.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/finalize-internal-13-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/README.md documentation/system/CURRENT_STATE.md documentation/operations/WORKING_MEMORY.md .github/workflows/finalize-internal-13-authority.yml
          git commit -m "docs(release): reconcile Internal.13 authority"
          git push origin HEAD:codex/session2-internal-13
