name: Task 6 final commerce authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  authority:
    name: Verify and publish final commerce authority
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-commerce-final-authority
      SF_DATA_DIR: /tmp/sahelflow-commerce-final-authority/data
      DATABASE_URL: file:/tmp/sahelflow-commerce-final-authority/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply reviewed final authority repair
        run: python .github/task6-commerce-final-authority.py

      - name: Format touched source
        run: >-
          bunx prettier --write
          src/lib/integrations/ecommerce/runtime-contracts.ts
          src/lib/integrations/ecommerce/queue.ts
          src/lib/integrations/ecommerce/processor.ts
          src/lib/integrations/ecommerce/recovery.ts
          src/lib/integrations/ecommerce/__tests__/durable-runtime.test.ts
          src/lib/i18n/commerce-runtime.ts
          src/components/settings/commerce-sync-recovery-panel.tsx

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-commerce-final-authority

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Commit source-only final authority
        run: |
          git config user.name "SahelFlow Task 6 Authority"
          git config user.email "actions@users.noreply.github.com"
          git add \
            prisma/models/commerce-runtime.prisma \
            prisma/migrations/20260804043000_phase3_commerce_credential_contract/migration.sql \
            src/lib/integrations/ecommerce/runtime-contracts.ts \
            src/lib/integrations/ecommerce/queue.ts \
            src/lib/integrations/ecommerce/processor.ts \
            src/lib/integrations/ecommerce/recovery.ts \
            src/lib/integrations/ecommerce/__tests__/durable-runtime.test.ts \
            src/lib/i18n/commerce-runtime.ts \
            src/components/settings/commerce-sync-recovery-panel.tsx
          git diff --cached --check
          git commit -m "fix(task6): bind commerce runs to exact provider authority"
          git push origin HEAD:agent/phase3-durable-effects-audit

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task6-commerce-final-authority-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2
