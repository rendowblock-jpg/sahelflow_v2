name: Apply Runtime Staging Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/windows-runtime-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/windows-runtime-staging
          fetch-depth: 0

      - name: Apply readable fail-closed integration
        id: apply
        shell: bash
        env:
          HEAD_BRANCH: agent/windows-runtime-staging
        run: |
          set +e
          python .github/runtime-stage/apply-runtime-staging-readable.py \
            > .github/runtime-stage/apply-readable.log 2>&1
          status=$?
          set -e
          cat .github/runtime-stage/apply-readable.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          rm -rf .github/runtime-stage
          rm -f .github/workflows/apply-runtime-staging.yml
          git diff --check
          test -f src-tauri/src/packaged_runtime.rs
          grep -q '1.0.0-internal.2' sahelflow.version.json
          grep -q 'verify-windows-packaged-runtime.ts' .github/workflows/ci.yml
          git config user.name 'SahelFlow Runtime Integration'
          git config user.email 'runtime-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): stage verified standalone tree before Bun launch'
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload readable integration traceback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-staging-integration-trace-${{ github.run_id }}
          path: .github/runtime-stage/apply-readable.log
          if-no-files-found: error
          retention-days: 2
