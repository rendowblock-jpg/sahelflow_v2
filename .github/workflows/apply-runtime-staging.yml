name: Apply Non-Workflow Runtime Staging Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/windows-runtime-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply and push non-workflow changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: agent/windows-runtime-staging
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python .github/runtime-stage/apply-runtime-staging-readable.py
          rm -rf .github/runtime-stage
          git checkout HEAD -- \
            .github/workflows/apply-runtime-staging.yml \
            .github/workflows/ci.yml \
            .github/workflows/release.yml
          git diff --check
          test -f src-tauri/src/packaged_runtime.rs
          grep -q '1.0.0-internal.2' sahelflow.version.json
          git config user.name 'SahelFlow Runtime Integration'
          git config user.email 'runtime-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): stage verified standalone tree before Bun launch'
          git push origin HEAD:"$HEAD_BRANCH"
