name: Export Runtime Staging Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/windows-runtime-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize proven final diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: agent/windows-runtime-staging
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python .github/runtime-stage/apply-runtime-staging-readable.py
          rm -rf .github/runtime-stage
          rm -f .github/workflows/apply-runtime-staging.yml
          git diff --check
          test -f src-tauri/src/packaged_runtime.rs
          grep -q '1.0.0-internal.2' sahelflow.version.json
          grep -q 'verify-windows-packaged-runtime.ts' .github/workflows/ci.yml
          git diff --binary > ../runtime-staging-final.patch
          git diff --name-status > ../runtime-staging-name-status.txt
          git diff --name-only --diff-filter=ACMR -z | \
            tar --null -T - -czf ../runtime-staging-final-files.tar.gz

      - name: Upload proven final integration
        uses: actions/upload-artifact@v4
        with:
          name: runtime-staging-final-${{ github.run_id }}
          path: |
            runtime-staging-final.patch
            runtime-staging-name-status.txt
            runtime-staging-final-files.tar.gz
          if-no-files-found: error
          retention-days: 2
