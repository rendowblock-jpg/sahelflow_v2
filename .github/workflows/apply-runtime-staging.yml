name: Apply Runtime Staging Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.head_ref == 'agent/windows-runtime-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply readable fail-closed integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: agent/windows-runtime-staging
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$HEAD_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          set +e
          python .github/runtime-stage/apply-runtime-staging-readable.py \
            > runtime-staging-integration-trace.log 2>&1
          status=$?
          set -e
          cat runtime-staging-integration-trace.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Runtime staging integration traceback'
              echo
              echo '```text'
              cat runtime-staging-integration-trace.log
              echo '```'
            } > runtime-staging-integration-comment.md
            gh pr comment "$PR_NUMBER" --body-file runtime-staging-integration-comment.md
            exit "$status"
          fi

          rm -rf .github/runtime-stage
          rm -f .github/workflows/apply-runtime-staging.yml
          rm -f runtime-staging-integration-trace.log
          git diff --check
          test -f src-tauri/src/packaged_runtime.rs
          grep -q '1.0.0-internal.2' sahelflow.version.json
          grep -q 'verify-windows-packaged-runtime.ts' .github/workflows/ci.yml
          git config user.name 'SahelFlow Runtime Integration'
          git config user.email 'runtime-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): stage verified standalone tree before Bun launch'
          git push origin HEAD:"$HEAD_BRANCH"
