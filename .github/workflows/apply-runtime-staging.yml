name: Apply Runtime Staging Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/windows-runtime-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/windows-runtime-staging
          fetch-depth: 0

      - name: Materialize and apply reviewed integration
        shell: bash
        env:
          HEAD_BRANCH: agent/windows-runtime-staging
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          root = Path.cwd()
          patch_payload = root / ".github/runtime-stage/apply-runtime-staging.py.gz.b64"
          patch = root / ".github/runtime-stage/apply-runtime-staging.py"
          patch.write_bytes(gzip.decompress(base64.b64decode(patch_payload.read_text().strip())))
          PY

          set +e
          python .github/runtime-stage/apply-runtime-staging.py \
            > .github/runtime-stage/apply-error.log 2>&1
          status=$?
          set -e

          git config user.name 'SahelFlow Runtime Integration'
          git config user.email 'runtime-integration@users.noreply.github.com'

          if [ "$status" -ne 0 ]; then
            rm -f .github/workflows/apply-runtime-staging.yml
            git add -A
            git commit -m 'chore(runtime): retain integration failure diagnostics'
            git push origin HEAD:"$HEAD_BRANCH"
            cat .github/runtime-stage/apply-error.log
            exit "$status"
          fi

          rm -rf .github/runtime-stage
          rm -f .github/workflows/apply-runtime-staging.yml
          git diff --check
          test -f src-tauri/src/packaged_runtime.rs
          grep -q '1.0.0-internal.2' sahelflow.version.json
          grep -q 'verify-windows-packaged-runtime.ts' .github/workflows/ci.yml
          git add -A
          git commit -m 'fix(runtime): stage verified standalone tree before Bun launch'
          git push origin HEAD:"$HEAD_BRANCH"
