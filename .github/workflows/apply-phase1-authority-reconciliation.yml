name: Apply Phase 1 authority reconciliation

on:
  push:
    branches:
      - agent/phases1-4-completion-program
    paths:
      - .github/workflows/apply-phase1-authority-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: phase1-authority-reconciliation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/phases1-4-completion-program
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified authority patch and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          encoded=.github/phase1-authority-reconciliation.patch.gz.b64
          patch="$(mktemp)"
          base64 --decode "$encoded" | gzip --decompress > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "6a0e1ee4716488936e5f0c2e6d0737060eea47c66aabd6b61c635518c0b171a4"
          git apply --check "$patch"
          git apply "$patch"
          rm "$encoded" .github/workflows/apply-phase1-authority-reconciliation.yml "$patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "reconcile Phase 1 source exit authority"
          git push origin "HEAD:agent/phases1-4-completion-program"
