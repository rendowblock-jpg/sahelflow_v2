name: Analytics lockfile probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.ref == 'agent/class-aaa-analytics-system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate exact text lockfile
        run: bun install --lockfile-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: analytics-generated-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
