name: Repair Audited Transitive Dependency Lock

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore exact canonical dependency inputs
        shell: bash
        run: |
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git show origin/main:package.json > package.json
          git show origin/main:bun.lock > bun.lock

      - name: Refresh only audit-named top-level dependency trees
        run: >-
          bun update
          eslint
          eslint-config-next
          @vitest/coverage-v8
          @sentry/nextjs
          googleapis
          --force
          --lockfile-only

      - name: Restore reviewed package manifest
        shell: bash
        run: git show origin/main:package.json > package.json

      - name: Verify only the lockfile changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "bun.lock" ]; then
            echo "unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Verify frozen install
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Collect resolved advisory versions
        id: resolved
        shell: bash
        run: |
          brace="$(grep -oE 'brace-expansion@[0-9]+\.[0-9]+\.[0-9]+' bun.lock | cut -d@ -f2 | sort -Vu | paste -sd, -)"
          yaml="$(grep -oE 'js-yaml@[0-9]+\.[0-9]+\.[0-9]+' bun.lock | cut -d@ -f2 | sort -Vu | paste -sd, -)"
          echo "brace=$brace" >> "$GITHUB_OUTPUT"
          echo "yaml=$yaml" >> "$GITHUB_OUTPUT"

      - name: Collect vulnerable lock ownership paths
        id: paths
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/collect-vulnerable-paths.ts" <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";

          type Version = readonly [number, number, number];

          function parse(version: string): Version {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`unsupported semver: ${version}`);
            return [Number(match[1]), Number(match[2]), Number(match[3])];
          }

          function compare(a: Version, b: Version): number {
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          }

          function vulnerableBrace(version: string): boolean {
            const parsed = parse(version);
            const major = parsed[0];
            if (major < 1) return true;
            if (major === 1) return compare(parsed, [1, 1, 16]) < 0;
            if (major === 2) return compare(parsed, [2, 1, 2]) < 0;
            if (major === 3 || major === 4) return true;
            if (major === 5) return compare(parsed, [5, 0, 7]) < 0;
            return false;
          }

          function vulnerableYaml(version: string): boolean {
            const parsed = parse(version);
            if (parsed[0] === 3) return compare(parsed, [3, 15, 0]) < 0;
            if (parsed[0] === 4) return compare(parsed, [4, 3, 0]) < 0;
            return false;
          }

          const brace: string[] = [];
          const yaml: string[] = [];

          for (const line of readFileSync("bun.lock", "utf8").split("\n")) {
            const match = /^\s*"([^"]+)": \["(brace-expansion|js-yaml)@(\d+\.\d+\.\d+)"/.exec(line);
            if (!match) continue;
            const [, key, name, version] = match;
            if (name === "brace-expansion" && vulnerableBrace(version)) brace.push(`${key}=${version}`);
            if (name === "js-yaml" && vulnerableYaml(version)) yaml.push(`${key}=${version}`);
          }

          const output = process.env.GITHUB_OUTPUT;
          if (!output) throw new Error("GITHUB_OUTPUT is unavailable");
          appendFileSync(output, `brace=${brace.join("|").slice(0, 900)}\n`);
          appendFileSync(output, `yaml=${yaml.join("|").slice(0, 900)}\n`);
          EOF
          bun "$RUNNER_TEMP/collect-vulnerable-paths.ts"

      - name: Remaining vulnerable paths brace=${{ steps.paths.outputs.brace }} yaml=${{ steps.paths.outputs.yaml }}
        run: true

      - name: Verify patched versions brace=${{ steps.resolved.outputs.brace }} yaml=${{ steps.resolved.outputs.yaml }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-advisory-versions.ts" <<'EOF'
          import { readFileSync } from "node:fs";

          type Version = readonly [number, number, number];
          const lock = readFileSync("bun.lock", "utf8");

          function parse(version: string): Version {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`unsupported semver in lockfile: ${version}`);
            return [Number(match[1]), Number(match[2]), Number(match[3])];
          }

          function compare(a: Version, b: Version): number {
            for (let index = 0; index < 3; index += 1) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          }

          function collect(packageName: string): string[] {
            return [...lock.matchAll(new RegExp(`${packageName.replace("-", "\\-")}@(\\d+\\.\\d+\\.\\d+)`, "g"))]
              .map((match) => match[1])
              .filter((value, index, values) => values.indexOf(value) === index)
              .sort((left, right) => compare(parse(left), parse(right)));
          }

          const braceVersions = collect("brace-expansion");
          const yamlVersions = collect("js-yaml");

          const vulnerableBrace = braceVersions.filter((version) => {
            const parsed = parse(version);
            const major = parsed[0];
            if (major < 1) return true;
            if (major === 1) return compare(parsed, [1, 1, 16]) < 0;
            if (major === 2) return compare(parsed, [2, 1, 2]) < 0;
            if (major === 3 || major === 4) return true;
            if (major === 5) return compare(parsed, [5, 0, 7]) < 0;
            return false;
          });

          const vulnerableYaml = yamlVersions.filter((version) => {
            const parsed = parse(version);
            if (parsed[0] === 3) return compare(parsed, [3, 15, 0]) < 0;
            if (parsed[0] === 4) return compare(parsed, [4, 3, 0]) < 0;
            return false;
          });

          if (vulnerableBrace.length > 0) {
            throw new Error(`vulnerable brace-expansion resolutions remain: ${vulnerableBrace.join(", ")}`);
          }
          if (vulnerableYaml.length > 0) {
            throw new Error(`vulnerable js-yaml resolutions remain: ${vulnerableYaml.join(", ")}`);
          }
          EOF
          bun "$RUNNER_TEMP/verify-advisory-versions.ts"

      - name: Explain any remaining brace-expansion and js-yaml paths
        if: failure()
        shell: bash
        run: |
          bun why brace-expansion --depth 20 || true
          bun why js-yaml --depth 20 || true

      - name: Verify production dependency audit
        run: bun audit --production

      - name: Verify version and updater authority
        run: bun run sf-version

      - name: Verify fast application gate
        run: bun run sf-verify --fast

      - name: Commit targeted audited lock repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'targeted dependency-tree refresh produced no lockfile change'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'fix(deps): repair audited transitive resolutions'
          git push origin "HEAD:$HEAD_BRANCH"
