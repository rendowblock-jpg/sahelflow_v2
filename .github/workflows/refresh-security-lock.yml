name: Refresh Security Dependency Lock

on:
  push:
    branches:
      - agent/fix-security-audit-2026-07-21

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Force-refresh compatible dependency resolutions
        run: bun update --force

      - name: Verify frozen install
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Persist refreshed dependency lock
        id: persist
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'bun update produced no dependency changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'fix(deps): refresh audited dependency lock'
          git push origin HEAD:agent/fix-security-audit-2026-07-21
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify production dependency audit
        run: bun audit --prod

      - name: Verify version and updater authority
        run: bun run sf-version

      - name: Verify fast application gate
        run: bun run sf-verify --fast
