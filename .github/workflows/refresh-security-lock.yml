name: Refresh Security Dependency Lock

on:
  push:
    branches:
      - agent/fix-security-audit-2026-07-21

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Refresh compatible dependency resolutions
        run: bun update

      - name: Verify frozen install
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Verify production dependency audit
        run: bun audit --production

      - name: Verify version and updater authority
        run: bun run sf-version

      - name: Verify fast application gate
        run: bun run sf-verify --fast

      - name: Upload refreshed dependency files
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-security-lock
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 3
