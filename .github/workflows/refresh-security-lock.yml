name: Repair Audited Transitive Dependency Lock

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SF_TEST_ROOT: /tmp/sahelflow-security-repair
      SF_DATA_DIR: /tmp/sahelflow-security-repair/data
      DATABASE_URL: file:/tmp/sahelflow-security-repair/data/shops/test.db
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SF_TEST_FAIL_FAST: "1"
    steps:
      - name: Checkout exact security-fix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore exact canonical dependency inputs
        shell: bash
        run: |
          git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git show origin/main:package.json > package.json
          git show origin/main:bun.lock > bun.lock
          cp package.json "$RUNNER_TEMP/main-package.json"
          rm -rf patches node_modules

      - name: Add exact patched advisory resolutions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/add-security-overrides.ts" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "package.json";
          const packageJson = JSON.parse(readFileSync(path, "utf8")) as {
            overrides?: Record<string, string>;
          };

          packageJson.overrides = {
            ...(packageJson.overrides ?? {}),
            "brace-expansion": "5.0.7",
            "js-yaml": "4.3.0",
          };

          writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          EOF
          bun "$RUNNER_TEMP/add-security-overrides.ts"

      - name: Install exact patched dependency candidates
        run: bun install --force --linker=hoisted

      - name: Prepare brace-expansion for safe patching
        run: bun patch brace-expansion@5.0.7

      - name: Add legacy CommonJS callable bridge
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/apply-brace-bridge.ts" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "node_modules/brace-expansion/dist/commonjs/index.js";
          const marker = "module.exports = Object.assign(exports.expand, exports);";
          const source = readFileSync(path, "utf8");

          if (!source.includes("exports.expand")) {
            throw new Error("brace-expansion CommonJS build does not expose exports.expand");
          }
          if (source.includes(marker)) {
            throw new Error("brace-expansion compatibility bridge already exists upstream");
          }

          writeFileSync(path, `${source.trimEnd()}\n${marker}\n`);
          EOF
          bun "$RUNNER_TEMP/apply-brace-bridge.ts"

      - name: Commit Bun dependency patch
        run: bun patch --commit brace-expansion@5.0.7

      - name: Verify package manifest delta is security-only
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-manifest-delta.ts" <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";

          const before = JSON.parse(readFileSync(process.env.MAIN_PACKAGE!, "utf8"));
          const after = JSON.parse(readFileSync("package.json", "utf8"));

          before.overrides = {
            ...(before.overrides ?? {}),
            "brace-expansion": "5.0.7",
            "js-yaml": "4.3.0",
          };

          const patched = after.patchedDependencies as Record<string, string> | undefined;
          assert.ok(patched, "patchedDependencies was not generated");
          assert.deepEqual(Object.keys(patched), ["brace-expansion@5.0.7"]);

          const patchPath = patched["brace-expansion@5.0.7"];
          assert.equal(typeof patchPath, "string");
          assert.match(patchPath, /^patches\/[A-Za-z0-9@._+-]+\.patch$/);
          assert.ok(existsSync(patchPath), `generated patch does not exist: ${patchPath}`);

          before.patchedDependencies = patched;
          assert.deepEqual(after, before, "package.json changed outside approved security fields");
          EOF
          MAIN_PACKAGE="$RUNNER_TEMP/main-package.json" bun "$RUNNER_TEMP/verify-manifest-delta.ts"

      - name: Verify generated patch is minimal
        shell: bash
        run: |
          patch_file="$(find patches -maxdepth 1 -type f -name '*.patch' -print)"
          if [ -z "$patch_file" ] || [ "$(printf '%s\n' "$patch_file" | wc -l)" -ne 1 ]; then
            echo 'expected exactly one generated patch file'
            find patches -maxdepth 1 -type f -print || true
            exit 1
          fi
          if [ "$(grep -c '^diff --git ' "$patch_file")" -ne 1 ]; then
            echo 'patch changes more than one file'
            cat "$patch_file"
            exit 1
          fi
          grep -F 'dist/commonjs/index.js' "$patch_file" >/dev/null
          grep -F '+module.exports = Object.assign(exports.expand, exports);' "$patch_file" >/dev/null
          if grep -E '^Binary files|^GIT binary patch' "$patch_file" >/dev/null; then
            echo 'binary patch content is forbidden'
            exit 1
          fi

      - name: Verify generated path set
        shell: bash
        run: |
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          if [ "${#changed[@]}" -ne 3 ]; then
            echo 'expected package.json, bun.lock, and one patch file only'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          printf '%s\n' "${changed[@]}" | grep -Fx 'bun.lock' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'package.json' >/dev/null
          if [ "$(printf '%s\n' "${changed[@]}" | grep -Ec '^patches/[^/]+\.patch$')" -ne 1 ]; then
            echo 'unexpected generated path set'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Reinstall from committed dependency evidence
        shell: bash
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile --linker=hoisted

      - name: Verify patched legacy and modern API
        shell: bash
        run: |
          bun -e '
            const expansion = require("brace-expansion");
            if (typeof expansion !== "function") throw new Error("legacy callable export is unavailable");
            if (expansion.expand !== expansion) throw new Error("modern expand export is not retained");
            const expected = JSON.stringify(["file-a", "file-b"]);
            const legacy = JSON.stringify(expansion("file-{a,b}"));
            const modern = JSON.stringify(expansion.expand("file-{a,b}"));
            if (legacy !== expected || modern !== expected) {
              throw new Error(`unexpected expansion results: ${legacy} / ${modern}`);
            }
          '

      - name: Verify exact advisory versions
        shell: bash
        run: |
          brace="$(grep -oE 'brace-expansion@[0-9]+\.[0-9]+\.[0-9]+' bun.lock | cut -d@ -f2 | sort -Vu | paste -sd, -)"
          yaml="$(grep -oE 'js-yaml@[0-9]+\.[0-9]+\.[0-9]+' bun.lock | cut -d@ -f2 | sort -Vu | paste -sd, -)"
          echo "brace-expansion resolutions: $brace"
          echo "js-yaml resolutions: $yaml"
          test "$brace" = '5.0.7'
          test "$yaml" = '4.3.0'

      - name: Verify production dependency audit
        run: bun audit --production

      - name: Verify version and updater authority
        run: bun run sf-version

      - name: Verify documentation authority
        run: bun run sf-audit

      - name: Prepare disposable application test sandbox
        run: bun run test:sandbox -- "$SF_TEST_ROOT"

      - name: Verify complete application gate
        run: bun run sf-verify

      - name: Verify coverage threshold
        run: bunx vitest run --coverage

      - name: Commit reviewed dependency repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          patch_file="$(find patches -maxdepth 1 -type f -name '*.patch' -print)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock "$patch_file"
          git commit -m 'fix(deps): patch secure brace-expansion compatibility'
          git push origin "HEAD:$HEAD_BRANCH"
