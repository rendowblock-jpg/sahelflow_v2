name: Phase 4 final search authority repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/phase4-protected-data-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove final legacy live-search candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          codec_path = Path('src/lib/crypto/protected-pii.ts')
          codec = codec_path.read_text(encoding='utf-8')

          old = '''  decryptString,
            deriveBlindIndex,
            isEncryptedPayload,'''
          new = '''  decryptString,
            isEncryptedPayload,'''
          if codec.count(old) != 1:
              raise SystemExit('field-crypto import anchor drifted')
          codec = codec.replace(old, new, 1)

          old = '''  async function customerPhoneIndexes(value: string): Promise<string[]> {
              const indexes = new Set<string>([deriveBlindIndex(value, legacyRoot)]);
              const current = await blindKeyIfPresent();
              if (current) {
                indexes.add(
                  await indexWithAuthority(
                    value,
                    { recordType: "Customer", field: "phone" },
                    current,
                  ),
                );
              }
              return [...indexes];
            }'''
          new = '''  async function customerPhoneIndexes(value: string): Promise<string[]> {
              const current = await blindKeyIfPresent();
              if (!current) return [];
              return [
                await indexWithAuthority(
                  value,
                  { recordType: "Customer", field: "phone" },
                  current,
                ),
              ];
            }'''
          if codec.count(old) != 1:
              raise SystemExit('customerPhoneIndexes anchor drifted')
          codec = codec.replace(old, new, 1)
          codec_path.write_text(codec, encoding='utf-8', newline='\n')

          test_path = Path('src/lib/__tests__/phase4-live-search-authority.test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = '''  });
          });
          '''
          addition = '''

            it("does not derive installation-root candidates for direct customer phone lookups", () => {
              const source = read("src/lib/crypto/protected-pii.ts");
              const start = source.indexOf("async function customerPhoneIndexes");
              const end = source.indexOf("async function decryptNested", start);
              expect(start).toBeGreaterThanOrEqual(0);
              expect(end).toBeGreaterThan(start);
              const lookupAuthority = source.slice(start, end);
              expect(lookupAuthority).toContain("blindKeyIfPresent");
              expect(lookupAuthority).not.toContain("deriveBlindIndex");
              expect(lookupAuthority).not.toContain("legacyRoot");
            });
          '''
          if test.count(marker) != 1:
              raise SystemExit('search-authority test closing anchor drifted')
          test = test.replace(marker, '  });' + addition + '\n});\n', 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')

          Path('.github/workflows/phase4-final-search-patch.yml').unlink()
          PY

          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sahelflow-phase4-closer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/crypto/protected-pii.ts \
                  src/lib/__tests__/phase4-live-search-authority.test.ts \
                  .github/workflows/phase4-final-search-patch.yml
          git commit -m 'fix(phase4): remove root-key direct lookup authority'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
