name: Apply Remotion Transition Fix

on:
  push:
    branches:
      - agent/remotion-launch-system
    paths:
      - ".github/workflows/remotion-transition-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remotion-launch-system

      - name: Remove full-black scene fades
        shell: python
        run: |
          from pathlib import Path

          path = Path("marketing/remotion/src/compositions.tsx")
          source = path.read_text(encoding="utf-8")
          source = source.replace("  sceneOpacity,\n", "")

          before = """const Scene: React.FC<{\n  duration: number;\n  children: ReactNode;\n  glow?: 'emerald' | 'blue' | 'magenta' | 'amber';\n  style?: CSSProperties;\n}> = ({duration, children, glow, style}) => {\n  const frame = useCurrentFrame();\n  return (\n    <SceneCanvas glow={glow} style={{opacity: sceneOpacity(frame, duration), ...style}}>\n      {children}\n    </SceneCanvas>\n  );\n};"""
          after = """const Scene: React.FC<{\n  duration: number;\n  children: ReactNode;\n  glow?: 'emerald' | 'blue' | 'magenta' | 'amber';\n  style?: CSSProperties;\n}> = ({children, glow, style}) => (\n  <SceneCanvas glow={glow} style={style}>\n    {children}\n  </SceneCanvas>\n);"""

          if before not in source:
              raise SystemExit("Expected Scene implementation was not found")

          path.write_text(source.replace(before, after), encoding="utf-8")
          Path(".github/workflows/remotion-transition-fix.yml").unlink()

      - name: Commit transition fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/remotion/src/compositions.tsx .github/workflows/remotion-transition-fix.yml
          git commit -m "fix(video): keep scene transitions visually continuous"
          git push origin HEAD:agent/remotion-launch-system
