name: LAB Windows run 5 Internal.51 candidate tests with the migration step (not for merge)

# Lab branch only (lab/s42-r51-win5). Never merged. Run 4 showed two older tests failing on Windows on main. This run adds the one step that
# the product's own CI has and run 3/4 did not: `bunx prisma migrate deploy` after the disposable sandbox is prepared. It also runs the
# CRLF fix (draft #701) and the three Internal.51 order-page tests on a real Windows checkout.

on:
  push:
    branches:
      - lab/s42-r51-win5

permissions:
  contents: read

jobs:
  windows-r51:
    name: Internal.51 candidate tests on Windows (with migrate deploy)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SF_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare disposable test sandbox
        shell: pwsh
        run: |
          $tempRoot = (& bun -e "console.log(require('node:os').tmpdir())").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tempRoot)) {
            throw 'failed to resolve the Bun OS temporary directory'
          }
          $sandboxRoot = Join-Path $tempRoot "sahelflow-lab-win-$env:GITHUB_RUN_ID"
          $output = @(& bun run scripts/prepare-test-sandbox.ts $sandboxRoot)
          if ($LASTEXITCODE -ne 0) {
            throw 'canonical test sandbox preparation failed'
          }
          foreach ($name in @('SF_TEST_ROOT', 'SF_DATA_DIR', 'DATABASE_URL')) {
            $line = $output | Where-Object { $_ -like "$name=*" } | Select-Object -Last 1
            if ([string]::IsNullOrWhiteSpace($line)) {
              throw "canonical test sandbox did not return $name"
            }
            $line >> $env:GITHUB_ENV
          }

      - name: Deploy database migrations (the step runs 3 and 4 did not have)
        shell: pwsh
        run: |
          bunx prisma migrate deploy
          if ($LASTEXITCODE -ne 0) { throw "prisma migrate deploy exit $LASTEXITCODE" }

      - name: Run the tests
        shell: pwsh
        run: |
          $files = @(
            'src/components/orders/__tests__/delivery-slip-whatsapp-contract.test.ts',
            'src/app/(dashboard)/orders/__tests__/active-orders.test.ts',
            'src/components/orders/__tests__/order-lifecycle-rail.render.test.tsx',
            'src/components/orders/__tests__/create-shipment-none-attached.render.test.tsx',
            'src/components/orders/__tests__/order-summary-strip.render.test.tsx'
          )
          Write-Host "files: $($files.Count)"
          & bunx vitest run @files
          if ($LASTEXITCODE -ne 0) { throw "vitest exit $LASTEXITCODE" }
