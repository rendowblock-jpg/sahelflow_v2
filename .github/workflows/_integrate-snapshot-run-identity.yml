name: Integrate migration snapshot run identity

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/deterministic-rust-descendant-helper' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-rust-descendant-helper
          fetch-depth: 0

      - name: Setup Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply collision-safe snapshot identity
        run: python .github/patches/integrate_snapshot_run_identity.py

      - name: Canonical Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit source repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/migration_coordinator.rs
          git diff --cached --check
          git commit -m "fix(migrations): make snapshot identity collision-safe"
          git push origin HEAD:agent/deterministic-rust-descendant-helper
