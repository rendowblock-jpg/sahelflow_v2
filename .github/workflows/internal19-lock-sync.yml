name: Internal.19 lock sync

on:
  push:
    branches:
      - agent/internal19-founder-offline-release
    paths:
      - .github/workflows/internal19-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/internal19-founder-offline-release
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Synchronize only SahelFlow root package version
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml -p sahelflow --precise 1.0.0-internal.19

          git diff --exit-code -- . ':(exclude)src-tauri/Cargo.lock' || {
            echo 'Cargo modified files outside src-tauri/Cargo.lock' >&2
            exit 1
          }

          python3 - <<'PY'
          import subprocess
          diff = subprocess.check_output([
              'git', 'diff', '--unified=0', '--', 'src-tauri/Cargo.lock'
          ], text=True)
          changed = [
              line[1:].strip()
              for line in diff.splitlines()
              if (line.startswith(('+', '-')) and not line.startswith(('+++', '---')))
          ]
          expected = [
              'version = "1.0.0-internal.18"',
              'version = "1.0.0-internal.19"',
          ]
          if changed != expected:
              raise SystemExit(f'Unexpected Cargo.lock diff: {changed!r}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git commit -m 'Internal.19: synchronize Cargo.lock version'
          git push origin HEAD:agent/internal19-founder-offline-release
