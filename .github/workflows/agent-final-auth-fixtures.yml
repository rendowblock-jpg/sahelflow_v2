name: One-shot final auth fixtures

on:
  push:
    branches:
      - agent/phase2-session-freshness
    paths:
      - .github/workflows/agent-final-auth-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-session-freshness
          fetch-depth: 0

      - name: Repair final route-calling fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          empty_mock = re.compile(
              r'vi\.mock\("next/headers", \(\) => \(\{\s*'
              r'cookies: vi\.fn\(async \(\) => \(\{\s*'
              r'get: \(\) => undefined,\s*'
              r'set: \(\) => undefined,\s*'
              r'delete: \(\) => undefined,\s*'
              r'\}\)\),\s*\}\)\);',
              re.S,
          )

          def cookie_mock(store: str) -> str:
              return f'''const {store} = vi.hoisted(() => new Map<string, string>());
          vi.mock("next/headers", () => ({{
            cookies: vi.fn(async () => ({{
              get: (name: string) => {{
                const value = {store}.get(name);
                return value === undefined ? undefined : {{ value }};
              }},
              set: (name: string, value: string) => {{
                {store}.set(name, value);
              }},
              delete: (name: string) => {{
                {store}.delete(name);
              }},
            }})),
          }}));'''.replace('          ', '')

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding='utf-8')

          # Comment-only cleanup in suites already migrated to real sessions.
          for filename in [
              'src/app/api/__tests__/delivery-patch.test.ts',
              'src/app/api/__tests__/orders.test.ts',
              'src/app/api/__tests__/risk.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              start = text.find('// ── Mock next/headers')
              end = text.find('const authCookieStore', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'{path}: stale comment boundaries not found')
              text = (
                  text[:start]
                  + '// Protected route scenarios create a real revocable session in beforeEach.\n'
                  + text[end:]
              )
              write(path, text)

          # order-create paths.
          path = Path('src/lib/data/__tests__/order-create-paths.test.ts')
          text = path.read_text(encoding='utf-8')
          start = text.find('// ── Mock next/headers cookies()')
          mock_start = text.find('vi.mock("next/headers"', start)
          if start < 0 or mock_start < 0:
              raise SystemExit(f'{path}: comment boundaries not found')
          text = text[:start] + '// Protected import-route scenarios use one real revocable session.\n' + text[mock_start:]
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          helper = re.compile(r'import \{([\s\S]*?)\} from "@/app/api/__tests__/helpers";')
          match = helper.search(text)
          if not match or 'seedStorefront' not in match.group(1):
              raise SystemExit(f'{path}: API helpers import not found')
          names = match.group(1)
          if 'establishAuthenticatedTestSession' not in names:
              names = names.rstrip() + ',\n  establishAuthenticatedTestSession,\n'
              text = text[:match.start(1)] + names + text[match.end(1):]
          text, count = re.subn(
              r'beforeEach\(async \(\) => \{\s*await cleanDb\(\);',
              'beforeEach(async () => {\n  await cleanDb();\n  authCookieStore.clear();\n  delete process.env.AUTH_SECRET;\n  await establishAuthenticatedTestSession();',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: beforeEach not found')
          text, count = re.subn(
              r'afterAll\(async \(\) => \{\s*await rawDb\.\$disconnect\(\);\s*\}\);',
              'afterAll(async () => {\n  authCookieStore.clear();\n  delete process.env.AUTH_SECRET;\n  await rawDb.$disconnect();\n});',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: afterAll not found')
          write(path, text)

          # shipped automation route fixture.
          path = Path('src/lib/automations/__tests__/order-triggers.test.ts')
          text = path.read_text(encoding='utf-8')
          start = text.find('// ── Mock next/headers cookies()')
          mock_start = text.find('vi.mock("next/headers"', start)
          if start < 0 or mock_start < 0:
              raise SystemExit(f'{path}: comment boundaries not found')
          text = text[:start] + '// Protected delivery-route scenarios use one real revocable session.\n' + text[mock_start:]
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          old = 'import { rawDb, cleanDb, mockPost, getJson, seedProduct } from "@/app/api/__tests__/helpers";'
          new = 'import { rawDb, cleanDb, mockPost, getJson, seedProduct, establishAuthenticatedTestSession } from "@/app/api/__tests__/helpers";'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: helper import not found')
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r'beforeEach\(async \(\) => \{\s*await cleanDb\(\);',
              'beforeEach(async () => {\n    await cleanDb();\n    authCookieStore.clear();\n    delete process.env.AUTH_SECRET;\n    await establishAuthenticatedTestSession();',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: beforeEach not found')
          text, count = re.subn(
              r'afterAll\(async \(\) => \{\s*await rawDb\.\$disconnect\(\);\s*\}\);',
              'afterAll(async () => {\n    authCookieStore.clear();\n    delete process.env.AUTH_SECRET;\n    await rawDb.$disconnect();\n  });',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: afterAll not found')
          write(path, text)

          # return/refund route fixture.
          path = Path('src/lib/data/__tests__/return-refund-integrity.test.ts')
          text = path.read_text(encoding='utf-8')
          start = text.find('// ── Mock next/headers')
          mock_start = text.find('vi.mock("next/headers"', start)
          if start < 0 or mock_start < 0:
              raise SystemExit(f'{path}: comment boundaries not found')
          text = text[:start] + '// The protected return route uses one real revocable session per test.\n' + text[mock_start:]
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          old = 'import { mockPost } from "@/app/api/__tests__/helpers";'
          new = 'import { establishAuthenticatedTestSession, mockPost } from "@/app/api/__tests__/helpers";'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: helper import not found')
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r'beforeEach\(async \(\) => \{\s*db = await createTestPrisma\(\);\s*\}\);',
              'beforeEach(async () => {\n  db = await createTestPrisma();\n  authCookieStore.clear();\n  delete process.env.AUTH_SECRET;\n  await establishAuthenticatedTestSession();\n});',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: beforeEach not found')
          text, count = re.subn(
              r'afterEach\(async \(\) => \{\s*await disconnectTestPrisma\(db\);\s*\}\);',
              'afterEach(async () => {\n  authCookieStore.clear();\n  delete process.env.AUTH_SECRET;\n  await disconnectTestPrisma(db);\n});',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'{path}: afterEach not found')
          write(path, text)

          remaining = []
          for candidate in sorted(Path('src').rglob('*.test.ts')) + sorted(Path('src').rglob('*.test.tsx')):
              value = candidate.read_text(encoding='utf-8')
              if 'vi.mock("next/headers"' not in value:
                  continue
              if 'get: () => undefined' in value or 'get: vi.fn(() => undefined)' in value:
                  remaining.append(str(candidate))
              elif 'setup mode' in value and 'requireAuth' in value:
                  remaining.append(str(candidate))
          if remaining:
              raise SystemExit('remaining legacy auth fixtures:\n' + '\n'.join(remaining))
          PY

          git diff --check
          git diff --stat
          git rm .github/workflows/agent-final-auth-fixtures.yml
          git config user.name "sahelflow-agent"
          git config user.email "agent@sahelflow.local"
          git add src
          git commit -m "test(auth): finish explicit route session fixtures"
          git push origin HEAD:agent/phase2-session-freshness
