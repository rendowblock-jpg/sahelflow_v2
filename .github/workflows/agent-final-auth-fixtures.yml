name: One-shot final auth fixtures

on:
  push:
    branches:
      - agent/phase2-session-freshness
    paths:
      - .github/workflows/agent-final-auth-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-session-freshness
          fetch-depth: 0

      - name: Repair final route-calling fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Already-authenticated API suites: remove only obsolete setup-bypass comments.
          for filename in [
              'src/app/api/__tests__/delivery-patch.test.ts',
              'src/app/api/__tests__/orders.test.ts',
              'src/app/api/__tests__/risk.test.ts',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'//[^\n]*Mock next/headers[^\n]*\n(?:(?://[^\n]*\n)+?)(?=const authCookieStore)',
                  '// Protected route scenarios create a real revocable session in beforeEach.\n',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{path}: stale comment block not found')
              path.write_text(text, encoding='utf-8')

          empty_mock = re.compile(
              r'vi\.mock\("next/headers", \(\) => \(\{\n'
              r'\s*cookies: vi\.fn\(async \(\) => \(\{\n'
              r'\s*get: \(\) => undefined,\n'
              r'\s*set: \(\) => undefined,\n'
              r'\s*delete: \(\) => undefined,\n'
              r'\s*\}\)\),\n'
              r'\s*\}\)\);'
          )

          def cookie_mock(store: str) -> str:
              return f'''const {store} = vi.hoisted(() => new Map<string, string>());
          vi.mock("next/headers", () => ({{
            cookies: vi.fn(async () => ({{
              get: (name: string) => {{
                const value = {store}.get(name);
                return value === undefined ? undefined : {{ value }};
              }},
              set: (name: string, value: string) => {{
                {store}.set(name, value);
              }},
              delete: (name: string) => {{
                {store}.delete(name);
              }},
            }})),
          }}));'''.replace('          ', '')

          # order-create-paths: protected import route plus public/domain paths.
          path = Path('src/lib/data/__tests__/order-create-paths.test.ts')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'// ── Mock next/headers cookies\(\).*?(?=vi\.mock\("next/headers")',
              '// Protected import-route scenarios use one real revocable session.\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'{path}: comment block not found')
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          old_import = '''  seedStorefront,
            seedProduct,
          } from "@/app/api/__tests__/helpers";'''.replace('          ', '')
          new_import = '''  seedStorefront,
            seedProduct,
            establishAuthenticatedTestSession,
          } from "@/app/api/__tests__/helpers";'''.replace('          ', '')
          if text.count(old_import) != 1:
              raise SystemExit(f'{path}: helpers import shape not found')
          text = text.replace(old_import, new_import, 1)
          old_before = '''beforeEach(async () => {
            await cleanDb();
            listOrdersMock.mockReset();'''.replace('          ', '')
          new_before = '''beforeEach(async () => {
            await cleanDb();
            authCookieStore.clear();
            delete process.env.AUTH_SECRET;
            await establishAuthenticatedTestSession();
            listOrdersMock.mockReset();'''.replace('          ', '')
          if text.count(old_before) != 1:
              raise SystemExit(f'{path}: beforeEach not found')
          text = text.replace(old_before, new_before, 1)
          text = text.replace(
              '''afterAll(async () => {
            await rawDb.$disconnect();
          });'''.replace('          ', ''),
              '''afterAll(async () => {
            authCookieStore.clear();
            delete process.env.AUTH_SECRET;
            await rawDb.$disconnect();
          });'''.replace('          ', ''),
              1,
          )
          path.write_text(text, encoding='utf-8')

          # automation route integration fixture.
          path = Path('src/lib/automations/__tests__/order-triggers.test.ts')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'// ── Mock next/headers cookies\(\).*?(?=vi\.mock\("next/headers")',
              '// Protected delivery-route scenarios use one real revocable session.\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'{path}: comment block not found')
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          helper_line = 'import { rawDb, cleanDb, mockPost, getJson, seedProduct } from "@/app/api/__tests__/helpers";'
          replacement = 'import { rawDb, cleanDb, mockPost, getJson, seedProduct, establishAuthenticatedTestSession } from "@/app/api/__tests__/helpers";'
          if text.count(helper_line) != 1:
              raise SystemExit(f'{path}: helper import not found')
          text = text.replace(helper_line, replacement, 1)
          text = text.replace(
              '''  beforeEach(async () => {
              await cleanDb();
              mockAdapter.createShipment.mockReset();'''.replace('            ', ''),
              '''  beforeEach(async () => {
              await cleanDb();
              authCookieStore.clear();
              delete process.env.AUTH_SECRET;
              await establishAuthenticatedTestSession();
              mockAdapter.createShipment.mockReset();'''.replace('            ', ''),
              1,
          )
          text = text.replace(
              '''  afterAll(async () => {
              await rawDb.$disconnect();
            });'''.replace('            ', ''),
              '''  afterAll(async () => {
              authCookieStore.clear();
              delete process.env.AUTH_SECRET;
              await rawDb.$disconnect();
            });'''.replace('            ', ''),
              1,
          )
          path.write_text(text, encoding='utf-8')

          # return/refund route integration uses createTestPrisma on the same sandbox DB.
          path = Path('src/lib/data/__tests__/return-refund-integrity.test.ts')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'// ── Mock next/headers.*?(?=vi\.mock\("next/headers")',
              '// The protected return route uses one real revocable session per test.\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'{path}: comment block not found')
          text, count = empty_mock.subn(cookie_mock('authCookieStore'), text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: empty cookie mock not found')
          helper_line = 'import { mockPost } from "@/app/api/__tests__/helpers";'
          replacement = 'import { establishAuthenticatedTestSession, mockPost } from "@/app/api/__tests__/helpers";'
          if text.count(helper_line) != 1:
              raise SystemExit(f'{path}: helper import not found')
          text = text.replace(helper_line, replacement, 1)
          text = text.replace(
              '''beforeEach(async () => {
            db = await createTestPrisma();
          });'''.replace('          ', ''),
              '''beforeEach(async () => {
            db = await createTestPrisma();
            authCookieStore.clear();
            delete process.env.AUTH_SECRET;
            await establishAuthenticatedTestSession();
          });'''.replace('          ', ''),
              1,
          )
          text = text.replace(
              '''afterEach(async () => {
            await disconnectTestPrisma(db);
          });'''.replace('          ', ''),
              '''afterEach(async () => {
            authCookieStore.clear();
            delete process.env.AUTH_SECRET;
            await disconnectTestPrisma(db);
          });'''.replace('          ', ''),
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Prove the legacy pattern is gone repository-wide.
          remaining = []
          for candidate in sorted(Path('src').rglob('*.test.ts')) + sorted(Path('src').rglob('*.test.tsx')):
              value = candidate.read_text(encoding='utf-8')
              if 'vi.mock("next/headers"' not in value:
                  continue
              if 'get: () => undefined' in value or 'get: vi.fn(() => undefined)' in value:
                  remaining.append(str(candidate))
              elif 'setup mode' in value and 'requireAuth' in value:
                  remaining.append(str(candidate))
          if remaining:
              raise SystemExit('remaining legacy auth fixtures:\n' + '\n'.join(remaining))
          PY

          git diff --check
          git diff --stat
          git rm .github/workflows/agent-final-auth-fixtures.yml
          git config user.name "sahelflow-agent"
          git config user.email "agent@sahelflow.local"
          git add src
          git commit -m "test(auth): finish explicit route session fixtures"
          git push origin HEAD:agent/phase2-session-freshness
