name: Phase 3 Level 2 source checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase3-level2-source-checkpoint
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Verify and publish Phase 3 source authority
    if: ${{ github.event.pull_request.head.ref == 'agent/phase3-durable-effects-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SF_TEST_ROOT: /tmp/sahelflow-phase3-level2
      SF_DATA_DIR: /tmp/sahelflow-phase3-level2/data
      DATABASE_URL: file:/tmp/sahelflow-phase3-level2/data/shops/test.db
      SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply source authority reconciliation
        run: python .github/phase3-source-authority-reconciliation.py

      - name: Apply generated audit fixup
        run: python .github/phase3-source-authority-fixup.py

      - name: Allow cross-package courier authority inspection
        run: python .github/phase3-courier-closure-allowlist.py

      - name: Format machine authority and audit source
        run: >-
          bunx prettier --write
          .github/phase-checkpoints/phase3-durable-effects.json
          .github/phase-checkpoints/phase3-commerce-runtime.json
          .github/phase-checkpoints/phase3-provider-convergence.json
          src/lib/integrations/__tests__/phase3-source-closure.test.ts
          src/lib/delivery/__tests__/canonical-courier-closure.integration.test.ts
          scripts/sf-audit.ts

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable test sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase3-level2

      - name: Authority and documentation
        run: |
          bun run sf-version
          bun run sf-audit

      - name: Complete source, database and integration gate
        run: bun run sf-verify

      - name: Migration status
        run: bunx prisma migrate status

      - name: Production WhatsApp sidecar build
        run: bun run build:sidecar

      - name: Production Next build
        run: bun run build

      - name: Commit source-complete authority only
        run: |
          git config user.name "SahelFlow Phase 3 Checkpoint"
          git config user.email "actions@users.noreply.github.com"
          git add \
            AGENTS.md \
            README.md \
            CHANGELOG.md \
            documentation/README.md \
            documentation/system/CURRENT_STATE.md \
            documentation/system/ROADMAP.md \
            documentation/operations/WORKING_MEMORY.md \
            scripts/sf-audit.ts \
            src/lib/delivery/__tests__/canonical-courier-closure.integration.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Phase 3 source authority is already reconciled"
          else
            git commit -m "docs(phase3): record source-complete evidence-open frontier"
            git push origin HEAD:agent/phase3-durable-effects-audit
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-level2-source-diagnostics
          path: |
            .sf-vitest-first-failure.txt
            .sf-vitest-failures.txt
            .next/trace
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3
