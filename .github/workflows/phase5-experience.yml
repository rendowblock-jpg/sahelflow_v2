name: Phase 5 Experience Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: phase5-experience-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  classify:
    name: Classify Phase 5 evidence need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_phase5: ${{ steps.risk.outputs.run_phase5 }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Classify changed paths
        id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/sahelflow-changed-paths"
          bun scripts/classify-pr-risk.ts < "${RUNNER_TEMP}/sahelflow-changed-paths" | tee -a "${GITHUB_OUTPUT}"

      - name: Record Phase 5 decision
        env:
          RUN_PHASE5: ${{ steps.risk.outputs.run_phase5 }}
        run: |
          echo "Phase 5 browser evidence required: ${RUN_PHASE5}" >> "${GITHUB_STEP_SUMMARY}"

  static-experience:
    name: Static route completion matrix
    needs: classify
    if: ${{ github.event.pull_request.draft == false && needs.classify.outputs.run_phase5 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-static
      SF_DATA_DIR: /tmp/sahelflow-phase5-static/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-static/data/shops/test.db
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable static-evidence sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-static

      - name: Generate exact-head repository inventory
        run: bun run sf-inventory

      - name: Verify Phase 5 route completion matrix
        run: bun run sf-phase5-experience

      - name: Upload Phase 5 route evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-route-completion-${{ github.run_id }}
          path: .sf-inventory/phase5-experience
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  fresh-auth:
    name: Fresh install + owner login (1366x768)
    needs: [classify, static-experience]
    if: ${{ needs.classify.outputs.run_phase5 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-auth
      SF_DATA_DIR: /tmp/sahelflow-phase5-auth/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-auth/data/shops/test.db
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable fresh-install sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-auth

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run fresh-install browser journey without retries
        run: bunx playwright test --retries=0 e2e/phase5-auth-entry.spec.ts

      - name: Upload fresh-install visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-auth-browser-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  representative-desktop:
    name: Representative LTR + Arabic RTL workbenches
    needs: [classify, static-experience]
    if: ${{ needs.classify.outputs.run_phase5 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-representative
      SF_DATA_DIR: /tmp/sahelflow-phase5-representative/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-representative/data/shops/test.db
      AUTH_SECRET: dev-auth-secret-for-testing-only-not-production
      SF_PHASE5_OWNER_STORAGE_STATE: /tmp/sahelflow-phase5-representative/owner-storage-state.json
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable representative-data sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-representative

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Seed representative Algerian COD data
        run: bun run seed:rich

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run retry-free controlled desktop, live locale, Founder visual, flagship workspace and Storefront Studio journeys
        run: bunx playwright test --retries=0 e2e/phase5-experience.spec.ts e2e/language-switch.spec.ts e2e/founder-visual-acceptance.spec.ts e2e/inbox-workspace.spec.ts e2e/ai-workspace.spec.ts e2e/settings-workspace.spec.ts e2e/storefront-studio.spec.ts e2e/phase5-command-touch.spec.ts

      - name: Upload rendered Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-rendered-browser-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  phase5-experience-gate:
    name: Required Phase 5 Experience gate
    if: always()
    needs:
      - classify
      - static-experience
      - fresh-auth
      - representative-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require risk-selected Phase 5 evidence
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          RUN_PHASE5: ${{ needs.classify.outputs.run_phase5 }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          STATIC_RESULT: ${{ needs.static-experience.result }}
          AUTH_RESULT: ${{ needs.fresh-auth.result }}
          REPRESENTATIVE_RESULT: ${{ needs.representative-desktop.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLASSIFY_RESULT}" == "success" ]] || { echo "Phase 5 risk classification failed: ${CLASSIFY_RESULT}"; exit 1; }
          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "Draft PR: Phase 5 rendered experience gate is intentionally deferred."
            exit 0
          fi
          if [[ "${RUN_PHASE5}" != "true" ]]; then
            echo "Risk classifier: application/browser experience is unchanged; Phase 5 browser matrix is not required for this exact head."
            exit 0
          fi
          [[ "${STATIC_RESULT}" == "success" ]] || { echo "Static Phase 5 experience verification failed or was skipped: ${STATIC_RESULT}"; exit 1; }
          [[ "${AUTH_RESULT}" == "success" ]] || { echo "Fresh-install auth journey failed or was skipped: ${AUTH_RESULT}"; exit 1; }
          [[ "${REPRESENTATIVE_RESULT}" == "success" ]] || { echo "Representative desktop/RTL journey failed or was skipped: ${REPRESENTATIVE_RESULT}"; exit 1; }
          echo "Phase 5 experience evidence is complete for this exact PR head."
