name: Phase 5 Experience Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: phase5-experience-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SF_MASTER_KEY: ${{ secrets.SF_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static-experience:
    name: Static route completion matrix
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-static
      SF_DATA_DIR: /tmp/sahelflow-phase5-static/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-static/data/shops/test.db
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable static-evidence sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-static

      - name: Generate exact-head repository inventory
        run: bun run sf-inventory

      - name: Verify Phase 5 route completion matrix
        run: bun run sf-phase5-experience

      - name: Upload Phase 5 route evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-route-completion-${{ github.run_id }}
          path: .sf-inventory/phase5-experience
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  fresh-auth:
    name: Fresh install + owner login (1366x768)
    needs: static-experience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-auth
      SF_DATA_DIR: /tmp/sahelflow-phase5-auth/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-auth/data/shops/test.db
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable fresh-install sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-auth

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run fresh-install browser journey
        run: bunx playwright test e2e/phase5-auth-entry.spec.ts

      - name: Upload fresh-install visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-auth-browser-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  representative-desktop:
    name: Representative LTR + Arabic RTL workbenches
    needs: static-experience
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_TEST_ROOT: /tmp/sahelflow-phase5-representative
      SF_DATA_DIR: /tmp/sahelflow-phase5-representative/data
      DATABASE_URL: file:/tmp/sahelflow-phase5-representative/data/shops/test.db
      AUTH_SECRET: dev-auth-secret-for-testing-only-not-production
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Prepare disposable representative-data sandbox
        run: bun run test:sandbox -- /tmp/sahelflow-phase5-representative

      - name: Deploy migrations
        run: bunx prisma migrate deploy

      - name: Seed representative Algerian COD data
        run: bun run seed:rich

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run controlled desktop and RTL journeys
        run: bunx playwright test e2e/phase5-experience.spec.ts

      - name: Upload rendered Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-rendered-browser-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  phase5-experience-gate:
    name: Required Phase 5 Experience gate
    if: always()
    needs:
      - static-experience
      - fresh-auth
      - representative-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require static and rendered Phase 5 evidence
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          STATIC_RESULT: ${{ needs.static-experience.result }}
          AUTH_RESULT: ${{ needs.fresh-auth.result }}
          REPRESENTATIVE_RESULT: ${{ needs.representative-desktop.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "Draft PR: Phase 5 rendered experience gate is intentionally deferred."
            exit 0
          fi
          [[ "${STATIC_RESULT}" == "success" ]] || { echo "Static Phase 5 experience verification failed or was skipped: ${STATIC_RESULT}"; exit 1; }
          [[ "${AUTH_RESULT}" == "success" ]] || { echo "Fresh-install auth journey failed or was skipped: ${AUTH_RESULT}"; exit 1; }
          [[ "${REPRESENTATIVE_RESULT}" == "success" ]] || { echo "Representative desktop/RTL journey failed or was skipped: ${REPRESENTATIVE_RESULT}"; exit 1; }
          echo "Phase 5 experience evidence is complete for this exact PR head."
