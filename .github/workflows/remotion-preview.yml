name: Remotion Premium V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "marketing/remotion/src/v2/**"
      - "marketing/remotion/src/components.tsx"
      - "marketing/remotion/src/compositions.tsx"
      - "marketing/remotion/src/theme.ts"
      - "marketing/remotion/scripts/generate-score.mjs"
      - ".github/workflows/remotion-preview.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate premium video system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing/remotion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install premium Remotion workspace
        run: npm install --no-audit --no-fund

      - name: Typecheck premium compositions
        run: npm run typecheck

  render:
    name: Render premium ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: vertical
            label: vertical 15s cut
            script: render:vertical
            output: renders/sahelflow-premium-vertical-15.mp4
          - key: social
            label: social 30s cut
            script: render:social
            output: renders/sahelflow-premium-social-30.mp4
          - key: launch
            label: launch 60s film
            script: render:launch
            output: renders/sahelflow-premium-launch-60.mp4
          - key: demo
            label: guided 90s demo
            script: render:demo
            output: renders/sahelflow-premium-demo-90.mp4
    defaults:
      run:
        working-directory: marketing/remotion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install premium Remotion workspace
        run: npm install --no-audit --no-fund

      - name: Render premium ${{ matrix.key }} master
        shell: bash
        run: |
          set +e
          npm run "${{ matrix.script }}" > "${{ matrix.key }}-render.log" 2>&1
          status=$?
          tail -180 "${{ matrix.key }}-render.log"
          exit $status

      - name: Upload ${{ matrix.key }} render diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sahelflow-premium-v2-${{ matrix.key }}-diagnostics
          path: marketing/remotion/${{ matrix.key }}-render.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload premium ${{ matrix.key }} master
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sahelflow-premium-v2-${{ matrix.key }}
          path: marketing/remotion/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
