name: Remotion Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "marketing/remotion/**"
      - ".github/workflows/remotion-preview.yml"

permissions:
  contents: read

jobs:
  typecheck-and-render:
    name: Typecheck and render complete video set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: marketing/remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Remotion workspace
        run: npm install --no-audit --no-fund

      - name: Typecheck compositions
        run: npm run typecheck

      - name: Render vertical cut
        shell: bash
        run: |
          set +e
          npm run render:vertical > vertical-render.log 2>&1
          status=$?
          tail -120 vertical-render.log
          exit $status

      - name: Render social cut
        shell: bash
        run: |
          set +e
          npm run render:social > social-render.log 2>&1
          status=$?
          tail -120 social-render.log
          exit $status

      - name: Render launch film
        shell: bash
        run: |
          set +e
          npm run render:launch > launch-render.log 2>&1
          status=$?
          tail -120 launch-render.log
          exit $status

      - name: Render guided demo
        shell: bash
        run: |
          set +e
          npm run render:demo > demo-render.log 2>&1
          status=$?
          tail -120 demo-render.log
          exit $status

      - name: Upload render diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sahelflow-remotion-render-diagnostics
          path: marketing/remotion/*-render.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload complete MP4 set
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sahelflow-remotion-videos
          path: |
            marketing/remotion/renders/sahelflow-vertical-15.mp4
            marketing/remotion/renders/sahelflow-social-30.mp4
            marketing/remotion/renders/sahelflow-launch-60.mp4
            marketing/remotion/renders/sahelflow-demo-90.mp4
          if-no-files-found: error
          retention-days: 14
