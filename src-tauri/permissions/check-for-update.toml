# The three commands of its own that the SahelFlow workspace page may call. The
# page is served from a loopback address, which Tauri treats as a remote
# origin, so it can reach an app command only if a capability names it here.
# check_for_update only looks for a signed update; it cannot download, install
# or stop anything by itself. download_update and install_downloaded_update do
# the same work as the updater plugin's own download and install commands (the
# page already holds `updater:default`, so nothing new is reachable) but tell the
# window about progress a few times a second instead of once per network chunk.
[[permission]]
identifier = "allow-check-for-update"
description = "Lets the SahelFlow workspace ask the desktop shell to look for a signed update."
commands.allow = ["check_for_update"]

[[permission]]
identifier = "allow-download-update"
description = "Lets the SahelFlow workspace ask the desktop shell to download the offered signed update, with throttled progress."
commands.allow = ["download_update"]

[[permission]]
identifier = "allow-install-downloaded-update"
description = "Lets the SahelFlow workspace ask the desktop shell to install the update it downloaded."
commands.allow = ["install_downloaded_update"]
