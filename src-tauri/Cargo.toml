[package]
name = "sahelflow"
version = "1.0.0-internal.13"
description = "AI-powered back-office for Algerian COD sellers"
authors = ["SahelFlow"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sahelflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
sha2 = "0.10"
fs2 = "0.4"
# T-M3: pin time to a range to avoid broken time_macros::timestamp in v0.3.50
# while still allowing patch-level updates within 0.3.x.
time = ">=0.3.41, <0.3.50"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
